# Stage A Memory - harness-provider-adapter
# 생성일: 2026-04-15
# 목적: KI-HARNESS-001 해소를 위한 live provider adapter 경계의 계약 기준선을 고정한다.

module_id: "harness-provider-adapter"
bounded_context: "harness-runtime"
domain: "system"

ubiquitous_language:
  - term: "Provider Route"
    definition: "HarnessRuntimeRouter가 계산한 mode/route_id/model tier 조합."
  - term: "Provider Adapter"
    definition: "route snapshot과 intake packet을 실제 LLM provider 호출 규약으로 변환하는 런타임 경계."
  - term: "Null Provider"
    definition: "자격증명 부재, 샌드박스, rollout off 상태에서 안전한 fallback 역할을 하는 테스트/오프라인 adapter."
  - term: "Budget Ceiling"
    definition: "선택된 tier에서 허용되는 입력/출력 토큰과 timeout 한도."
  - term: "Fallback Chain"
    definition: "provider timeout, rate limit, budget breach 시 다음 tier/provider로 내려가는 순서."
  - term: "Eval Ledger"
    definition: "provider 실행 메타를 응답 본문과 분리해 artifacts/evals에 누적하는 운영 증적."

invariants:
  - id: "INV-HPA-001"
    description: "provider selection은 HarnessRuntimeRouter route snapshot과 declared provider allowlist에서만 결정된다."
    enforcement: "contracts/harness/provider-adapter.yaml routing_policy + future provider port"
  - id: "INV-HPA-002"
    description: "provider 결과는 contracts/harness/output.schema.json을 만족하거나 structured FAIL envelope로 종료해야 한다."
    enforcement: "provider adapter output validation"
  - id: "INV-HPA-003"
    description: "timeout/retry/fallback 없이 live provider path를 열 수 없다."
    enforcement: "provider adapter contract + rollout review"
  - id: "INV-HPA-004"
    description: "provider metadata는 응답 본문이 아니라 telemetry/eval/release evidence에 기록한다."
    enforcement: "observability + eval logging policy"

permissions:
  - role: "system.operator"
    capabilities: ["inspect-provider-route", "run-provider-eval"]
    screens: ["system.dashboard", "system.quality"]
  - role: "system.admin"
    capabilities: ["promote-provider-rollout", "rollback-provider-route", "inspect-provider-route", "run-provider-eval"]
    screens: ["system.dashboard", "system.audit", "system.rollback"]

contracts:
  provider_adapter: "contracts/harness/provider-adapter.yaml"
  output: "contracts/harness/output.schema.json"
  intake: "contracts/harness/intake.schema.json"
  runtime_recipe: "master-shell/catalog/ai-runtime-recipes.yaml"

contract_version: "0.1.0"
contract_hash: "[확인 필요: CI 파이프라인 구성 후 자동 생성]"

capabilities_count: 4
events_emitted:
  - "harness.provider.selected"
  - "harness.provider.fallback"
  - "harness.eval.logged"
events_consumed: []

completed_at: "2026-04-15"
gate_result: "PASS"
gate_failures: []
notes: |
  KI-HARNESS-001의 첫 해소 단계로 실제 live provider wiring 전에 계약/용어/불변조건을 먼저 고정했다.
  응답 본문 계약은 기존 output.schema를 유지하고, provider metadata는 telemetry/eval/release evidence로 분리한다.
