# Stage A Memory - task-management
# 생성일: 2026-03-17
# 이 파일은 Stage A 완료 스냅샷이다.
# 조합기와 마스터 UI는 코드보다 이 파일을 먼저 읽는다.

module_id: "task-management"
bounded_context: "task-tracking"
domain: "productivity"

ubiquitous_language:
  - term: "작업 (Task)"
    definition: "완료 가능한 최소 업무 단위. 제목, 담당자, 마감일, 상태를 가진다."
  - term: "작업 상태 (Task Status)"
    definition: "PENDING → IN_PROGRESS → DONE 또는 CANCELLED. 역전이 불가."
  - term: "담당자 (Assignee)"
    definition: "작업을 실제로 수행할 책임을 가진 사람. 한 작업에 최소 1명 필수."
  - term: "마감일 (Due Date)"
    definition: "작업이 완료되어야 하는 날짜. 과거 날짜로 생성 불가."
  - term: "작업 목록 화면 (Task List View)"
    definition: "담당자별·상태별로 작업을 조회하는 도메인 화면."
  - term: "작업 상세 화면 (Task Detail View)"
    definition: "단일 작업의 전체 정보를 보고 상태 전이·담당자 변경을 수행하는 도메인 화면."

invariants:
  - id: "INV001"
    description: "담당자 없는 작업은 생성할 수 없다"
    enforcement: "create-task/reassign-task capability precondition + 도메인 엔티티"
  - id: "INV002"
    description: "DONE 또는 CANCELLED 상태에서 IN_PROGRESS로 역전이 불가 (terminal 상태)"
    enforcement: "transition-task-status capability precondition + TaskStatus value object"
  - id: "INV003"
    description: "마감일은 오늘 이상이어야 한다 (오늘 포함 허용, 어제 이전 불가)"
    enforcement: "create-task capability precondition + Task.create()"
  - id: "INV004"
    description: "DONE 상태 작업은 담당자를 변경할 수 없다 (CANCELLED는 변경 가능)"
    enforcement: "reassign-task capability precondition + TaskDomainService.canReassign()"
    discovered_by: "Stage E 적대적 검증 (갭-1)"
    added_at: "2026-03-17"

permissions:
  - role: "task-owner"
    capabilities: ["create-task", "get-task", "list-tasks", "transition-task-status", "reassign-task"]
    screens: ["task-list", "task-detail", "task-create"]
  - role: "task-viewer"
    capabilities: ["get-task", "list-tasks"]
    screens: ["task-list", "task-detail"]

contracts:
  http: "domains/productivity/task-tracking/contract/openapi.yaml"
  events: "domains/productivity/task-tracking/contract/events.schema.json"
  ui: "domains/productivity/task-tracking/contract/ui-contract.yaml"
  capability: "domains/productivity/task-tracking/contract/capability.yaml"

contract_version: "0.1.0"
contract_hash: "[확인 필요: CI 파이프라인 구성 후 자동 생성]"

capabilities_count: 5
events_emitted: ["TaskCreated", "TaskStatusChanged", "TaskReassigned"]
events_consumed: []

completed_at: "2026-03-17"
gate_result: "PASS"
gate_failures: []
notes: |
  Stage A 1차 실행 (2026-03-17): 뼈대 초기화 직후 실행. 구현 코드 없음.
  Stage E 갱신 (2026-03-17): INV004 추가 (DONE 상태 담당자 변경 불가).
  capability.yaml v0.1.0 → 갭-1 수정 반영. Stage A 재실행 없이 memory만 갱신.
  (contract 내 invariant 추가이므로 bounded context 경계 변경 없음 — routing 판단 기준 참조)
