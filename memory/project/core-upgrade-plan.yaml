# Workflow OS - 코어 업그레이드 장기 계획
as_of: "2026-03-18"
plan_version: "1.0.0"
repository_role: "격리 모듈 생성·조합·검증을 위한 코어 플랫폼"
north_star: >
  requirements와 계획만 바꾸면 1차 모듈, 2차 조합 모듈, 3차 화면 도메인 기능까지
  계약 중심으로 안전하게 진화하는 Workflow OS를 만든다.
first_expansion_domain: "video"
operating_mode: "continuous-safe-upgrade"

decision_order:
  - "requirements와 memory를 먼저 읽는다"
  - "contract와 ADR을 그 다음 읽는다"
  - "코드는 마지막에 읽고 최소 범위로 수정한다"
  - "관련 검증을 직접 실행한 뒤에만 완료 선언한다"

benchmark_policy:
  source_priority:
    - "저장소 내부 요구사항, ADR, memory, contract"
    - "공식 문서와 1차 표준 문서"
    - "검증 가능한 최신 자료와 벤치마크"
  research_rules:
    - "최신성 영향을 받는 기술 선택은 반드시 확인 후 반영한다"
    - "보안, 공급망, 운영 기준은 OWASP/NIST/SLSA 등 1차 표준을 우선한다"
    - "새 프레임워크나 도구 도입보다 격리성, 반복 가능성, 검증 가능성을 우선한다"

guardrails:
  - "모듈 간 직접 코드 참조 금지"
  - "도메인 코어는 UI/DB/프레임워크를 모른다"
  - "계약 없는 공개 기능은 추가하지 않는다"
  - "구조 판단은 ADR 없이 지나가지 않는다"
  - "품질 게이트 FAIL 또는 미검증 상태에서 완료 선언하지 않는다"
  - "사용자 작업과 기존 안정 동작을 되돌리지 않는다"

evolution_tracks:
  - id: "CORE-QUALITY"
    title: "품질 게이트 자동화"
    objective: "저장소 전역에서 반복 가능한 테스트, lint, type-check, static-analysis 체계를 만든다."
    status: "in_progress"
    milestones:
      - "repo-wide lint/static-analysis"
      - "type-check baseline"
      - "contract test harness"
      - "property/adversarial regression expansion"

  - id: "CORE-CONTRACT"
    title: "계약 우선 개발 강화"
    objective: "OpenAPI, event schema, UI contract, capability와 구현의 드리프트를 자동 검출한다."
    status: "in_progress"
    milestones:
      - "contract drift detection"
      - "capability-to-interface traceability"
      - "master-shell composition validation"

  - id: "CORE-OPERATIONS"
    title: "운영 안정성 기준선"
    objective: "관측성, 롤백, 플래그, 운영 로그를 코어 표준으로 만든다."
    status: "pending"
    milestones:
      - "observability baseline"
      - "rollback playbook"
      - "feature-flag rollout policy"

  - id: "CORE-SUPPLY-CHAIN"
    title: "공급망 신뢰성"
    objective: "SBOM, provenance, dependency policy, release evidence를 남기는 자동화 바탕을 만든다."
    status: "pending"
    milestones:
      - "sbom generation path"
      - "provenance evidence policy"
      - "release checklist alignment"

  - id: "CORE-COMPOSITION"
    title: "도메인 조합/마스터 셸 규율"
    objective: "plugin registry, navigation, catalog, feature flag를 일관된 계약으로 묶는다."
    status: "pending"
    milestones:
      - "registry validation"
      - "navigation/catalog coherence checks"
      - "slot/entry-point composition rules"

  - id: "DOMAIN-VIDEO"
    title: "첫 확장 도메인 video 온보딩"
    objective: "video 도메인을 코어의 첫 번째 확장 검증 대상으로 삼아 생성 흐름을 고도화한다."
    status: "pending"
    milestones:
      - "requirements blueprint"
      - "risk profiling"
      - "stage A contract generation"

execution_loop:
  - step: 1
    action: "current-state.yaml, core-upgrade-plan.yaml, unresolved-risks.yaml, next-actions.yaml을 읽는다"
  - step: 2
    action: "가장 우선순위 높은 미완료 작업 1개 이상을 고른다"
  - step: 3
    action: "관련 코드, 계약, 문서, memory, worklog를 끝까지 일관되게 수정한다"
  - step: 4
    action: "관련 테스트와 검증을 실행하고 실패 시 즉시 수정 후 재실행한다"
  - step: 5
    action: "구조적 판단은 ADR 또는 plan/memory 업데이트로 남긴다"
  - step: 6
    action: "안전하면 다음 우선순위 작업으로 같은 턴에서 계속 진행한다"

priority_backlog:
  - id: "P-001"
    track: "CORE-QUALITY"
    title: "전역 lint/static-analysis 정렬"
    status: "next"
    why_now: "현재 품질 게이트가 일부 도메인에 편중되어 코어 플랫폼 신뢰도가 낮다."

  - id: "P-002"
    track: "CORE-QUALITY"
    title: "JSDoc+tsc 기반 타입 경계 도입"
    status: "next"
    why_now: "모듈 조합이 커질수록 포트/계약/직렬화 경계에서 타입 붕괴 위험이 커진다."

  - id: "P-003"
    track: "CORE-CONTRACT"
    title: "contract drift 검증 하네스"
    status: "next"
    why_now: "격리 아키텍처의 핵심 신뢰성은 계약과 구현의 일치성에 달려 있다."

  - id: "P-004"
    track: "CORE-COMPOSITION"
    title: "마스터 셸 조합 규칙 검증"
    status: "queued"
    why_now: "여러 도메인이 붙기 시작하면 registry/nav/catalog 간 불일치가 가장 먼저 문제를 만든다."

  - id: "P-005"
    track: "CORE-OPERATIONS"
    title: "관측성/플래그/롤백 표준화"
    status: "queued"
    why_now: "자동화 파이프라인이 커지기 전에 운영 기준이 먼저 굳어져야 한다."

  - id: "P-006"
    track: "CORE-SUPPLY-CHAIN"
    title: "SBOM/Provenance 증적 경로 정의"
    status: "queued"
    why_now: "향후 모듈 자동 생성량이 늘면 배포 증적 누락 비용이 커진다."

  - id: "P-007"
    track: "DOMAIN-VIDEO"
    title: "video 도메인 요구사항 초안과 리스크 프로파일"
    status: "queued"
    why_now: "첫 확장 도메인이 코어의 확장성 검증 대상이기 때문이다."
