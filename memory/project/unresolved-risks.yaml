# Workflow OS - 미해결 리스크 목록
as_of: "2026-03-19"

risks:
  - id: "R-PLAT-001"
    category: "quality"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "저장소 전역 품질 게이트 범위 불균형은 완화되었지만, 새 경로 추가 시 스크립트 유지가 필요하다."
    impact: "현재 핵심 JS 경로는 검증되지만, 향후 디렉터리 확장 시 스크립트 갱신이 누락되면 회귀 공백이 다시 생길 수 있다"
    mitigation:
      - "repo-wide lint/static-analysis 범위 정렬"
      - "공통 검증 스크립트 정비"
      - "새 루트 추가 시 lint:syntax/lint:eslint 대상 동기화"

  - id: "R-PLAT-002"
    category: "type-safety"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "핵심 경계에 대한 JSDoc 기반 타입 검증은 도입됐지만, 향후 `tsc` 연동과 더 넓은 파일 범위 확대가 필요하다."
    impact: "포트/엔티티/인터페이스 경계는 보호되지만, 코어 전체 정적 타입 검증까지는 아직 확장되지 않았다"
    mitigation:
      - "JSDoc+tsc 또는 동등한 타입 점검 도입"
      - "포트/DTO 경계 우선 보강"
      - "추후 TypeScript/tsc 도입 시 현 JSDoc 경계를 이행 자산으로 전환"

  - id: "R-PLAT-003"
    category: "contract"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "OpenAPI/UI/Capability 계약과 구현의 기본 드리프트 검출은 도입됐지만, 응답 스키마·이벤트·라우팅 규칙을 더 넓은 도메인 변화에 맞춰 유지해야 한다."
    impact: "기본 교차 검증은 가능하지만 새 계약 패턴이 늘면 검증 규칙도 함께 확장되어야 한다"
    mitigation:
      - "contract-tests 하네스 도입"
      - "capability-to-interface traceability 규칙 추가"
      - "새 계약 패턴 추가 시 validate_contract_drift.py 규칙 동기화"

  - id: "R-PLAT-004"
    category: "operations"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "관측성, 롤백, feature flag 운영 기준선은 구조화됐지만 실제 배포/모니터링 시스템 연결은 아직 남아 있다."
    impact: "코어 저장소 내부 검증은 가능하지만, 실제 운영 환경 연동 전까지는 실행 계층 리스크가 남는다"
    mitigation:
      - "registry ↔ observability 참조 정합성 자동 검증"
      - "observability baseline 수립"
      - "rollback playbook 및 rollout 규칙 정리"
      - "실제 dashboard/alert backend 매핑은 Phase 2 운영 환경에서 연결"

  - id: "R-PLAT-005"
    category: "supply_chain"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "SBOM과 provenance baseline은 생겼지만, 실제 CI/CD 서명 체계와 release evidence 자동 업로드는 아직 남아 있다."
    impact: "저장소 내부 증적은 생성되지만, 외부 배포 체계와 결합되기 전까지는 release pipeline 완결성이 부족하다"
    mitigation:
      - "SBOM 산출 위치/명령 표준화"
      - "provenance 증적 정책 정의"
      - "실제 CI/CD artifact upload와 서명 체계는 Phase 2에서 연결"

  - id: "R-PLAT-006"
    category: "security"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "authn-authz와 controller-level e2e smoke 게이트는 정착됐지만, 실제 네트워크 서버 구동 smoke는 아직 없다."
    impact: "저장소 내부 인터페이스 회귀는 빠르게 탐지되지만, transport/runtime wiring 문제는 실제 서버 smoke 전까지 남는다"
    mitigation:
      - "test:authn-authz 실동작화"
      - "test:e2e-smoke controller-level 기준선 도입"
      - "Phase 2에서 실제 서버 기동 smoke 추가"

  - id: "R-PLAT-007"
    category: "security"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "dependency-scan baseline 은 실동작화됐지만, 현재는 오프라인 lockfile 검증 중심이다."
    impact: "저장소 내부 유입 통제와 무결성은 탐지되지만, 외부 advisory DB 기반 CVE 탐지는 아직 연결되지 않았다"
    mitigation:
      - "lockfile 기반 dependency baseline validator 도입"
      - "runtime/dev dependency 분리 판정"
      - "quality gate 문서와 current-state 판정 근거 일치화"

  - id: "R-PLAT-009"
    category: "security"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "online advisory 전략은 문서화됐지만, 실제 provider 실행은 아직 CI/GitHub 환경에 연결되지 않았다."
    impact: "차단 규칙은 정해졌지만, 실제 온라인 advisory 데이터는 Phase 2 연동 전까지 자동 수집되지 않는다"
    mitigation:
      - "오프라인 baseline 과 온라인 advisory scan 역할 분리"
      - "ADR 0008 로 blocking policy 고정"
      - "Phase 2 에 npm audit 또는 동등한 advisory feed 연동"
      - "차단 정책과 허용 예외를 ADR 또는 정책 문서로 고정"

  - id: "R-PLAT-010"
    category: "operations"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "branch protection 기준선은 저장소 안에 고정됐지만, 실제 GitHub 원격 적용은 아직 수동 설정에 의존한다."
    impact: "required checks 와 보호 규칙의 기준선은 명확하지만, 원격 저장소 설정이 어긋나면 실제 강제력이 약해질 수 있다"
    mitigation:
      - "branch protection 기준선 문서화"
      - "required checks 와 merge policy 체크리스트 추가"
      - "원격 GitHub 설정과 저장소 내부 규칙 역할 분리"

  - id: "R-PLAT-011"
    category: "operations"
    severity: "medium"
    status: "open"
    owner: "core-platform"
    description: "GitHub 원격 branch protection 의 실제 설정값을 저장소 안에서 자동 비교하는 단계는 아직 없다."
    impact: "정책 파일과 실제 GitHub 설정이 장기적으로 드리프트할 수 있다"
    mitigation:
      - "branch protection policy file 유지"
      - "원격 설정 점검 절차 문서화"
      - "가능한 환경에서 GitHub API 기반 drift check 추가"

  - id: "R-PLAT-008"
    category: "operations"
    severity: "medium"
    status: "mitigated"
    owner: "core-platform"
    description: "git 브랜치/PR/release evidence 기준선은 생겼지만, 실제 원격 보호 규칙과 PR 자동화는 아직 GitHub 설정에 의존한다."
    impact: "저장소 내부 규칙은 생겼지만, 원격 branch protection과 merge policy가 없으면 운영 강제력이 약할 수 있다"
    mitigation:
      - "ADR 0007로 규칙 문서화"
      - "PR template 추가"
      - "release evidence generator baseline 추가"
      - "원격 branch protection과 PR policy는 GitHub 설정에서 추가"

  - id: "R-DOM-VIDEO-001"
    category: "domain_onboarding"
    severity: "medium"
    status: "open"
    owner: "domain-factory"
    description: "첫 확장 도메인 video의 bounded context와 계약 전략이 아직 문서화되지 않았다."
    impact: "코어 플랫폼의 확장성 검증이 지연될 수 있다"
    mitigation:
      - "video requirements 초안 작성"
      - "risk level과 product tier 결정"
      - "Stage A 진입 조건 명시"
