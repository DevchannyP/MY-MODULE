# created_at: 2026-03-30
# owner:      Workflow OS 설계자
# north_star: >
#   마스터 UI의 모든 페이지가 시스템 OS의 실시간 상태를 반영하고,
#   사용자가 UI를 통해 도메인 라이프사이클·피처 플래그·롤백·품질 게이트를
#   단일 창에서 직접 조작할 수 있는 살아있는 운영 포털을 만든다.
