    - "artifacts/mindmap/index.html 를 통합 통제 허브로 승격"
    - "상단 상태바 + 좌측 통제 네비 + 하단 계획표 + 모듈 생성 dry-run/create UI 연결"
    - "planning-studio scaffold-preview / scaffold-create 서버 경로 추가"
  guardrails:
    - "계약 없는 API 추가 금지 — 모든 신규 엔드포인트는 Stage A 계약 먼저"
    - "기존 570/570 테스트를 깨지 않는다"
    - "domains/ 코드는 UI 관련 변경에서 건드리지 않는다 (contracts-only)"
    - "구조 판단 변경 시 ADR 필수"
    - "품질 게이트 FAIL 상태에서 다음 WP로 넘어가지 않는다"

