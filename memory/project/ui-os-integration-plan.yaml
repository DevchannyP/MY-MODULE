# =============================================================================
# 목표 상태 (To-Be)
# =============================================================================
target_state:
  unified_portal:
    description: >
      모든 artifact 페이지가 공통 헤더·사이드바·디자인 시스템을 공유하고
      실시간 시스템 상태를 자동 갱신하는 단일 운영 포털
  live_integration:
    description: >
      /api/v1/system/* REST + SSE 스트림이 시스템 OS 상태를 UI에 실시간 공급
  interactive_ops:
    description: >
      UI에서 피처 플래그 토글, 롤백 트리거, 도메인 라이프사이클 전환을
      권한 검증 후 직접 실행 가능
  quality_visibility:
    description: >
      품질 게이트 결과, 감사 로그, 워크 패킷 진행 상태가 UI에 실시간 노출

# =============================================================================
# 작업 패킷 (Work Packets) — Stage A → E 순서
# =============================================================================
work_packets:

  # ---------------------------------------------------------------------------
  # PHASE 1: 계약 설계 (Stage A)
  # ---------------------------------------------------------------------------

  - id: "WP-UI-001"
    phase: 1
    stage: "A"
    track: "UI-CONTRACT"
    title: "UI-OS 통합 계약 4종 설계"
    priority: 1
    status: "READY"
    depends_on: []
    agent: "architect"
    thinking: "ultrathink"
    description: >
      시스템 OS가 UI에 노출할 데이터의 계약을 정의한다.
      이 계약이 모든 후속 구현의 소스 오브 트루스가 된다.
    deliverables:
      - path: "contracts/system-api/capability.yaml"
        content: >
          System OS UI API 능력 선언
          — getHealth, getFlags, getCatalog, getAuditLog, getQualityGate,
            toggleFlag, triggerRollback, getDomainLifecycle
          각 능력의 권한(system.admin, domain.viewer) 명시
      - path: "contracts/system-api/openapi.yaml"
        content: >
          GET  /api/v1/system/health         → SystemHealthResponse
          GET  /api/v1/system/flags          → FeatureFlagListResponse
          PATCH /api/v1/system/flags/:id     → FeatureFlagUpdateResponse
          GET  /api/v1/system/catalog        → DomainCatalogResponse
          GET  /api/v1/system/audit?limit=N  → AuditLogResponse
          GET  /api/v1/system/quality-gate   → QualityGateStatusResponse
          POST /api/v1/system/rollback/:domain → RollbackResponse
          GET  /api/v1/system/lifecycle      → DomainLifecycleResponse
          GET  /api/v1/system/events         → SSE stream (text/event-stream)
      - path: "contracts/system-api/events.schema.json"
        content: >
          SSE 이벤트 스키마:
          system.health.updated, system.flag.toggled, system.rollback.triggered,
          system.quality-gate.updated, system.domain.lifecycle-changed
      - path: "contracts/ui-shell/ui-contract.yaml"
        content: >
          UI Shell 화면 계약:
          - DashboardHome: 헬스 점수 위젯, 도메인 카드, 최근 감사 로그
          - CatalogBrowser: 도메인 카탈로그 + 계약 인라인 뷰어
          - FeatureFlagPanel: 플래그 목록 + 권한 기반 토글
          - AuditLogViewer: 시계열 감사 로그 + 필터
          - QualityGateDashboard: 게이트 결과 히스토리 + 트렌드
          - DomainLifecycleMap: 도메인 Stage 진행 비주얼라이저
          - RollbackConsole: 롤백 트리거 + 확인 다이얼로그
    success_criteria:
      - "contracts/system-api/ 하위 4개 파일 생성 완료"
      - "모든 능력에 permission 필드 명시"
      - "openapi.yaml 응답 스키마 완전 정의"
      - "SSE 이벤트 스키마 JSON Schema 검증 가능"
    gate_check:
      - "node scripts/validate-contracts.js PASS"
      - "계약 파일 YAML/JSON 문법 검증 PASS"

  # ---------------------------------------------------------------------------
  # PHASE 2: 조합 설계 (Stage B)
  # ---------------------------------------------------------------------------

  - id: "WP-UI-002"
    phase: 2
    stage: "B"
    track: "UI-COMPOSITION"
    title: "UI Shell 조합 아키텍처 설계"
    priority: 2
    status: "READY"
    depends_on: ["WP-UI-001"]
    agent: "architect"
    thinking: "ultrathink"
    description: >
      UI Shell이 System API 계약을 어떻게 소비하는지,
      공통 디자인 시스템 컴포넌트는 어떻게 구성하는지,
      실시간 업데이트 플로우(SSE → DOM 갱신)는 어떤 패턴인지 설계한다.
    deliverables:
      - path: "memory/stageB/ui-shell-composition.yaml"
        content: >
          조합 결정:
          1. 공통 UI Shell 레이어: scripts/lib/ui-shell.js (CSS 토큰 + 공통 헤더)
          2. 데이터 어댑터 패턴: scripts/lib/system-api-client.js
             — fetch + SSE 구독 래퍼, 재시도 3회, 타임아웃 5s
          3. 렌더 엔진: 바닐라 JS 템플릿 리터럴 (프레임워크 의존성 0)
          4. SSE 연결 방식: EventSource → DOM 이벤트 디스패치 패턴
          5. 권한 분기: UI는 API 응답의 permitted 필드로 컨트롤 렌더링 결정
          6. 공통 컴포넌트 목록:
             - NavHeader (로고, 도메인 상태 배지, 사용자 롤 표시)
             - HealthScoreWidget (점수 게이지 + 트렌드 화살표)
             - DomainCard (이름, stage, 헬스, 플래그 상태)
             - AuditLogRow (타임스탬프, 액션, 결과, 배우)
             - QualityGateBadge (PASS/FAIL, 게이트 명)
             - FlagToggle (스위치 + 권한 비활성화)
             - RollbackButton (확인 모달 포함)
          7. 빌드 파이프라인: build-static-ui.js에 ui-shell.js 번들 단계 추가
      - path: "docs/adr/0012-ui-shell-composition-strategy.md"
        content: >
          ADR-0012: UI Shell을 별도 프레임워크 없이 바닐라 JS로 구현하는 결정
          — 이유: 의존성 최소화, SSR 불필요, 정적 배포 유지, 기존 빌드 파이프라인 호환
    success_criteria:
      - "memory/stageB/ui-shell-composition.yaml 완성"
      - "ADR-0012 생성 완료"
      - "node scripts/validate:composition PASS (UI Shell 어댑터 등록 포함)"
    gate_check:
      - "node scripts/validate:composition PASS"

  # ---------------------------------------------------------------------------
  # PHASE 3: 마스터 셸 등록 (Stage C)
  # ---------------------------------------------------------------------------

  - id: "WP-UI-003"
    phase: 3
    stage: "C"
    track: "MASTER-SHELL"
    title: "마스터 셸에 UI Shell API 플러그인 등록"
    priority: 3
    status: "READY"
    depends_on: ["WP-UI-002"]
    agent: "implementer"
    thinking: "normal"
    description: >
      System API를 마스터 셸 플러그인으로 공식 등록하고
      UI Shell 어댑터를 adapter-registry에 추가한다.
    deliverables:
      - path: "master-shell/plugin-registry/registry.yaml"
        change: >
          system-api-plugin 추가:
            id: system-api-plugin
            version: "1.0.0"
            entry_point: /
            feature_flag: system_api.enabled
            adapter_refs: [master-ui-plugin-shell, http-problem-details, feature-flag-provider, observability-otel]
            ui_contract: contracts/ui-shell/ui-contract.yaml
            capability_contract: contracts/system-api/capability.yaml
            openapi_contract: contracts/system-api/openapi.yaml
            events_contract: contracts/system-api/events.schema.json
            observability:
              dashboard: system-api-dashboard
              alert_group: system-api-alerts
      - path: "master-shell/navigation/nav.yaml"
        change: >
          system 그룹 추가:
            group: system
            label: "시스템 운영"
            items:
              - id: system-dashboard, route: /, label: "운영 대시보드", flag: system_api.enabled
              - id: system-catalog, route: /catalog, label: "도메인 카탈로그", flag: system_api.enabled
              - id: system-flags, route: /flags, label: "피처 플래그", flag: system_api.enabled, permission: system.admin
              - id: system-audit, route: /audit, label: "감사 로그", flag: system_api.enabled
              - id: system-quality, route: /quality, label: "품질 게이트", flag: system_api.enabled
              - id: system-lifecycle, route: /lifecycle, label: "도메인 라이프사이클", flag: system_api.enabled
      - path: "master-shell/feature-flags/flags.yaml"
        change: >
          system_api.enabled: true
          system_api.sse_stream.enabled: true
          system_api.rollback_ui.enabled: false  # Stage E PASS 후 활성화
          system_api.flag_toggle_ui.enabled: false  # Stage E PASS 후 활성화
      - path: "master-shell/observability/config.yaml"
        change: >
          system-api 대시보드 + 경보 규칙 추가
    success_criteria:
      - "node scripts/validate:composition PASS (system-api-plugin 포함)"
      - "nav.yaml ↔ flags.yaml 동기화 PASS"
      - "기존 adapter-registry 프로파일과의 정합성 PASS"
    gate_check:
      - "node scripts/validate:composition PASS"
      - "node scripts/validate-contracts.js PASS"

  # ---------------------------------------------------------------------------
  # PHASE 4: 구현 (Stage D) — 하위 WP는 병렬 가능
  # ---------------------------------------------------------------------------

  - id: "WP-UI-004"
    phase: 4
    stage: "D"
    track: "LIVE-DATA-API"
    title: "System OS Live Data API 서버 구현"
    priority: 4
    status: "READY"
    depends_on: ["WP-UI-003"]
    agent: "implementer"
    thinking: "normal"
    description: >
      createServer.js에 /api/v1/system/* 엔드포인트를 추가하고
      SSE 스트림 엔드포인트를 구현한다.
      모든 응답은 WP-UI-001에서 정의한 openapi.yaml 계약을 준수한다.
    implementation_details:
      new_files:
        - path: "src/server/systemApiRouter.js"
          responsibility: >
            System API 라우터 — 8개 엔드포인트 구현
            각 핸들러는 master-shell YAML 파일을 읽어 응답 생성
            SSE 핸들러: EventEmitter 기반 실시간 이벤트 브로드캐스트
        - path: "src/server/SystemStateAggregator.js"
          responsibility: >
            여러 YAML 소스(health-scores, flags, audit-chain, quality-gate)를
            단일 응답 객체로 집계하는 서비스 레이어
            — health-scores.yaml 파싱
            — flags.yaml 파싱
            — audit-chain.jsonl 마지막 N건 파싱
            — npm test 결과 캐시 (1분 TTL)
        - path: "src/server/SseEventBus.js"
          responsibility: >
            파일 시스템 감시자(fs.watch) → SSE 클라이언트 브로드캐스터
            감시 대상: health-scores.yaml, flags.yaml, audit-chain.jsonl
            이벤트 형식: system.health.updated, system.flag.toggled 등
      modified_files:
        - path: "src/server/createServer.js"
          change: "systemApiRouter 마운트 — app.use('/api/v1/system', systemApiRouter)"
      permissions:
        - "PATCH /flags/:id — system.admin 필요, 미인증 시 403"
        - "POST /rollback/:domain — system.admin 필요"
        - "GET 엔드포인트 — system_api.enabled 플래그 활성화 시 공개"
    test_requirements:
      - path: "src/tests/smoke/systemApi.smoke.test.js"
        scenarios:
          - "GET /api/v1/system/health → 200 + 헬스 스키마 검증"
          - "GET /api/v1/system/flags → 200 + 플래그 배열 검증"
          - "PATCH /api/v1/system/flags/:id 미인증 → 403"
          - "GET /api/v1/system/catalog → 200 + 도메인 배열"
          - "GET /api/v1/system/audit?limit=5 → 200 + 최대 5건"
          - "GET /api/v1/system/quality-gate → 200 + gate 배열"
          - "POST /api/v1/system/rollback/billing 미인증 → 403"
          - "GET /api/v1/system/events → 200 + content-type: text/event-stream"
    success_criteria:
      - "8개 엔드포인트 모두 smoke PASS"
      - "미인증 변이 요청 → 403 PASS"
      - "SSE 연결 → 이벤트 스트림 수신 PASS"
      - "기존 570/570 테스트 회귀 없음"
    gate_check:
      - "npm test PASS (570+ tests)"
      - "npm run lint PASS"
      - "node scripts/validate-contracts.js PASS"

  - id: "WP-UI-005"
    phase: 4
    stage: "D"
    track: "UI-SHELL-FOUNDATION"
    title: "공통 UI Shell 컴포넌트 라이브러리 구현"
    priority: 4
    status: "READY"
    depends_on: ["WP-UI-003"]
    parallel_with: ["WP-UI-004"]
    agent: "implementer"
    thinking: "normal"
    description: >
      모든 artifact HTML 페이지가 공유할 공통 CSS 디자인 시스템,
      네비게이션 헤더, 기본 위젯 컴포넌트를 구현한다.
    implementation_details:
      new_files:
        - path: "scripts/lib/ui-shell.js"
          responsibility: >
            공통 UI Shell 코드 생성기
            generateShellHeader(config): 공통 네비게이션 HTML 반환
            generateDesignSystem(): CSS 변수 + 기본 클래스 반환
            공통 레이아웃 템플릿 (사이드바, 메인 콘텐츠, 상태 바)
        - path: "artifacts/shared/shell.css"
          responsibility: >
            디자인 토큰 (색상, 타이포그래피, 간격, 반응형 브레이크포인트)
            공통 컴포넌트 스타일 (카드, 배지, 버튼, 토글, 모달)
            테마: 다크/라이트 모드 CSS 미디어 쿼리
        - path: "artifacts/shared/shell.js"
          responsibility: >
            클라이언트 사이드 공통 로직:
            - SSE 구독 관리자 (자동 재연결 지원)
            - 헬스 배지 자동 갱신
            - 권한 기반 요소 표시/숨김
            - 토스트 알림 (시스템 이벤트 수신 시)
            - 로딩 스켈레톤
      design_system:
        color_tokens:
          - "--wf-color-pass: #22c55e"
          - "--wf-color-fail: #ef4444"
          - "--wf-color-warn: #f59e0b"
          - "--wf-color-neutral: #64748b"
          - "--wf-color-bg: #0f172a"
          - "--wf-color-surface: #1e293b"
          - "--wf-color-border: #334155"
          - "--wf-color-text: #f1f5f9"
          - "--wf-color-accent: #6366f1"
