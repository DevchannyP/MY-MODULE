    title: "UI-OS 통합 적대적 검증"
    priority: 8
    status: "READY"
    depends_on: ["WP-UI-012", "WP-UI-013", "WP-UI-014", "WP-UI-015"]
    agent: "adversary"
    thinking: "ultrathink"
    description: >
      UI-OS 통합 전체에 대한 적대적 테스트 벡터를 실행한다.
      권한 경계, 동시성, 성능, 입력 주입 등 7개 벡터를 검증한다.
    test_vectors:
      - id: "VEC-UI-001"
        name: "권한 경계 우회 시도"
        scenarios:
          - "system.admin 없이 PATCH /flags/:id 직접 호출 → 403"
          - "system.admin 없이 POST /rollback/:domain 직접 호출 → 403"
          - "rollback_ui.enabled=false 시 롤백 버튼 클릭 → UI 차단"
          - "flag_toggle_ui.enabled=false 시 토글 클릭 → UI 차단"
      - id: "VEC-UI-002"
        name: "SSE 스트림 안정성"
        scenarios:
          - "SSE 연결 강제 끊김 → 5초 이내 재연결 성공"
          - "SSE 연결 중 서버 재시작 → 클라이언트 자동 재구독"
          - "다수 SSE 클라이언트 동시 연결 (10명) → 메모리 누수 없음"
      - id: "VEC-UI-003"
        name: "플래그 토글 동시성"
        scenarios:
          - "두 admin이 동시에 같은 플래그 토글 → 마지막 쓰기 우선, 충돌 오류 없음"
          - "토글 중 SSE 이벤트 중복 발생 없음"
      - id: "VEC-UI-004"
        name: "감사 로그 대용량"
        scenarios:
          - "audit-chain.jsonl 10,000건 이상 → 페이지 렌더링 3초 이내"
          - "필터 적용 시 응답 1초 이내"
      - id: "VEC-UI-005"
        name: "XSS/인젝션 방어"
        scenarios:
          - "감사 로그 액션 내용에 <script> 태그 → 이스케이프 처리"
          - "플래그 ID에 특수문자 → API 입력 검증 거부"
          - "도메인명에 경로 트래버설 문자 → 거부"
      - id: "VEC-UI-006"
        name: "DB 어댑터 장애 격리"
        scenarios:
          - "SQLite 파일 권한 오류 → InMemory 폴백 + 헬스 엔드포인트에 경고 표시"
          - "DB 연결 실패 시 기존 API 엔드포인트 영향 없음"
      - id: "VEC-UI-007"
        name: "시스템 API 플래그 오프"
        scenarios:
          - "system_api.enabled=false → /api/v1/system/* 전체 404"
          - "system_api.enabled=false → UI 페이지에 '준비 중' 안내"
    success_criteria:
      - "7개 벡터 전체 PASS"
      - "기존 570/570 테스트 회귀 없음"
      - "XSS 취약점 0건"
      - "권한 우회 0건"
    gate_check:
      - "npm test PASS (전체 회귀)"
      - "node scripts/validate-contracts.js PASS"
      - "node scripts/architecture-fitness.js PASS"

