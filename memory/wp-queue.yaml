# ============================================================
# WP Queue v2 — DAG-Aware Work Packet Registry
# ============================================================
# Schema version: 2
# Scheduler:  npm run wp:next     → next ready WPs (DAG-resolved)
#             npm run wp:status   → full DAG status
#             npm run wp:validate → referential integrity check
#             npm run wp:gaps     → requirements gap report
# ============================================================
# depends_on: [] means immediately runnable
# tier: infra(0) → arch(1) → governance(2) → domain(3) → meta(4)
# context_budget:
#   tier_reads: always read (session-essential, ~150 tokens total)
#   context_reads: read only if gap in knowledge
#   skip_if_capability: skip if already in working_capabilities
#   estimated_turns: rough agent turn estimate
# ============================================================

