# Stage C Memory - video 플러그인 등록
# 생성일: 2026-04-14
# 마스터 UI 조합기와 운영자는 코드보다 이 파일을 먼저 읽는다.

module_id: "video"
plugin_id: "video-plugin"
stage_b_memory_ref: "memory/stageB/video.yaml"

plugin_registry_entry: "master-shell/plugin-registry/registry.yaml"
registry_status: "active"

navigation:
  group: "content"
  group_label: "콘텐츠 관리"
  label: "비디오"
  icon: "play_circle"
  order: 3

entry_point: "/videos"

feature_flags:
  video.enabled: false
  video.upload.enabled: false
  video.transcode.enabled: false
  video.admin.enabled: false
flags_file: "master-shell/feature-flags/flags.yaml"
flag_activation_mode: "runtime env override preferred"

rollout:
  strategy: "canary"
  current_phase: "full"
  percentage: 100
  activation_note: "저장소 기본 YAML은 false를 유지하고, 실제 활성화는 WOS_FLAG_VIDEO_* 환경 변수로 오버라이드한다."

observability:
  dashboard_id: "video-dashboard"
  alert_group_id: "video-alerts"
  observability_config: "master-shell/observability/config.yaml"
  metrics_tracked:
    - "video upload count"
    - "transcode job start/completion/failure"
    - "API p99 latency"
    - "video authz failure rate"
    - "rate-limit rejection count"

contracts:
  ui: "domains/video/contract/ui-contract.yaml"
  capability: "domains/video/contract/capability.yaml"
  http: "domains/video/contract/openapi.yaml"
  events: "domains/video/contract/events.schema.json"

master_shell_read_order:
  1: "memory/current-state.yaml"
  2: "master-shell/plugin-registry/registry.yaml"
  3: "master-shell/navigation/nav.yaml"
  4: "master-shell/feature-flags/flags.yaml"
  5: "domains/video/contract/ui-contract.yaml"
  6: "domains/video/contract/capability.yaml"

catalog_ref: "master-shell/catalog/domains.yaml"
catalog_domain_id: "video"

registered_at: "2026-03-20"
gate_result: "PASS"
gate_failures: []
notes: |
  - plugin-registry, navigation, catalog, observability, feature flag 선언이 모두 존재한다.
  - plugin-registry의 rollout은 full(100%)로 선언돼 있지만, repo 기본 flag는 false이며 실제 활성화는 runtime env override를 전제로 한다.
  - Stage C 기준: 등록 surface는 완료, activation은 운영 환경에서 제어.
