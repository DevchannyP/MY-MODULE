implementation_surface:
  runtime_entrypoint: "src/server/createServer.js:/api/automation/optimize-prompt"
  provider_port: "src/infrastructure/ai/HarnessProviderAdapter.js"
  default_provider: "src/infrastructure/ai/NullHarnessProvider.js"
  live_provider_skeleton: "src/infrastructure/ai/OpenAIResponsesProvider.js"
  response_contract: "prompt(required) + provider(optional extension) + harness_runtime(optional extension)"

notes: |
  - optimize-prompt는 더 이상 route-local string builder만 호출하지 않고 HarnessRuntimeRouter snapshot을 provider adapter에 전달한다.
  - 로컬 기본 경로는 null provider이므로 API key 없이도 구조화 응답과 telemetry/eval evidence를 남긴다.
  - Stage E는 auth/rate-limit/service-unavailable/rollback safety를 적대 검증으로 추가 폐쇄한다.
