# Stage B Memory - UI Shell 조합 아키텍처 설계
# 생성일: 2026-03-30
# 입력: contracts/system-api/capability.yaml, contracts/system-api/openapi.yaml,
#       contracts/system-api/events.schema.json, contracts/ui-shell/ui-contract.yaml
# 목적: System OS UI Shell의 조합 전략을 계약만으로 확정한 결과

module_key: ui-shell
version: "1.0.0"
stage: B
status: composed
gate_result: PASS

# ── 조합 전략 ───────────────────────────────────────────────────────────────────
composition_strategy: vanilla-js-static
rationale: |
  프레임워크 의존성 0, 정적 배포 유지, SSR 불필요.
  기존 build-static-ui.js 파이프라인(generate-catalog-site.js, generate-study-guide.js,
  generate-ui-home.js 병렬 실행)과 완전 호환.
  React/Vue 도입 시 빌드 도구 복잡도 증가, 기존 generate-*.js 패턴 단절,
  node_modules 의존성 추가로 공급망 기준선(SBOM/provenance) 재산출 필요.

# ── 구성요소 ────────────────────────────────────────────────────────────────────
components:
  # 공통 Shell 생성기 (빌드 타임 — Node.js 스크립트)
  - id: ui-shell-generator
    path: scripts/lib/ui-shell.js
    responsibility: "공통 NavHeader HTML 생성, CSS 토큰 번들, 페이지별 Shell 조립"
    exports:
      - "generateShellHeader(config) -> HTML string"
      - "generateDesignSystem() -> CSS string"
      - "generateShellScript() -> JS string"
    pattern: |
      빌드 타임에 nav.yaml + flags.yaml + ui-contract.yaml을 읽어
      정적 HTML 조각과 CSS/JS 문자열을 반환한다.
      기존 generate-ui-home.js, generate-catalog-site.js가 이 모듈을 호출하여
      공통 Shell 레이아웃을 일관되게 적용한다.

  # 클라이언트 사이드 Shell (런타임 — 브라우저 JS)
  - id: ui-shell-client
    path: artifacts/shared/shell.js
    responsibility: "SSE 구독 관리, DOM 이벤트 디스패치, 권한 기반 요소 렌더링"
    pattern: |
      EventSource 단일 연결 → 이벤트 멀티플렉싱 → DOM 갱신.
      contracts/system-api/events.schema.json의 5종 이벤트를 수신하여
      data-sse-target 속성이 있는 DOM 요소를 선택적으로 갱신한다.
    sse_reconnect_strategy:
      algorithm: exponential-backoff
      initial_delay_ms: 1000
      max_delay_ms: 30000
      max_retries: 5
      on_max_retry: "연결 실패 배너를 UI에 표시하고 수동 재연결 버튼 노출"
    events_handled:
      - system.health.updated
      - system.flag.toggled
      - system.rollback.triggered
      - system.quality-gate.updated
      - system.domain.lifecycle-changed

  # 디자인 시스템 (런타임 — CSS)
  - id: ui-design-system
    path: artifacts/shared/shell.css
    responsibility: "CSS 변수 토큰, 공통 컴포넌트 스타일 (카드, 배지, 버튼, 토글, 모달)"
    theming:
      default: dark
      supported: [dark, light]
      switch_mechanism: "prefers-color-scheme 미디어 쿼리 자동 전환"
    tokens:
      - "--wfos-bg-primary"
      - "--wfos-bg-surface"
      - "--wfos-text-primary"
      - "--wfos-text-secondary"
      - "--wfos-accent"
      - "--wfos-success"
      - "--wfos-warning"
      - "--wfos-danger"
      - "--wfos-border"
      - "--wfos-radius"
      - "--wfos-shadow"
    component_styles:
      - card
      - badge
      - button
      - toggle-switch
      - modal
      - status-bar
      - timeline
      - gauge
      - matrix-cell

  # System API 클라이언트 (빌드 타임 — Node.js 유틸)
  - id: system-api-client
    path: scripts/lib/system-api-client.js
    responsibility: "서버 사이드 System API 호출 래퍼 (UI 빌드 시 사용)"
    pattern: |
      빌드 타임에 YAML 파일을 직접 읽어 데이터를 수집하는 Node.js 모듈.
      런타임 서버가 기동된 경우 HTTP fetch로 전환 가능하도록
      데이터 소스 추상화(file/http)를 제공한다.
    data_sources:
      file_mode:
        - "master-shell/observability/health-scores.yaml -> getSystemHealth"
        - "master-shell/feature-flags/flags.yaml -> listFeatureFlags"
        - "master-shell/plugin-registry/registry.yaml -> getDomainCatalog"
        - "worklog/audit-chain.jsonl -> getAuditLog"
        - "memory/L0-hot/current-state.yaml -> getQualityGateStatus, getDomainLifecycle"
      http_mode:
        base_url: "/api/v1/system"
        endpoints:
          - "GET /health -> getSystemHealth"
          - "GET /flags -> listFeatureFlags"
          - "PATCH /flags/:id -> toggleFeatureFlag"
          - "GET /catalog -> getDomainCatalog"
          - "GET /audit -> getAuditLog"
          - "GET /quality-gate -> getQualityGateStatus"
          - "POST /rollback/:domain -> triggerDomainRollback"
          - "GET /lifecycle -> getDomainLifecycle"
          - "GET /events -> subscribeSystemEvents (SSE)"

# ── 데이터 흐름 ─────────────────────────────────────────────────────────────────
data_flow:
  build_time: |
    YAML/JSONL 파일 → system-api-client.js (file_mode)
    → generate-ui-home.js / generate-catalog-site.js에서 호출
    → ui-shell-generator가 Shell HTML 조립
    → artifacts/ 에 정적 HTML 출력
  runtime_sse: |
    browser → GET /api/v1/system/events → EventSource 단일 연결
    → shell.js가 이벤트 멀티플렉싱 → data-sse-target DOM 갱신
  runtime_api: |
    browser → fetch /api/v1/system/* → JSON 응답
    → shell.js가 DOM 갱신 (플래그 토글, 롤백 트리거 등)

# ── 빌드 파이프라인 통합 ─────────────────────────────────────────────────────────
build_pipeline_integration:
  entry_script: scripts/build-static-ui.js
  steps:
    - label: "도메인 카탈로그"
      command: "node scripts/generate-catalog-site.js"
      uses: [ui-shell-generator, system-api-client]
    - label: "학습 가이드"
      command: "node scripts/generate-study-guide.js"
      uses: [ui-shell-generator]
    - label: "루트 홈"
      command: "node scripts/generate-ui-home.js"
      uses: [ui-shell-generator, system-api-client]
  output_dir: artifacts/
  shared_assets:
    - artifacts/shared/shell.css
    - artifacts/shared/shell.js

# ── 어댑터 계약 ──────────────────────────────────────────────────────────────────
adapter_contracts:
  # UI Shell 정적 자산 어댑터
  - adapter_id: ui-shell-adapter
    type: static-asset-server
    provides: [shell.css, shell.js, NavHeader HTML]
    consumed_by: [system-api-plugin]
    registry_ref: "master-shell/catalog/adapter-registry.yaml#master-ui-plugin-shell"
    protocol: html-artifact
    notes: |
      설계 단계에서만 쓰는 개념적 별칭이다.
      실제 registry 등록은 master-ui-plugin-shell을 사용한다.
      shell.css/shell.js를 공용 자산으로 제공하여
      도메인별 정적 페이지가 일관된 Shell을 공유한다.

  # SSE 전송 어댑터
  - adapter_id: sse-transport-adapter
    type: server-sent-events
    provides: ["SSE 스트림 GET /api/v1/system/events"]
    consumed_by: [ui-shell-client]
    protocol: text/event-stream
    reconnect: client-managed
    event_schema_ref: contracts/system-api/events.schema.json
    notes: |
      설계 단계에서 SSE 경계를 설명하기 위한 개념적 별칭이다.
      실제 구현에서는 system-api-plugin의 HTTP/SSE 엔드포인트로 수렴한다.
      SSE 연결 관리는 클라이언트(shell.js)가 담당한다.
      서버는 text/event-stream 응답만 유지하며 연결 복구 책임은 없다.
      events.schema.json의 SSEEventEnvelope 구조를 따른다.

# ── 라우팅 ───────────────────────────────────────────────────────────────────────
routes:
  base: "/"
  pages:
    - path: /
      module_key: system.dashboard
      feature_flag: system_api.enabled
    - path: /catalog
      module_key: system.catalog
      feature_flag: system_api.enabled
    - path: /flags
      module_key: system.flags
      feature_flag: system_api.flag_toggle_ui.enabled
    - path: /audit
      module_key: system.audit
      feature_flag: system_api.enabled
    - path: /quality
      module_key: system.quality
      feature_flag: system_api.enabled
    - path: /lifecycle
      module_key: system.lifecycle
      feature_flag: system_api.enabled
    - path: /rollback
      module_key: system.rollback
      feature_flag: system_api.rollback_ui.enabled

# ── 도메인 충돌 검사 ─────────────────────────────────────────────────────────────
domain_collision_check:
  # 경로 충돌 검사
  route_conflicts: []
  route_check_detail: |
    기존 라우트: /tasks/*, /billing/*, /videos/*
    UI Shell 라우트: /, /catalog, /flags, /audit, /quality, /lifecycle, /rollback
    API 라우트: /api/v1/system/*
    기존 도메인 API: /tasks, /billing, /videos (모두 다른 접두사)
    충돌 없음.

  # 권한 충돌 검사
  permission_conflicts: []
  permission_check_detail: |
    기존 권한: task-owner, task-viewer, billing.read, billing.write, billing.admin,
              video:read, video:write, video:admin
    UI Shell 권한: domain.viewer, system.admin
    domain.viewer는 읽기 전용 범용 권한으로 기존 도메인 admin과 겹치지 않음.
    system.admin은 system 네임스페이스로 격리됨.
    충돌 없음.

  # 이벤트 충돌 검사
  event_conflicts: []
  event_check_detail: |
    기존 이벤트: TaskCreated, TaskUpdated, TaskStatusChanged, TaskDeleted,
                InvoiceCreated, InvoicePaid, PaymentMatched, BillingExceptionOpened,
                VideoUploaded, TranscodeJobCompleted 등
    UI Shell 이벤트: system.health.updated, system.flag.toggled,
                     system.rollback.triggered, system.quality-gate.updated,
                     system.domain.lifecycle-changed
    system.* 네임스페이스로 완전 격리. 충돌 없음.

  # 네비게이션 그룹 충돌 검사
  nav_group_conflicts: []
  nav_group_check_detail: |
    기존 그룹: productivity (order:1), billing (order:2), content (order:3)
    UI Shell 그룹: system (신규, order:0)
    그룹 ID 'system'은 기존에 없음. 충돌 없음.

  # 플래그 충돌 검사
  flag_conflicts: []
  flag_check_detail: |
    기존 플래그: enable_task_management, enable_bulk_assign,
                billing.enabled, billing.invoice.enabled, billing.payment.enabled,
                billing.exception.enabled, video.enabled, video.upload.enabled,
                video.transcode.enabled, video.admin.enabled
    UI Shell 플래그: system_api.enabled, system_api.flag_toggle_ui.enabled,
                     system_api.rollback_ui.enabled
    system_api.* 네임스페이스로 격리. 기존 플래그와 충돌 없음.

  # 플러그인 ID 충돌 검사
  plugin_id_conflicts: []
  plugin_id_check_detail: |
    기존 플러그인: task-management-plugin, billing-plugin, video-plugin
    UI Shell 플러그인: system-api-plugin (신규)
    충돌 없음.

  verdict: "충돌 없음"
  collision_check_result: PASS

# ── INV 계승 ────────────────────────────────────────────────────────────────────
invariants_inherited:
  - inv: INV-SYS-001
    enforcement: "system API 플래그 토글 엔드포인트가 system.admin 권한 검사 강제"
    ui_element: "FlagToggle 컴포넌트 — 서버 사이드 권한 검사 + UI 비활성화"
  - inv: INV-SYS-002
    enforcement: "system API 롤백 트리거 엔드포인트가 system.admin 권한 검사 강제"
    ui_element: "RollbackModal 컴포넌트 — 텍스트 매치 확인 + 서버 사이드 권한 검사"
  - inv: INV-SYS-003
    enforcement: "system_api.enabled 플래그 검사 미들웨어 — false일 때 모든 /api/v1/system/* 경로 404 반환"
    ui_element: "Shell 전체 — 플래그 비활성 시 '기능 비활성' 배지 표시"
  - inv: INV-SYS-004
    enforcement: "flag_toggle_ui.enabled 검사 — false일 때 PATCH /api/v1/system/flags/:id 503 반환"
    ui_element: "FeatureFlagPanelPage — 플래그 비활성 시 토글 스위치 비활성화"
  - inv: INV-SYS-005
    enforcement: "rollback_ui.enabled 검사 — false일 때 POST /api/v1/system/rollback/:domain 503 반환"
    ui_element: "RollbackConsolePage — 플래그 비활성 시 롤백 버튼 비활성화"

# ── 계약 교차 검증 ───────────────────────────────────────────────────────────────
cross_contract_verification:
  capability_vs_openapi:
    status: "PASS"
    notes: "capability.yaml의 9개 능력이 openapi.yaml의 9개 operationId와 1:1 매핑 확인"
    mapping:
      - capability: can.read.system.health
        operationId: getSystemHealth
      - capability: can.read.system.flags
        operationId: listFeatureFlags
      - capability: can.toggle.system.flag
        operationId: toggleFeatureFlag
      - capability: can.read.system.catalog
        operationId: getDomainCatalog
      - capability: can.read.system.audit
        operationId: getAuditLog
      - capability: can.read.system.quality-gate
        operationId: getQualityGateStatus
      - capability: can.trigger.system.rollback
        operationId: triggerDomainRollback
      - capability: can.read.system.lifecycle
        operationId: getDomainLifecycle
      - capability: can.subscribe.system.events
        operationId: subscribeSystemEvents

  capability_vs_ui:
    status: "PASS"
    notes: |
      capability.yaml의 screens 참조 7개가 ui-contract.yaml의 module_key 7개와 일치:
      system.dashboard, system.catalog, system.flags, system.audit,
      system.quality, system.lifecycle, system.rollback

  capability_vs_events:
    status: "PASS"
    notes: |
      capability.yaml의 events_emitted 5종이 events.schema.json의 definitions 5종과 일치:
      system.health.updated, system.flag.toggled, system.rollback.triggered,
      system.quality-gate.updated, system.domain.lifecycle-changed

  invariant_coverage:
    status: "PASS"
    notes: |
      INV-SYS-001: capability can.toggle.system.flag에서 참조, openapi toggleFeatureFlag 403 응답으로 방어
      INV-SYS-002: capability can.trigger.system.rollback에서 참조, openapi triggerDomainRollback 403 응답으로 방어
      INV-SYS-003: openapi 전역 x-feature-gate에서 참조, 모든 경로에 404 기본 응답 포함
      INV-SYS-004: capability can.toggle.system.flag에서 참조, openapi toggleFeatureFlag 503 응답으로 방어
      INV-SYS-005: capability can.trigger.system.rollback에서 참조, openapi triggerDomainRollback 503 응답으로 방어

# ── 기존 도메인과의 조합 안전성 ───────────────────────────────────────────────────
composition_safety:
  task_management:
    status: "SAFE"
    notes: "라우트(/tasks/*), 이벤트(Task*), 권한(task-owner/task-viewer) 모두 네임스페이스 분리됨"
  billing:
    status: "SAFE"
    notes: "라우트(/billing/*), 이벤트(Invoice*/Payment*), 권한(billing.*) 모두 네임스페이스 분리됨"
  video:
    status: "SAFE"
    notes: "라우트(/videos/*), 이벤트(Video*/TranscodeJob*), 권한(video:*) 모두 네임스페이스 분리됨"

# ── 공유 의존성 ──────────────────────────────────────────────────────────────────
shared:
  libs: []
  notes: |
    바닐라 JS 전략이므로 프레임워크 의존성 없음.
    기존 도메인의 react/design-system 공유 의존성과 충돌할 여지가 없다.
    ui-contract.yaml에 명시된 shared_dependencies(react, design-system)는
    향후 프레임워크 전환 시점에 반영한다. 현재는 정적 HTML로 동일 기능 구현.

# ── 리스크 ───────────────────────────────────────────────────────────────────────
risks:
  - id: R-UI-001
    severity: medium
    description: "바닐라 JS로 7개 화면의 복잡한 인터랙션(모달, 토글, 필터)을 관리하면 코드 복잡도 증가 가능"
    mitigation: "컴포넌트 패턴을 함수 단위로 분리하고, data-* 속성 기반 선언적 바인딩으로 보일러플레이트 최소화"
    status: open
    adr_ref: "docs/adr/0012-ui-shell-composition-strategy.md"
  - id: R-UI-002
    severity: low
    description: "SSE 재연결 실패 시 사용자가 stale 데이터를 보는 시간 발생"
    mitigation: "최대 5회 재시도 후 연결 실패 배너 표시, 수동 새로고침 유도"
    status: open
  - id: R-UI-003
    severity: low
    description: "build-static-ui.js 파이프라인에 새 단계 추가 시 빌드 시간 증가"
    mitigation: "기존 병렬 실행 구조(Promise.all) 유지하여 증가분 최소화"
    status: open

# ── 테스트 전략 ──────────────────────────────────────────────────────────────────
tests:
  contract: "Stage D에서 contracts/system-api/* 기준 드리프트 검증"
  integration: "Stage D에서 system-api-client.js file_mode 단위 테스트"
  smoke: "Stage D에서 정적 HTML 생성 후 DOM 구조 검증"
  adversarial: "Stage E에서 SSE 연결 끊김, 권한 없는 토글, 동시 롤백 시나리오"

# ── 결론 ─────────────────────────────────────────────────────────────────────────
result: "PASS"
summary: |
  UI Shell은 바닐라 JS + 정적 배포 전략으로 기존 build-static-ui.js 파이프라인과 완전 호환된다.
  4종 계약(capability, openapi, ui-contract, events) 간 교차 검증 통과.
  기존 3개 도메인(task-management, billing, video)과 라우트, 이벤트, 권한, 플래그,
  네비게이션 그룹, 플러그인 ID 충돌이 없다.
  INV-SYS-001~005 전체가 UI 요소와 서버 사이드 미들웨어에 이중 방어된다.
  조합 결과: PASS.
