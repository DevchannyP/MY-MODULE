# Harness provider adapter — Stage E adversarial validation
# 생성일: 2026-04-15

domain_id: "harness-provider-adapter"
stage: "E"
status: "PASS"

adversarial_checks:
  - command: "node --test src/tests/unit/harnessProviderAdapter.test.js"
    result: "PASS"
    purpose: "auth/no-secret/schema mismatch failure mode와 secret leakage 부재를 고정한다."
  - command: "node --test src/tests/smoke/harnessProviderFailure.smoke.test.js"
    result: "PASS"
    purpose: "null fallback, structured 500, structured 503 HTTP surface를 검증한다."
  - command: "npm run validate:harness-contract"
    result: "PASS"
    purpose: "failure model과 Stage A/B 계약 baseline이 구현과 어긋나지 않는지 확인한다."
  - command: "npm run check:harness-routing"
    result: "PASS"
    purpose: "적대 검증 추가 후에도 route snapshot truth surface가 회귀하지 않는지 확인한다."

rollback_surface:
  strategy: "revert Stage E validation artifacts only"
  safe_target: "WP-HARNESS-VNEXT-014"
  triggers:
    - "schema mismatch가 null fallback으로 숨겨질 때"
    - "service unavailable가 RFC7807 구조 없이 노출될 때"
    - "eval artifact 또는 failure response에 provider secret이 포함될 때"

release_readiness:
  provider_failure_surface: "PASS"
  fallback_safety: "PASS"
  secret_sanitization: "PASS"
  rollback_evidence: "PASS"

notes: |
  - no-secret/openai preference는 runtime에서 null fallback으로 수렴한다.
  - schema mismatch는 의도적으로 복구하지 않고 structured 500으로 종료한다.
  - provider outage는 structured 503으로 종료해 rollback/ops 판단면을 유지한다.
