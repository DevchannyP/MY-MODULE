name: Release Evidence

# SLSA Level 2 approach: evidence generated inside the build service (GitHub Actions),
# not locally. Artifact upload preserves provenance chain.
# Benchmark: Google SLSA framework, sigstore keyless signing principles.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false

permissions:
  contents: read
  id-token: write   # needed for OIDC-based future sigstore integration

jobs:
  release-evidence:
    name: Generate & Upload Release Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates (must pass before evidence)
        run: |
          npm run validate:requirements
          npm run test:contract
          npm test
          npm run lint

      - name: Generate SBOM
        run: npm run generate:sbom

      - name: Verify provenance
        run: npm run verify:provenance

      - name: Generate release evidence
        run: npm run generate:release-evidence
        env:
          CI: "true"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            artifacts/release-evidence/release-evidence.json
            artifacts/provenance/workflow-os-provenance.json
            artifacts/sbom/workflow-os.spdx.json
          retention-days: 90
          if-no-files-found: error
