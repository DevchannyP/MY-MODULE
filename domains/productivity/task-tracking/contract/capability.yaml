# task-tracking - Capability Contract
# 조합기와 마스터 UI는 이 파일을 읽고 모듈 기능을 파악한다.
# 코드 내부를 노출하지 않는다.
version: "0.1.0"
module_id: "task-management"
name: "작업 관리"
description: "작업을 생성·조회·할당·상태 전이·완료하는 생산성 관리 기능"

capabilities:
  - id: "create-task"
    name: "작업 생성"
    description: "새 작업을 생성한다. 담당자와 제목은 필수이며, 마감일은 현재 이후여야 한다."
    type: "command"
    input_schema:
      type: object
      required: [title, assignee_id]
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        assignee_id: { type: string }
        due_date:    { type: string, format: date }
        description: { type: string, maxLength: 2000 }
    output_schema:
      type: object
      properties:
        task_id: { type: string }
        status:  { type: string, enum: [PENDING] }
    preconditions:
      - "assignee_id가 유효한 사용자여야 한다"
      - "due_date가 오늘 이상이어야 한다 (INV003, 오늘 포함 허용)"
    postconditions:
      - "작업이 PENDING 상태로 생성된다"
      - "TaskCreated 이벤트가 발행된다"
    invariants:
      - "INV001: 담당자 없는 작업 생성 불가"
    permissions_required: ["task:write"]

  - id: "get-task"
    name: "작업 조회"
    description: "작업 ID로 단일 작업의 상세 정보를 조회한다."
    type: "query"
    input_schema:
      type: object
      required: [task_id]
      properties:
        task_id: { type: string }
    output_schema:
      type: object
      properties:
        task_id:     { type: string }
        title:       { type: string }
        assignee_id: { type: string }
        due_date:    { type: string, format: date }
        status:      { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED] }
        description: { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
    preconditions:
      - "task_id가 존재하는 작업이어야 한다"
    postconditions: []
    invariants: []
    permissions_required: ["task:read"]

  - id: "list-tasks"
    name: "작업 목록 조회"
    description: "담당자·상태·마감일 기준으로 작업 목록을 조회한다."
    type: "query"
    input_schema:
      type: object
      properties:
        assignee_id: { type: string }
        status:      { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED] }
        due_before:  { type: string, format: date }
        page:        { type: integer, minimum: 1, default: 1 }
        page_size:   { type: integer, minimum: 1, maximum: 100, default: 20 }
    output_schema:
      type: object
      properties:
        items:      { type: array }
        total:      { type: integer }
        page:       { type: integer }
        page_size:  { type: integer }
    permissions_required: ["task:read"]

  - id: "transition-task-status"
    name: "작업 상태 전이"
    description: "작업 상태를 다음 허용된 상태로 전이한다."
    type: "command"
    input_schema:
      type: object
      required: [task_id, new_status]
      properties:
        task_id:    { type: string }
        new_status: { type: string, enum: [IN_PROGRESS, DONE, CANCELLED] }
    output_schema:
      type: object
      properties:
        task_id:    { type: string }
        old_status: { type: string }
        new_status: { type: string }
    preconditions:
      - "task_id가 존재하는 작업이어야 한다"
      - "허용된 상태 전이여야 한다 (INV002)"
    postconditions:
      - "TaskStatusChanged 이벤트가 발행된다"
    invariants:
      - "INV002: DONE 또는 CANCELLED → IN_PROGRESS 역전이 불가"
    permissions_required: ["task:write"]

  - id: "reassign-task"
    name: "담당자 변경"
    description: "작업의 담당자를 다른 사람으로 변경한다. DONE 상태 작업은 변경 불가."
    type: "command"
    input_schema:
      type: object
      required: [task_id, new_assignee_id]
      properties:
        task_id:         { type: string }
        new_assignee_id: { type: string }
    preconditions:
      - "task_id가 존재하는 작업이어야 한다"
      - "작업이 DONE 상태가 아니어야 한다 (CANCELLED 포함 변경 가능)"
    postconditions:
      - "TaskReassigned 이벤트가 발행된다"
    invariants:
      - "INV001: 새 담당자도 유효한 사용자여야 한다"
      - "INV004: DONE 상태 작업은 담당자를 변경할 수 없다 (Stage E 적대적 검증에서 발견)"
    permissions_required: ["task:write"]

events_emitted:
  - id: "TaskCreated"
    name: "작업 생성됨"
    schema: "domains/productivity/task-tracking/contract/events.schema.json#/definitions/TaskCreated"
    triggers: "create-task capability 호출 성공 시"

  - id: "TaskStatusChanged"
    name: "작업 상태 변경됨"
    schema: "domains/productivity/task-tracking/contract/events.schema.json#/definitions/TaskStatusChanged"
    triggers: "transition-task-status capability 호출 성공 시"

  - id: "TaskReassigned"
    name: "작업 담당자 변경됨"
    schema: "domains/productivity/task-tracking/contract/events.schema.json#/definitions/TaskReassigned"
    triggers: "reassign-task capability 호출 성공 시"

events_consumed: []
