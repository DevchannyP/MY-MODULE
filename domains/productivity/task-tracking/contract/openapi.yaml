openapi: "3.0.3"
info:
  title: "작업 관리 API"
  version: "0.1.0"
  description: "task-tracking bounded context의 HTTP API 계약. capability.yaml의 capability를 HTTP로 노출한다."

paths:
  /tasks:
    get:
      summary: "작업 목록 조회"
      operationId: "listTasks"
      tags: [tasks]
      parameters:
        - name: assignee_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED] }
        - name: due_before
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

    post:
      summary: "작업 생성"
      operationId: "createTask"
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: "작업 생성 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTaskResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

  /tasks/{task_id}:
    get:
      summary: "작업 상세 조회"
      operationId: "getTask"
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

  /tasks/{task_id}/status:
    patch:
      summary: "작업 상태 전이"
      operationId: "transitionTaskStatus"
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionStatusRequest" }
      responses:
        "200":
          description: "상태 전이 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionStatusResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

  /tasks/{task_id}/assignee:
    patch:
      summary: "담당자 변경"
      operationId: "reassignTask"
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignRequest" }
      responses:
        "200":
          description: "담당자 변경 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Task:
      type: object
      properties:
        task_id:     { type: string }
        title:       { type: string }
        assignee_id: { type: string }
        due_date:    { type: string, format: date, nullable: true }
        status:      { type: string, enum: [PENDING, IN_PROGRESS, DONE, CANCELLED] }
        description: { type: string, nullable: true }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    CreateTaskResponse:
      type: object
      properties:
        task_id: { type: string }
        status:  { type: string, enum: [PENDING] }

    CreateTaskRequest:
      type: object
      required: [title, assignee_id]
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        assignee_id: { type: string }
        due_date:    { type: string, format: date }
        description: { type: string, maxLength: 2000 }

    TransitionStatusRequest:
      type: object
      required: [new_status]
      properties:
        new_status: { type: string, enum: [IN_PROGRESS, DONE, CANCELLED] }

    TransitionStatusResponse:
      type: object
      properties:
        task_id:    { type: string }
        old_status: { type: string }
        new_status: { type: string }

    ReassignRequest:
      type: object
      required: [new_assignee_id]
      properties:
        new_assignee_id: { type: string }

    TaskListResponse:
      type: object
      properties:
        items:     { type: array, items: { $ref: "#/components/schemas/Task" } }
        total:     { type: integer }
        page:      { type: integer }
        page_size: { type: integer }

    ErrorResponse:
      type: object
      properties:
        code:    { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: "잘못된 요청"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: "인증 필요"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: "리소스를 찾을 수 없음"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
