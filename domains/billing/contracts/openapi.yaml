openapi: "3.0.3"
info:
  title: "정산관리 API"
  version: "0.1.0"
  description: |
    billing bounded context의 HTTP API 계약.
    capability.yaml의 capability를 HTTP로 노출한다.
    불변조건: invoice.total = sum(lineItems[i].amount) 항상 성립.

servers:
  - url: /api/v1

tags:
  - name: invoices
    description: 인보이스 관리
  - name: payments
    description: 결제 상태
  - name: exceptions
    description: 정산 예외처리

paths:
  # ── 인보이스 ───────────────────────────────────────────────────────────────
  /billing/invoices:
    get:
      summary: "인보이스 목록 조회"
      operationId: "listInvoices"
      tags: [invoices]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING, PAID, CANCELLED, DISPUTED]
        - name: customer_id
          in: query
          schema: { type: string }
        - name: amount_min
          in: query
          schema: { type: number, minimum: 0 }
        - name: amount_max
          in: query
          schema: { type: number, minimum: 0 }
        - name: due_from
          in: query
          schema: { type: string, format: date }
        - name: due_to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      security: [{ bearerAuth: [] }]

    post:
      summary: "인보이스 생성"
      operationId: "createInvoice"
      tags: [invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceRequest" }
      responses:
        "201":
          description: "인보이스 생성 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      security: [{ bearerAuth: [] }]

  /billing/invoices/{invoice_id}:
    get:
      summary: "인보이스 상세 조회"
      operationId: "getInvoice"
      tags: [invoices]
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      security: [{ bearerAuth: [] }]

  /billing/invoices/{invoice_id}/status:
    patch:
      summary: "인보이스 상태 전이"
      description: |
        허용된 전이만 가능: DRAFT→PENDING, PENDING→PAID/CANCELLED/DISPUTED.
        DISPUTED→PAID는 /exceptions/{id}/approve 엔드포인트를 사용한다.
      operationId: "transitionInvoiceStatus"
      tags: [invoices]
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInvoiceStatusRequest" }
      responses:
        "200":
          description: "상태 전이 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      security: [{ bearerAuth: [] }]

  /billing/invoices/{invoice_id}/line-items:
    post:
      summary: "라인 항목 추가"
      description: "DRAFT 상태 인보이스에만 라인 항목을 추가할 수 있다."
      operationId: "addLineItem"
      tags: [invoices]
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLineItemRequest" }
      responses:
        "200":
          description: "라인 항목 추가 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      security: [{ bearerAuth: [] }]

  # ── 결제 ───────────────────────────────────────────────────────────────────
  /billing/payments:
    get:
      summary: "결제 목록 조회"
      operationId: "listPayments"
      tags: [payments]
      parameters:
        - name: invoice_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, SUCCESS, FAILED, MISMATCH]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      security: [{ bearerAuth: [] }]

  /billing/payments/{payment_id}:
    get:
      summary: "결제 상세 조회"
      operationId: "getPayment"
      tags: [payments]
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      security: [{ bearerAuth: [] }]

  /billing/payments/{payment_id}/sync:
    post:
      summary: "결제 동기화 재시도"
      operationId: "retryPaymentSync"
      tags: [payments]
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "동기화 요청 접수"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      security: [{ bearerAuth: [] }]

  # ── 예외처리 ───────────────────────────────────────────────────────────────
  /billing/exceptions:
    get:
      summary: "정산 예외 목록 조회"
      operationId: "listBillingExceptions"
      tags: [exceptions]
      parameters:
        - name: exception_type
          in: query
          schema:
            type: string
            enum: [MISMATCH, DISPUTED, SYNC_FAILURE]
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, APPROVED, REJECTED, RESOLVED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingExceptionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      security: [{ bearerAuth: [] }]

  /billing/exceptions/{exception_id}/approve:
    post:
      summary: "정산 예외 승인 (DISPUTED → PAID)"
      description: "billing.admin 권한 필요. INV-B005: 관리자 승인 없이 DISPUTED→PAID 불가."
      operationId: "approveBillingException"
      tags: [exceptions]
      parameters:
        - name: exception_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveExceptionRequest" }
      responses:
        "200":
          description: "승인 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingException" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
      security: [{ bearerAuth: [] }]

  /billing/exceptions/{exception_id}/reject:
    post:
      summary: "정산 예외 거부"
      operationId: "rejectBillingException"
      tags: [exceptions]
      parameters:
        - name: exception_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectExceptionRequest" }
      responses:
        "200":
          description: "거부 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingException" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      security: [{ bearerAuth: [] }]

  # ── 홈 요약 ────────────────────────────────────────────────────────────────
  /billing/summary:
    get:
      summary: "정산 도메인 요약 조회"
      operationId: "getBillingSummary"
      tags: [invoices]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      security: [{ bearerAuth: [] }]

# ── 컴포넌트 ──────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Money (embedded)
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:   { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, example: "KRW" }

    # LineItem
    LineItem:
      type: object
      required: [line_item_id, description, quantity, unit_price, amount]
      properties:
        line_item_id: { type: string }
        description:  { type: string }
        quantity:     { type: number, minimum: 1 }
        unit_price:   { $ref: "#/components/schemas/Money" }
        amount:       { $ref: "#/components/schemas/Money" }

    # Invoice
    Invoice:
      type: object
      required: [invoice_id, customer_id, status, total, line_items, created_at, updated_at]
      properties:
        invoice_id:              { type: string }
        customer_id:             { type: string }
        status:
          type: string
          enum: [DRAFT, PENDING, PAID, CANCELLED, DISPUTED]
        total:                   { $ref: "#/components/schemas/Money" }
        line_items:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        total_invariant_valid:   { type: boolean, description: "sum(line_items.amount) = total.amount" }
        due_date:                { type: string, format: date, nullable: true }
        notes:                   { type: string, nullable: true }
        created_at:              { type: string, format: date-time }
        updated_at:              { type: string, format: date-time }

    # Payment
    Payment:
      type: object
      required: [payment_id, invoice_id, amount, status, created_at]
      properties:
        payment_id:   { type: string }
        invoice_id:   { type: string }
        amount:       { $ref: "#/components/schemas/Money" }
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, MISMATCH]
        synced_at:    { type: string, format: date-time, nullable: true }
        mismatch_delta: { $ref: "#/components/schemas/Money" }
        created_at:   { type: string, format: date-time }

    # BillingException
    BillingException:
      type: object
      required: [exception_id, invoice_id, exception_type, status, created_at]
      properties:
        exception_id:     { type: string }
        invoice_id:       { type: string }
        payment_id:       { type: string, nullable: true }
        exception_type:
          type: string
          enum: [MISMATCH, DISPUTED, SYNC_FAILURE]
        status:
          type: string
          enum: [OPEN, APPROVED, REJECTED, RESOLVED]
        reason:           { type: string, nullable: true }
        approved_by:      { type: string, nullable: true }
        resolved_at:      { type: string, format: date-time, nullable: true }
        created_at:       { type: string, format: date-time }

    # BillingSummary
    BillingSummary:
      type: object
      properties:
        total_invoices:       { type: integer }
        pending_count:        { type: integer }
        disputed_count:       { type: integer }
        open_exceptions:      { type: integer }
        month_total:          { $ref: "#/components/schemas/Money" }

    # List responses
    InvoiceListResponse:
      type: object
      properties:
        items:     { type: array, items: { $ref: "#/components/schemas/Invoice" } }
        total:     { type: integer }
        page:      { type: integer }
        page_size: { type: integer }

    PaymentListResponse:
      type: object
      properties:
        items:     { type: array, items: { $ref: "#/components/schemas/Payment" } }
        total:     { type: integer }
        page:      { type: integer }
        page_size: { type: integer }

    BillingExceptionListResponse:
      type: object
      properties:
        items:     { type: array, items: { $ref: "#/components/schemas/BillingException" } }
        total:     { type: integer }
        page:      { type: integer }
        page_size: { type: integer }

    # Request bodies
    CreateInvoiceRequest:
      type: object
      required: [customer_id]
      properties:
        customer_id: { type: string }
        due_date:    { type: string, format: date }
        notes:       { type: string, maxLength: 2000 }

    TransitionInvoiceStatusRequest:
      type: object
      required: [new_status]
      properties:
        new_status:
          type: string
          enum: [PENDING, PAID, CANCELLED, DISPUTED]
        reason: { type: string }

    AddLineItemRequest:
      type: object
      required: [description, quantity, unit_price]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity:    { type: number, minimum: 1 }
        unit_price:  { $ref: "#/components/schemas/Money" }

    ApproveExceptionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    RejectExceptionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    # Error
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:           { type: string }
        message:        { type: string }
        correlation_id: { type: string }

  responses:
    BadRequest:
      description: "잘못된 요청 (불변조건 위반 포함)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: "인증 필요"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: "권한 없음"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: "리소스를 찾을 수 없음"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: "상태 충돌 (허용되지 않은 상태 전이 등)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
