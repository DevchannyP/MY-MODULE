# Capability Contract - Billing Domain
# 코드 내부를 읽지 않고도 billing 모듈의 기능 범위와 권한 요구를 파악하기 위한 선언.

module_key: billing
version: "0.1.0"

capabilities:
  # 인보이스 읽기
  - id: can.read.invoice
    description: "인보이스 목록 및 상세 조회"
    required_permissions: [billing.read]
    screens: [billing.invoice, billing.invoice.detail, billing.home]
    http_operations: [listInvoices, getInvoice]

  # 인보이스 쓰기
  - id: can.create.invoice
    description: "신규 인보이스 생성 (DRAFT 상태)"
    required_permissions: [billing.write]
    http_operations: [createInvoice]

  - id: can.add.invoice.line-item
    description: "DRAFT 인보이스에 라인 항목 추가"
    required_permissions: [billing.write]
    http_operations: [addLineItem]
    invariants:
      - INV-B001  # 합계 불변조건 유지
      - INV-B004  # 라인 항목 금액 양수

  - id: can.transition.invoice.status
    description: "인보이스 상태 전이 (DISPUTED→PAID 제외)"
    required_permissions: [billing.write]
    http_operations: [transitionInvoiceStatus]
    invariants:
      - INV-B002  # 허용된 전이만 가능
      - INV-B003  # PAID 인보이스 삭제 불가

  # 결제 읽기
  - id: can.read.payment
    description: "결제 목록 및 상세 조회, 미매칭 항목 확인"
    required_permissions: [billing.read]
    screens: [billing.payment]
    http_operations: [listPayments, getPayment]

  # 결제 쓰기
  - id: can.retry.payment.sync
    description: "결제 동기화 재시도"
    required_permissions: [billing.write]
    http_operations: [retryPaymentSync]

  # 예외처리
  - id: can.read.billing.exception
    description: "정산 예외 목록 조회"
    required_permissions: [billing.admin]
    screens: [billing.exception]
    http_operations: [listBillingExceptions]

  - id: can.approve.billing.exception
    description: "DISPUTED 인보이스 관리자 승인 (DISPUTED→PAID)"
    required_permissions: [billing.admin]
    http_operations: [approveBillingException]
    invariants:
      - INV-B005  # 관리자 승인 없이 DISPUTED→PAID 불가

  - id: can.reject.billing.exception
    description: "정산 예외 거부"
    required_permissions: [billing.admin]
    http_operations: [rejectBillingException]

  # 홈 요약
  - id: can.read.billing.summary
    description: "정산 도메인 요약 조회"
    required_permissions: [billing.read]
    screens: [billing.home]
    http_operations: [getBillingSummary]

  # 마운트
  - id: can.mount.billing
    description: "마스터 UI에 billing 플러그인 마운트"
    required_permissions: [billing.read]
    screens: [billing.home, billing.invoice, billing.payment, billing.exception]

required_permissions:
  - billing.read
  - billing.write
  - billing.admin

invariants:
  - id: INV-B001
    description: "invoice.total = sum(lineItems[i].amount)"
  - id: INV-B002
    description: "인보이스 상태 역전이 불가 (DRAFT→PENDING→PAID/CANCELLED/DISPUTED만 허용)"
  - id: INV-B003
    description: "PAID 인보이스 삭제 불가"
  - id: INV-B004
    description: "라인 항목 금액 > 0"
  - id: INV-B005
    description: "DISPUTED→PAID는 관리자 승인 필요"
  - id: INV-B006
    description: "결제금액 ≠ 인보이스총액이면 MISMATCH 분류"

events_emitted:
  - InvoiceCreated
  - InvoiceStatusChanged
  - InvoiceTotalMismatchDetected
  - PaymentMismatchDetected
  - BillingExceptionApproved
  - BillingExceptionRejected

events_consumed: []
