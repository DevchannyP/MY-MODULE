openapi: "3.1.0"
info:
  title: "UI Shell Control API"
  version: "0.1.0"
  x-api-id: "ui-shell-control"
  x-api-audience: "internal"
  x-api-version-policy: "semver-with-explicit-breaking-review"
  description: |
    Workflow OS 마스터 UI가 Planning Studio와 PTY 브리지를 제어할 때 사용하는 내부 API 계약.
    현재 범위는 계획 저장, 자동 전송 설정, 스캐폴드 미리보기/생성, Stage A~E 실행/dry-run,
    추천 프롬프트 조회, PTY 세션 조회, 프롬프트 전송, 스케줄러 제어를 포함한다.

servers:
  - url: /api

tags:
  - name: planning-studio
    description: Planning Studio 상태 조회 및 저장
  - name: planning-stage
    description: Stage A~E 실행 또는 dry-run 보고서 조회
  - name: scaffold
    description: 도메인 스캐폴드 미리보기 및 생성
  - name: automation
    description: Control Center 자동화 제어 및 추천 프롬프트
  - name: pty
    description: PTY 세션과 프롬프트 전송
  - name: scheduler
    description: 자동 전송 스케줄러 제어
  - name: flags
    description: 런타임 Feature Flag 상태 조회

paths:
  /planning-studio/snapshot:
    get:
      summary: "Planning Studio 스냅샷 조회"
      operationId: "getPlanningStudioSnapshot"
      tags: [planning-studio]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningStudioSnapshot"
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/save-packet:
    post:
      summary: "현재 packet 편집 내용 저장"
      operationId: "savePlanningPacket"
      tags: [planning-studio]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePacketRequest"
      responses:
        "200":
          description: "저장 후 최신 Planning Studio 스냅샷 반환"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningStudioSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/save-sections:
    post:
      summary: "로드맵 섹션 저장"
      operationId: "savePlanningSections"
      tags: [planning-studio]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSectionsRequest"
      responses:
        "200":
          description: "저장 후 최신 Planning Studio 스냅샷 반환"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningStudioSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/save-automation:
    post:
      summary: "자동 전송 브리지 설정 저장"
      operationId: "savePlanningAutomation"
      tags: [planning-studio]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAutomationRequest"
      responses:
        "200":
          description: "저장 후 최신 Planning Studio 스냅샷 반환"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningStudioSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/scaffold-preview:
    post:
      summary: "도메인 스캐폴드 미리보기"
      operationId: "previewDomainScaffold"
      tags: [scaffold]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaffoldRequest"
      responses:
        "200":
          description: "미리보기 성공"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldCommandEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/scaffold-create:
    post:
      summary: "도메인 스캐폴드 실제 생성"
      operationId: "createDomainScaffold"
      tags: [scaffold]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaffoldRequest"
      responses:
        "200":
          description: "생성 성공"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldCommandEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableContent" }
        "500": { $ref: "#/components/responses/InternalError" }

  /planning-studio/stage-run:
    post:
      summary: "Stage A~E 실행 또는 dry-run 보고서 조회"
      operationId: "runPlanningStage"
      tags: [planning-stage]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageRunRequest"
      responses:
        "200":
          description: "stage 실행 결과"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageRunEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /pty/sessions:
    get:
      summary: "감지된 PTY 세션 목록 조회"
      operationId: "listPtySessions"
      tags: [pty]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PtySessionsResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /automation/optimize-prompt:
    get:
      summary: "Control Center 추천 프롬프트 조회"
      operationId: "getRecommendedPrompt"
      tags: [automation]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizedPromptResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/send:
    post:
      summary: "선택한 PTY 세션으로 프롬프트 또는 Enter 전송"
      operationId: "sendPromptToPty"
      tags: [pty]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PtySendRequest"
      responses:
        "200":
          description: "전송 성공"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PtySendResponse"
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/scheduler/status:
    get:
      summary: "자동 전송 스케줄러 상태 조회"
      operationId: "getPtySchedulerStatus"
      tags: [scheduler]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStatusResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/scheduler/start:
    post:
      summary: "자동 전송 스케줄러 시작"
      operationId: "startPtyScheduler"
      tags: [scheduler]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulerStartRequest"
      responses:
        "200":
          description: "시작 성공"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerStartResponse"
        "400": { $ref: "#/components/responses/LegacyBadRequest" }
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/scheduler/stop:
    post:
      summary: "자동 전송 스케줄러 중지"
      operationId: "stopPtyScheduler"
      tags: [scheduler]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: "중지 성공"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/send-now:
    post:
      summary: "현재 worker 프롬프트 즉시 전송"
      operationId: "dispatchSchedulerPromptNow"
      tags: [scheduler]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNowRequest"
      responses:
        "200":
          description: "전송 결과"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerDispatchResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /mindmap/rebuild:
    post:
      summary: "마인드맵 HTML 재생성 (Worker Thread — 이벤트 루프 비블로킹)"
      operationId: "rebuildMindmap"
      tags: [ui]
      responses:
        "200":
          description: "재생성 성공"
          content:
            application/json:
              schema:
                type: object
                required: [ok, durationMs]
                properties:
                  ok: { type: boolean }
                  durationMs: { type: number }
        "500":
          description: "재생성 실패"
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean }
                  error: { type: string }

  /ui/home-runtime:
    servers:
      - url: /
    get:
      summary: "홈 런타임 상태 조회 — WP 큐, 현재 레인, 칸반 데이터"
      operationId: "getHomeRuntime"
      tags: [ui]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                type: object
                description: "홈 UI 런타임 상태 페이로드"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /flags:
    servers:
      - url: /
    get:
      summary: "런타임 Feature Flag 상태 조회"
      operationId: "getRuntimeFlags"
      tags: [flags]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagsResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

  /pty/enter-now:
    post:
      summary: "Enter 즉시 전송 (worker_index 지정 시 해당 worker만, 생략 시 전체)"
      operationId: "dispatchSchedulerEnterNow"
      tags: [scheduler]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterNowRequest"
      responses:
        "200":
          description: "전송 결과"
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerDispatchResponse"
        "500": { $ref: "#/components/responses/LegacyInternalError" }

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        동일한 쓰기 요청을 안전하게 재시도하기 위한 키.
        같은 사용자, 같은 경로, 같은 요청 본문에 한해 완료 응답이 재생된다.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    IdempotencyReplayed:
      description: "같은 Idempotency-Key의 완료된 응답을 재생한 경우 true"
      schema:
        type: string
        enum: ["true"]

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance, code, message]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        next_action: { type: string }
        correlationId: { type: string }
        correlation_id: { type: string }
        traceId: { type: string }
        details:
          type: object
          additionalProperties: true
      additionalProperties: true

    LegacyErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
      additionalProperties: true

    StringList:
      type: array
      items: { type: string }

    Packet:
      type: object
      properties:
        id: { type: string }
        goal: { type: string }
        status: { type: string }
        tier: { type: string }
        stage: { type: string }
        type: { type: string }
        depends_on: { $ref: "#/components/schemas/StringList" }
        subtasks: { $ref: "#/components/schemas/StringList" }
        validation: { $ref: "#/components/schemas/StringList" }
        constraints: { $ref: "#/components/schemas/StringList" }
        evidence: { $ref: "#/components/schemas/StringList" }
        scope_in: { $ref: "#/components/schemas/StringList" }
        scope_out: { $ref: "#/components/schemas/StringList" }
        next_unlock: { type: string }
        completed_at: { type: string }
        result: { type: string }
        capability_id: { type: string }
        capability_name: { type: string }
        priority:
          oneOf:
            - type: integer
            - type: "null"
        source: { type: string }
        is_current: { type: boolean }
        is_next: { type: boolean }
        is_recommended: { type: boolean }
      additionalProperties: true

    NextActions:
      type: object
      properties:
        as_of: { type: string }
        selection_policy: { type: string }
        next_wp: { type: string }
        queue:
          type: array
          items: { $ref: "#/components/schemas/Packet" }
      additionalProperties: true

    PlannerSection:
      type: object
      required: [id]
      properties:
        id: { type: string }
        tag: { type: string }
        title: { type: string }
        content: { type: string }
        done: { type: boolean }
        updated_at: { type: string }
      additionalProperties: true

    PlannerSectionsDraft:
      type: object
      properties:
        updated_at: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/PlannerSection" }
        sections_by_id:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PlannerSection"
        seeded: { type: boolean }
      additionalProperties: true

    AutomationWorker:
      type: object
      properties:
        name: { type: string }
        plan_id: { type: string }
        role_id: { type: string }
        role_label: { type: string }
        prompt: { type: string }
      additionalProperties: true

    AutomationConfig:
      type: object
      properties:
        updated_at: { type: string }
        enabled: { type: boolean }
        cycle_minutes: { type: integer }
        enter_seconds: { type: integer }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
      additionalProperties: true

    ChangedFile:
      type: object
      properties:
        status: { type: string }
        path: { type: string }
      additionalProperties: true

    CodeStatus:
      type: object
      properties:
        branch: { type: string }
        head: { type: string }
        dirty: { type: boolean }
        changed_count: { type: integer }
        changed_files:
          type: array
          items: { $ref: "#/components/schemas/ChangedFile" }
      additionalProperties: true

    PlanningStudioSnapshot:
      type: object
      required: [generated_at, active_packets, completed_packets, planner_sections_draft, automation_config, code_status, files]
      properties:
        generated_at: { type: string }
        current_wp:
          oneOf:
            - $ref: "#/components/schemas/Packet"
            - type: object
        next_actions: { $ref: "#/components/schemas/NextActions" }
        active_packets:
          type: array
          items: { $ref: "#/components/schemas/Packet" }
        completed_packets:
          type: array
          items: { $ref: "#/components/schemas/Packet" }
        default_packet_id: { type: string }
        planner_sections_draft: { $ref: "#/components/schemas/PlannerSectionsDraft" }
        automation_config: { $ref: "#/components/schemas/AutomationConfig" }
        code_status: { $ref: "#/components/schemas/CodeStatus" }
        files:
          type: object
          additionalProperties: { type: string }
      additionalProperties: true

    SavePacketRequest:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        goal: { type: string }
        status: { type: string }
        tier: { type: string }
        stage: { type: string }
        type: { type: string }
        depends_on: { $ref: "#/components/schemas/StringList" }
        subtasks: { $ref: "#/components/schemas/StringList" }
        validation: { $ref: "#/components/schemas/StringList" }
        constraints: { $ref: "#/components/schemas/StringList" }
        evidence: { $ref: "#/components/schemas/StringList" }
        scope_in: { $ref: "#/components/schemas/StringList" }
        scope_out: { $ref: "#/components/schemas/StringList" }
        next_unlock: { type: string }
        result: { type: string }
        set_as_next: { type: boolean }
      additionalProperties: true

    SaveSectionsRequest:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlannerSection" }
      additionalProperties: false

    SaveAutomationRequest:
      type: object
      required: [enabled, cycle_minutes, enter_seconds, workers]
      properties:
        enabled: { type: boolean }
        cycle_minutes: { type: integer, minimum: 1 }
        enter_seconds: { type: integer, minimum: 0 }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
      additionalProperties: false

    ScaffoldRequest:
      type: object
      required: [domain, blueprint]
      properties:
        domain:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,62}$"
        blueprint:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,62}$"
        recipe:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,62}$"
      additionalProperties: false

    ScaffoldCommandResult:
      type: object
      required: [ok, command, stdout, preview, requirements_path, created]
      properties:
        ok: { type: boolean }
        command: { type: string }
        stdout: { type: string }
        preview: { type: string }
        requirements_path: { type: string }
        created: { type: boolean }
      additionalProperties: true

    ScaffoldCommandEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/ScaffoldCommandResult" }
      additionalProperties: true

    StageRunRequest:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [A, B, C, D, E]
        module:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
        execute:
          type: boolean
      additionalProperties: false

    StageCommandResult:
      type: object
      required: [command, ok, exit_code, stdout, stderr]
      properties:
        command: { type: string }
        ok: { type: boolean }
        exit_code: { type: integer }
        signal:
          oneOf:
            - type: string
            - type: "null"
        stdout: { type: string }
        stderr: { type: string }
      additionalProperties: true

    StageRunReport:
      type: object
      required: [requested_stage, execution_mode, status, run_now, requirements_stage, recommended_commands]
      properties:
        requested_stage:
          type: string
          enum: [A, B, C, D, E]
        execution_mode:
          type: string
          enum: [dry-run-only, execute]
        status: { type: string }
        run_now: { type: boolean }
        requirements_stage: { type: string }
        legacy_stage_state: { type: string }
        prerequisites:
          type: array
          description: "이 stage 실행 전에 확인해야 할 전체 선행 조건 목록"
          items: { type: string }
        unmet_prerequisites:
          type: array
          items: { type: string }
        summary: { type: string }
        docs_ref: { type: string }
        recommended_commands:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
        current_wp: { type: string }
        requirements_file: { type: string }
        runtime_root: { type: string }
        quality_gate_result:
          oneOf:
            - type: string
            - type: "null"
        executed_command_count: { type: integer }
        failed_command_count: { type: integer }
        command_results:
          type: array
          items: { $ref: "#/components/schemas/StageCommandResult" }
      additionalProperties: true

    StageRunEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, const: true }
        data: { $ref: "#/components/schemas/StageRunReport" }
      additionalProperties: true

    PtySession:
      type: object
      required: [pts]
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        pts: { type: string }
        label: { type: string }
        command: { type: string }
        cwd: { type: string }
      additionalProperties: true

    OptimizedPromptResponse:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
      additionalProperties: true

    PtySessionsResponse:
      type: object
      required: [sessions, count]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PtySession" }
        count: { type: integer, minimum: 0 }
      additionalProperties: true

    PtySendRequest:
      type: object
      required: [pts, text]
      properties:
        pts: { type: string, minLength: 1 }
        text: { type: string }
        action: { type: string, enum: [prompt, enter] }
        name: { type: string }
        prompt: { type: string }
        packet_id: { type: string }
        source_packet_id: { type: string }
        trace_id: { type: string }
        use_home_operator_prompt: { type: boolean }
      additionalProperties: true

    PtySendResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error:
          oneOf:
            - type: string
            - type: "null"
      additionalProperties: true

    SchedulerWorkerConfig:
      type: object
      properties:
        name: { type: string }
        plan_id: { type: string }
        pts: { type: string }
        prompt: { type: string }
        use_home_operator_prompt: { type: boolean }
        cycle_minutes: { type: number, minimum: 0 }
        enter_seconds: { type: number, minimum: 0 }
      additionalProperties: true

    SchedulerActivity:
      type: object
      properties:
        action: { type: string }
        worker: { type: string }
        pts: { type: string }
        packet_id: { type: string }
        prompt_preview: { type: string }
        ok: { type: boolean }
        error:
          oneOf:
            - type: string
            - type: "null"
        next_enter_in: { type: integer }
        next_prompt_in: { type: integer }
      additionalProperties: true

    SchedulerLogEntry:
      type: object
      properties:
        ts: { type: string }
        worker: { type: string }
        action: { type: string }
        pts: { type: string }
        packet_id: { type: string }
        ok: { type: boolean }
        error:
          oneOf:
            - type: string
            - type: "null"
      additionalProperties: true

    SchedulerStatusWorker:
      type: object
      properties:
        name: { type: string }
        plan_id: { type: string }
        pts: { type: string }
        prompt_preview: { type: string }
        active_issue: { type: string }
        use_home_operator_prompt: { type: boolean }
        cycle_min: { type: number }
        enter_sec: { type: number }
        next_enter_in: { type: integer }
        next_prompt_in: { type: integer }
      additionalProperties: true

    SchedulerStatusResponse:
      type: object
      required: [running, workers, log]
      properties:
        running: { type: boolean }
        started_at:
          oneOf:
            - type: string
            - type: "null"
        workers:
          type: array
          items: { $ref: "#/components/schemas/SchedulerStatusWorker" }
        current_activity:
          oneOf:
            - $ref: "#/components/schemas/SchedulerActivity"
            - type: "null"
        last_activity:
          oneOf:
            - $ref: "#/components/schemas/SchedulerActivity"
            - type: "null"
        log:
          type: array
          items: { $ref: "#/components/schemas/SchedulerLogEntry" }
      additionalProperties: true

    SchedulerStartRequest:
      type: object
      required: [cycle_minutes, enter_seconds, workers]
      properties:
        cycle_minutes: { type: number, minimum: 0 }
        enter_seconds: { type: number, minimum: 0 }
        workers:
          type: array
          items: { $ref: "#/components/schemas/SchedulerWorkerConfig" }
      additionalProperties: false

    SchedulerStartResponse:
      type: object
      required: [ok, workers]
      properties:
        ok: { type: boolean, const: true }
        workers: { type: integer, minimum: 0 }
      additionalProperties: true

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
      additionalProperties: true

    SendNowRequest:
      type: object
      properties:
        worker_index: { type: integer, minimum: 0 }
      additionalProperties: false

    EnterNowRequest:
      type: object
      description: |
        worker_index를 지정하면 해당 worker에만 Enter를 전송한다.
        생략하면 현재 등록된 모든 scheduler worker에 Enter를 전송한다.
      properties:
        worker_index: { type: integer, minimum: 0 }
      additionalProperties: false

    SchedulerDispatchResult:
      type: object
      required: [worker, ok]
      properties:
        worker: { type: string }
        ok: { type: boolean }
        error:
          oneOf:
            - type: string
            - type: "null"
      additionalProperties: true

    SchedulerDispatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SchedulerDispatchResult" }
      additionalProperties: true

    FlagDetail:
      type: object
      required: [flag, enabled, env_overridden, source]
      properties:
        flag: { type: string }
        enabled: { type: boolean }
        env_overridden: { type: boolean }
        source:
          type: string
          enum: [env, "flags.yaml"]
      additionalProperties: false

    FlagsResponse:
      type: object
      required: [as_of, env_overrides_applied, env_overridden_flags, enabled_flags, flags]
      properties:
        as_of: { type: string }
        env_overrides_applied: { type: integer, minimum: 0 }
        env_overridden_flags:
          type: array
          items: { type: string }
        enabled_flags:
          type: array
          items: { type: string }
        flags:
          type: array
          items: { $ref: "#/components/schemas/FlagDetail" }
      additionalProperties: false

  responses:
    BadRequest:
      description: "잘못된 요청"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: "인증 필요"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: "권한 부족"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: "동시 작업 충돌"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    UnprocessableContent:
      description: "같은 멱등성 키에 다른 요청 본문을 재사용함"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: "리소스를 찾을 수 없음"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    InternalError:
      description: "RFC 7807 형식 내부 오류"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    LegacyBadRequest:
      description: "레거시 브리지의 단순 400 오류 응답"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
    LegacyInternalError:
      description: "레거시 브리지의 단순 500 오류 응답"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
