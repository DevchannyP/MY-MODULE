openapi: "3.0.3"
info:
  title: "System OS API"
  version: "0.1.0"
  x-api-id: "system-api"
  x-api-audience: "internal"
  x-api-version-policy: "semver-with-explicit-breaking-review"
  description: |
    Workflow OS 시스템 관리 API 계약.
    capability.yaml의 9개 capability를 HTTP로 노출한다.
    도메인 건강도, 피처 플래그, 카탈로그, 감사 로그, 품질 게이트,
    롤백, 라이프사이클, SSE 이벤트 스트림을 제공한다.

servers:
  - url: /api/v1

tags:
  - name: health
    description: 시스템 건강도
  - name: flags
    description: 피처 플래그 관리
  - name: catalog
    description: 도메인 카탈로그
  - name: audit
    description: 감사 로그
  - name: quality-gate
    description: 품질 게이트
  - name: rollback
    description: 도메인 롤백
  - name: lifecycle
    description: 도메인 라이프사이클
  - name: events
    description: 실시간 이벤트 스트림

paths:
  # ── 헬스 ─────────────────────────────────────────────────────────────────
  /system/health:
    get:
      summary: "시스템 전체 건강도 조회"
      description: "모든 등록 도메인의 건강 점수, 테스트 통과율, 인프라 상태를 반환한다."
      operationId: "getSystemHealth"
      tags: [health]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  # ── 피처 플래그 ───────────────────────────────────────────────────────────
  /system/flags:
    get:
      summary: "피처 플래그 목록 조회"
      operationId: "listFeatureFlags"
      tags: [flags]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  /system/flags/{flagId}:
    patch:
      summary: "피처 플래그 토글"
      description: |
        INV-SYS-001: system.admin 권한 필요.
        INV-SYS-004: flag_toggle_ui.enabled=false이면 503 반환.
      operationId: "toggleFeatureFlag"
      tags: [flags]
      parameters:
        - name: flagId
          in: path
          required: true
          schema: { type: string }
          description: "토글할 피처 플래그 ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureFlagUpdateRequest" }
      responses:
        "200":
          description: "토글 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      security: [{ bearerAuth: [] }]

  # ── 카탈로그 ──────────────────────────────────────────────────────────────
  /system/catalog:
    get:
      summary: "도메인 카탈로그 조회"
      description: "등록된 모든 도메인의 메타데이터, 라우트, 계약 정보, 어댑터 프로필을 반환한다."
      operationId: "getDomainCatalog"
      tags: [catalog]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainCatalogResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  # ── 감사 로그 ─────────────────────────────────────────────────────────────
  /system/audit:
    get:
      summary: "감사 로그 조회"
      description: "SHA-256 해시 체인 형식의 감사 로그를 페이지네이션으로 조회한다."
      operationId: "getAuditLog"
      tags: [audit]
      parameters:
        - name: domain
          in: query
          schema: { type: string }
          description: "도메인 필터"
        - name: stage
          in: query
          schema:
            type: string
            enum: [A, B, C, D, E]
          description: "스테이지 필터"
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: "시작 시각"
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: "종료 시각"
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  # ── 품질 게이트 ───────────────────────────────────────────────────────────
  /system/quality-gate:
    get:
      summary: "품질 게이트 상태 조회"
      description: "전 도메인의 품질 게이트 통과/실패 현황을 반환한다."
      operationId: "getQualityGateStatus"
      tags: [quality-gate]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityGateStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  # ── 롤백 ──────────────────────────────────────────────────────────────────
  /system/rollback/{domain}:
    post:
      summary: "도메인 롤백 트리거"
      description: |
        지정된 도메인의 피처 플래그를 비활성화하여 롤백을 수행한다.
        INV-SYS-002: system.admin 권한 필요.
        INV-SYS-005: rollback_ui.enabled=false이면 503 반환.
      operationId: "triggerDomainRollback"
      tags: [rollback]
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string }
          description: "롤백 대상 도메인 ID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        "200":
          description: "롤백 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RollbackResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      security: [{ bearerAuth: [] }]

  # ── 라이프사이클 ──────────────────────────────────────────────────────────
  /system/lifecycle:
    get:
      summary: "도메인 라이프사이클 상태 조회"
      description: "도메인별 Stage A~E 진행 상태, 다음 액션, 분리 가능 여부를 반환한다."
      operationId: "getDomainLifecycle"
      tags: [lifecycle]
      responses:
        "200":
          description: "성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainLifecycleResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]

  # ── SSE 이벤트 스트림 ─────────────────────────────────────────────────────
  /system/events:
    get:
      summary: "실시간 시스템 이벤트 스트림 (SSE)"
      description: |
        Server-Sent Events 프로토콜로 시스템 이벤트를 실시간 수신한다.
        클라이언트는 EventSource API로 연결한다.
      operationId: "subscribeSystemEvents"
      tags: [events]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
          description: "재연결 시 마지막 수신 이벤트 ID"
      responses:
        "200":
          description: "SSE 스트림 개시"
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 형식 이벤트 스트림"
          headers:
            Cache-Control:
              schema: { type: string, example: "no-cache" }
            Connection:
              schema: { type: string, example: "keep-alive" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/FeatureDisabled" }
      security: [{ bearerAuth: [] }]
      x-sse-events:
        - system.health.updated
        - system.flag.toggled
        - system.rollback.triggered
        - system.quality-gate.updated
        - system.domain.lifecycle-changed

# ── 컴포넌트 ──────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── 헬스 ──────────────────────────────────────────────────────────────
    DomainHealthEntry:
      type: object
      required: [id, name, health_score, stage, flag_active, trend]
      properties:
        id:           { type: string, example: "billing" }
        name:         { type: string, example: "정산관리" }
        health_score: { type: integer, minimum: 0, maximum: 100 }
        stage:        { type: string, enum: [A, B, C, D, E, COMPLETE] }
        flag_active:  { type: boolean }
        trend:        { type: string, enum: [UP, STABLE, DOWN] }

    PersistenceStatus:
      type: object
      required: [type, status]
      properties:
        type:   { type: string, example: "sqlite" }
        status: { type: string, enum: [CONNECTED, DISCONNECTED, DEGRADED] }

    ObservabilityStatus:
      type: object
      required: [exporter, endpoint]
      properties:
        exporter: { type: string, example: "opentelemetry" }
        endpoint: { type: string, format: uri, example: "http://localhost:4318" }

    SystemHealthResponse:
      type: object
      required: [as_of, overall_status, domains, total_tests, passing_tests, persistence, observability]
      properties:
        as_of:
          type: string
          format: date-time
        overall_status:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN]
        domains:
          type: array
          items: { $ref: "#/components/schemas/DomainHealthEntry" }
        total_tests:
          type: integer
          minimum: 0
        passing_tests:
          type: integer
          minimum: 0
        persistence:    { $ref: "#/components/schemas/PersistenceStatus" }
        observability:  { $ref: "#/components/schemas/ObservabilityStatus" }

    # ── 피처 플래그 ───────────────────────────────────────────────────────
    FeatureFlag:
      type: object
      required: [id, value, group, description, last_changed_at, rollout_percentage]
      properties:
        id:                 { type: string, example: "billing.enabled" }
        value:              { type: boolean }
        group:              { type: string, example: "billing" }
        description:        { type: string }
        last_changed_at:    { type: string, format: date-time }
        rollout_percentage: { type: integer, minimum: 0, maximum: 100 }
        depends_on:
          type: array
          items: { type: string }
          default: []

    FeatureFlagListResponse:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items: { $ref: "#/components/schemas/FeatureFlag" }

    FeatureFlagUpdateRequest:
      type: object
      required: [value]
      properties:
        value: { type: boolean }

    # ── 카탈로그 ──────────────────────────────────────────────────────────
    DomainContractInfo:
      type: object
      properties:
        capability: { type: string, description: "capability.yaml 경로" }
        openapi:    { type: string, description: "openapi.yaml 경로" }
        ui:         { type: string, description: "ui-contract.yaml 경로" }
        events:     { type: string, description: "events.schema.json 경로" }

    DomainCatalogEntry:
      type: object
      required: [id, name, group, stage, health_score, routes, contracts, adapter_profile]
      properties:
        id:              { type: string, example: "billing" }
        name:            { type: string, example: "정산관리" }
        group:           { type: string, example: "정산" }
        stage:           { type: string, enum: [A, B, C, D, E, COMPLETE] }
        health_score:    { type: integer, minimum: 0, maximum: 100 }
        routes:
          type: array
          items: { type: string }
          example: ["/billing", "/billing/invoices", "/billing/exceptions"]
        contracts:       { $ref: "#/components/schemas/DomainContractInfo" }
        adapter_profile: { type: string, enum: [in-memory, sqlite, external] }

    DomainCatalogResponse:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/DomainCatalogEntry" }

    # ── 감사 로그 ─────────────────────────────────────────────────────────
    AuditLogEntry:
      type: object
      required: [seq, timestamp, domain, stage, action, result, hash, prev_hash]
      properties:
        seq:       { type: integer, minimum: 0 }
        timestamp: { type: string, format: date-time }
        domain:    { type: string }
        stage:     { type: string }
        action:    { type: string }
        result:    { type: string, enum: [PASS, FAIL, SKIP, INFO] }
        hash:      { type: string, pattern: "^[a-f0-9]{64}$", description: "SHA-256 해시" }
        prev_hash: { type: string, pattern: "^[a-f0-9]{64}$", description: "이전 항목 SHA-256 해시" }

    AuditLogResponse:
      type: object
      required: [entries, total, page, page_size]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total:     { type: integer, minimum: 0 }
        page:      { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 200 }

    # ── 품질 게이트 ───────────────────────────────────────────────────────
    QualityGateEntry:
      type: object
      required: [domain, gate_name, status, last_run_at, detail]
      properties:
        domain:      { type: string }
        gate_name:   { type: string, example: "architecture-fitness" }
        status:      { type: string, enum: [PASS, FAIL, SKIP] }
        last_run_at: { type: string, format: date-time }
        detail:      { type: string }

    QualityGateSummary:
      type: object
      required: [total, passing, failing]
      properties:
        total:   { type: integer, minimum: 0 }
        passing: { type: integer, minimum: 0 }
        failing: { type: integer, minimum: 0 }

    QualityGateStatusResponse:
      type: object
      required: [gates, summary]
      properties:
        gates:
          type: array
          items: { $ref: "#/components/schemas/QualityGateEntry" }
        summary: { $ref: "#/components/schemas/QualityGateSummary" }

    # ── 롤백 ─────────────────────────────────────────────────────────────
    RollbackRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000, description: "롤백 사유 (선택)" }

    RollbackResponse:
      type: object
      required: [domain, status, flag_before, flag_after, triggered_at]
      properties:
        domain:       { type: string }
        status:       { type: string, enum: [ROLLED_BACK, ALREADY_DISABLED, FAILED] }
        flag_before:  { type: boolean }
        flag_after:   { type: boolean }
        triggered_at: { type: string, format: date-time }

    # ── 라이프사이클 ──────────────────────────────────────────────────────
    StageStatus:
      type: object
      required: [status]
      properties:
        status:       { type: string, enum: [NOT_STARTED, IN_PROGRESS, PASS, FAIL] }
        completed_at: { type: string, format: date-time, nullable: true }

    DomainStages:
      type: object
      required: [A, B, C, D, E]
      properties:
        A: { $ref: "#/components/schemas/StageStatus" }
        B: { $ref: "#/components/schemas/StageStatus" }
        C: { $ref: "#/components/schemas/StageStatus" }
        D: { $ref: "#/components/schemas/StageStatus" }
        E: { $ref: "#/components/schemas/StageStatus" }

    DomainLifecycleEntry:
      type: object
      required: [id, name, stages, next_action, ejectable]
      properties:
        id:          { type: string }
        name:        { type: string }
        stages:      { $ref: "#/components/schemas/DomainStages" }
        next_action: { type: string, description: "다음 실행 권장 액션", example: "Stage D 실행" }
        ejectable:   { type: boolean, description: "독립 마이크로서비스로 분리 가능 여부" }

    DomainLifecycleResponse:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/DomainLifecycleEntry" }

    # ── 공통 에러 ─────────────────────────────────────────────────────────
    ProblemDetails:
      type: object
      required: [type, title, status, code, message]
      properties:
        type:           { type: string, format: uri }
        title:          { type: string }
        status:         { type: integer }
        detail:         { type: string }
        message:        { type: string }
        code:           { type: string }
        instance:       { type: string, nullable: true }
        correlation_id: { type: string }
        traceId:        { type: string, nullable: true }

  responses:
    BadRequest:
      description: "잘못된 요청"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: "인증 필요"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: "권한 없음"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: "상태 충돌 또는 동시 작업 충돌"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: "리소스를 찾을 수 없음"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    FeatureDisabled:
      description: "INV-SYS-003: system_api.enabled=false — 기능 비활성화 상태"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ServiceUnavailable:
      description: "INV-SYS-004/005: 해당 기능의 피처 플래그가 비활성화 상태"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
