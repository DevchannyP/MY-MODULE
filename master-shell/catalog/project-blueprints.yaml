# Master Shell - Project Blueprints
# 새로운 프로젝트를 시작할 때 마스터 UI가 보여줄 기획/구성 시작점.
version: "0.1.0"
last_updated: "2026-03-24"

blueprints:
  - id: "master-os-ai-studio"
    name: "마스터 OS AI 스튜디오"
    summary: "하나의 마스터 UI에서 AI 계획, 학습, 운영, 모듈 확장을 함께 다루는 기본 청사진"
    when_to_use: "새 프로젝트를 시작하면서 AI 기획서, GUI 학습 구조, 운영 게이트를 한 번에 세우고 싶을 때"
    architecture_profile: "master-os-shell"
    recommended_modules:
      - "task-management"
      - "billing"
      - "video"
    starter_sequence:
      - step: "요구사항 정의"
        focus: "requirements, constraints, domain-map을 먼저 확정한다"
      - step: "도메인 포트 생성"
        focus: "OpenAPI, events, ui-contract, capability를 먼저 만든다"
      - step: "마스터 UI 편입"
        focus: "plugin-registry, navigation, feature-flags, planner guide를 연결한다"
      - step: "운영 게이트 고정"
        focus: "smoke, slo, rollout, rollback, observability를 활성화한다"
    success_checks:
      - "planner에서 기획/학습/어댑터 구조가 한 화면에서 읽힌다"
      - "validate:composition이 plugin, blueprint, adapter 정합성을 보장한다"
      - "새 모듈이 기존 코드를 건드리지 않고 등록 가능하다"
    learning_tracks:
      - "master-os-foundation"
      - "project-bootstrap"

  - id: "domain-module-extension"
    name: "도메인 모듈 확장"
    summary: "기존 마스터 OS에 새 bounded context를 안전하게 추가하는 확장 청사진"
    when_to_use: "새 프로젝트 전체를 만들기보다 기존 플랫폼에 도메인 기능을 추가할 때"
    architecture_profile: "workflow-domain-module"
    recommended_modules:
      - "task-management"
      - "billing"
      - "video"
    starter_sequence:
      - step: "Stage A 설계 메모 생성"
        focus: "유비쿼터스 언어, INV, 권한, 이벤트를 먼저 합의한다"
      - step: "어댑터 선택"
        focus: "transport, observability, storage를 profile로 선택한다"
      - step: "master-shell 등록"
        focus: "plugin-registry와 nav에 entry point를 연결한다"
      - step: "feature rollout 준비"
        focus: "flag metadata와 smoke 시나리오를 추가한다"
    success_checks:
      - "module 코어가 외부 프레임워크에 직접 의존하지 않는다"
      - "ui-contract만으로 planner에 새 화면 설명이 노출된다"
      - "기존 domain과 직접 import 없이 조합된다"
    learning_tracks:
      - "module-extension-lab"

  - id: "stateful-workflow-service"
    name: "상태 저장형 워크플로우 서비스"
    summary: "영속 저장소와 운영 지표를 갖춘 실서비스형 워크플로우 모듈 청사진"
    when_to_use: "테스트용 in-memory에서 실제 저장소 기반 서비스로 발전시킬 때"
    architecture_profile: "stateful-domain-module"
    recommended_modules:
      - "task-management"
    starter_sequence:
      - step: "포트 유지"
        focus: "repository port를 유지한 채 in-memory와 SQLite를 병행한다"
      - step: "관측 강화"
        focus: "trace, request id, deployment smoke를 먼저 연결한다"
      - step: "운영 안전장치"
        focus: "idempotency, timeout, drain, rate limit을 transport에 고정한다"
    success_checks:
      - "storage 교체가 use case 변경 없이 가능하다"
      - "smoke 테스트가 persistent mode에서도 통과한다"
      - "drain/readiness로 무중단 배포 준비가 된다"
    learning_tracks:
      - "runtime-operations"
