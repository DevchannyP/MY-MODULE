# Master Shell - AI Learning Map
# GUI만 보더라도 AI 흐름과 프로젝트 구조를 학습할 수 있도록 단계별 학습 경로를 정의한다.
version: "0.1.0"
last_updated: "2026-03-24"

tracks:
  - id: "master-os-foundation"
    title: "마스터 OS 기초"
    persona: "새 프로젝트를 시작하는 기획자 또는 운영자"
    objective: "마스터 UI만 보고도 현재 프로젝트의 목적, 도메인, 품질 게이트, 운영 구조를 이해한다."
    steps:
      - id: "vision"
        tab: "기획서"
        section: "s01"
        title: "프로젝트 비전 읽기"
        learn: "이 시스템이 해결하려는 문제와 성공 지표를 파악한다."
      - id: "domain-map"
        tab: "요구사항"
        section: "domain-map"
        title: "도메인 경계 이해"
        learn: "bounded context와 invariant를 읽고 모듈 경계를 학습한다."
      - id: "master-shell"
        tab: "도메인"
        section: "adapter-registry"
        title: "어댑터 구조 보기"
        learn: "마스터 UI와 도메인이 어떤 adapter profile로 조합되는지 이해한다."
      - id: "ops"
        tab: "감사·학습"
        section: "reports"
        title: "학습 로그 복습"
        learn: "실패 패턴과 개선 기록을 읽고 운영 판단 기준을 익힌다."

  - id: "project-bootstrap"
    title: "프로젝트 시작 플로우"
    persona: "새로운 AI 프로젝트를 등록하려는 설계자"
    objective: "기획서에서 구현, 편입, 운영 게이트까지의 시작 순서를 GUI에서 따라간다."
    steps:
      - id: "pick-blueprint"
        tab: "요구사항"
        section: "blueprints"
        title: "블루프린트 선택"
        learn: "프로젝트 유형에 맞는 starter blueprint를 선택한다."
      - id: "write-contracts"
        tab: "기획서"
        section: "s03"
        title: "계약 우선 작성"
        learn: "OpenAPI, UI contract, capability를 먼저 확정해야 하는 이유를 이해한다."
      - id: "register-plugin"
        tab: "기획서"
        section: "s04"
        title: "마스터 UI 편입"
        learn: "plugin-registry, navigation, feature flag가 왜 함께 움직여야 하는지 이해한다."
      - id: "close-quality"
        tab: "스프린트"
        section: "quality"
        title: "품질 게이트 닫기"
        learn: "검증 통과 전에는 완료 선언을 하지 않는 운영 습관을 익힌다."

  - id: "module-extension-lab"
    title: "모듈 확장 실습"
    persona: "새 bounded context를 추가하는 개발자"
    objective: "기존 시스템을 건드리지 않고 새 모듈을 조합하는 방법을 익힌다."
    steps:
      - id: "stage-a"
        tab: "기획서"
        section: "s02"
        title: "Stage A 설계 메모 작성"
        learn: "유비쿼터스 언어와 INV를 먼저 결정한다."
      - id: "profile"
        tab: "도메인"
        section: "adapter-registry"
        title: "어댑터 프로파일 선택"
        learn: "workflow-domain-module과 stateful-domain-module의 차이를 이해한다."
      - id: "ui-guide"
        tab: "도메인"
        section: "ui-guides"
        title: "화면 설명서 점검"
        learn: "GUI만으로도 새 도메인 기능 흐름을 읽을 수 있도록 화면 계약을 작성한다."
      - id: "rollout"
        tab: "요구사항"
        section: "blueprints"
        title: "점진적 롤아웃 준비"
        learn: "feature flag와 smoke를 함께 준비해야 안전하게 확장할 수 있음을 이해한다."

  - id: "runtime-operations"
    title: "런타임 운영 학습"
    persona: "배포와 운영 안정성을 담당하는 개발자"
    objective: "transport 안전장치와 운영 지표를 어떤 순서로 읽어야 하는지 학습한다."
    steps:
      - id: "transport"
        tab: "도메인"
        section: "adapter-registry"
        title: "transport adapter 읽기"
        learn: "Problem Details, timeout, drain, rate limit이 왜 필수 안전장치인지 이해한다."
      - id: "sprint-smoke"
        tab: "스프린트"
        section: "quality"
        title: "검증 이력 확인"
        learn: "lint, test, e2e smoke의 역할 차이를 이해한다."
      - id: "audit"
        tab: "감사·학습"
        section: "audit"
        title: "감사 체인 복기"
        learn: "운영 판단이 어떤 증적 위에서 이뤄지는지 파악한다."
