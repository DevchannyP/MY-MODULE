    objective: "작은 작업단위마다 read-first/read-next/deferred를 더 엄격히 나누고, exact context lock과 drift 상태를 같은 surface에서 읽게 만든다."
    preserve_essence: "필요한 파일만 읽는 원칙으로 토큰 효율과 AI 성능을 높이되, 코어 OS는 고정한다."
    why_now:
      - "토큰 효율이 낮아지면 마스터 OS 전체 성능과 학습 속도가 같이 무너진다."
      - "context routing, lock, reread가 분리돼 보이면 운영자가 실제 최소 문맥 원칙을 체감하기 어렵다."
