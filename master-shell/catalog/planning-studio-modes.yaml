# Master Shell - Planning Studio Modes
# 프로젝트 시작 전 planner에서 선택형 기획 캔버스를 제공한다.
version: "0.1.0"
last_updated: "2026-03-24"

modes:
  - id: "master-prd"
    title: "Master PRD"
    summary: "문제, 성공지표, 모듈 경계, adapter 전략을 한 번에 정리하는 기본 planning mode"
    preserve_essence: "기획서가 코어 truth surface가 되고, 마스터 UI가 프로젝트 시작점 역할을 하도록 유지한다."
    benchmark_refs:
      - "figjam-strategy-planning"
      - "figjam-project-status-template"
      - "linear-focus-priority"
    sections:
      - id: "problem"
        label: "문제 정의"
        prompt: "이 프로젝트가 반드시 해결해야 하는 핵심 문제를 한 문단으로 정리한다."
      - id: "north_star"
        label: "성공 지표"
        prompt: "이 계획이 성공했는지 판단할 수 있는 핵심 지표와 guardrail을 적는다."
      - id: "module_boundary"
        label: "모듈 경계"
        prompt: "이번 계획에서 새로 생기거나 강화되는 bounded context, plugin, contract 경계를 적는다."
      - id: "adapter_strategy"
        label: "어댑터 전략"
        prompt: "유지할 adapter, 추가할 adapter, 교체 가능성을 적는다."
      - id: "operator_view"
        label: "운영자/학습자 화면"
        prompt: "GUI만 보고도 이해돼야 하는 핵심 흐름과 로그/학습 surface를 적는다."

  - id: "cycle-brief"
    title: "Cycle Brief"
    summary: "짧은 실행 주기, must-not-slip, review cadence를 먼저 고정하는 planning mode"
    preserve_essence: "작은 작업단위로 쪼개되 코어 구조를 흔들지 않고, 시작부터 실행 리듬을 명확히 한다."
    benchmark_refs:
      - "linear-cycles"
      - "linear-focus-priority"
      - "figjam-project-status-template"
    sections:
      - id: "cycle_goal"
        label: "이번 사이클 목표"
        prompt: "이번 cycle에서 반드시 닫아야 할 결과를 한 줄로 적는다."
      - id: "must_not_slip"
        label: "밀리면 안 되는 것"
        prompt: "이번 cycle에서 절대 밀리면 안 되는 범위나 품질 조건을 적는다."
      - id: "review_cadence"
        label: "리뷰 리듬"
        prompt: "중간 점검, 로그 확인, plan review 시점을 적는다."
      - id: "evidence"
        label: "증적"
        prompt: "종료 시 남겨야 할 artifact, smoke, log, report를 적는다."

  - id: "change-control"
    title: "Change Control"
    summary: "코어는 고정하고 edge만 바꾸는 계획에 적합한 planning mode"
    preserve_essence: "시스템 OS 코어를 건드리지 않고, 필요한 계획만 정확히 추가하는 원칙을 유지한다."
    benchmark_refs:
      - "figjam-change-control-template"
      - "clova-safe-ai-lifecycle"
      - "openai-agentkit-observability"
    sections:
      - id: "change_request"
        label: "변경 요청"
        prompt: "무엇을 바꾸고 무엇은 절대 바꾸지 않는지 적는다."
      - id: "core_guardrail"
        label: "코어 가드레일"
        prompt: "master OS 코어와 existing module에 주면 안 되는 영향을 적는다."
      - id: "risk_and_observability"
        label: "리스크와 관측"
        prompt: "이 변경을 안전하게 볼 수 있는 로그, alert, review 기준을 적는다."
      - id: "rollback"
        label: "롤백"
        prompt: "문제가 생기면 어떤 기준으로 되돌릴지 적는다."
