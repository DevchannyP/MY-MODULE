# Master Shell - 도메인 카탈로그
# 마스터 UI 포털에서 탐색 가능한 도메인 목록
version: "0.3.0"
last_updated: "2026-03-25"

domains:
  - id: "productivity"
    name: "생산성 관리"
    description: "담당자가 작업을 체계적으로 생성·관리·완료하여 업무 효율을 높이는 도메인 영역"
    bounded_contexts:
      - id: "task-tracking"
        name: "작업 추적"
        description: "작업의 생애주기(생성→진행→완료)를 추적하고 담당자·마감일을 관리한다"
        stage_a_memory: "memory/stageA/task-management.yaml"
        stage_b_memory: "memory/stageB/task-management-composition.yaml"
    plugins:
      - "task-management-plugin"
    domain_map_ref: "requirements/domain-map.yaml"
    status: "active"
    registered_at: "2026-03-17"
    activated_at: "2026-03-25"
    note: "B_review PASS → full(100%) rollout 완료. enable_task_management: true."

  - id: "video"
    name: "콘텐츠 관리"
    description: "영상 업로드·트랜스코딩·재생 관리. INV-V001~V005 불변조건을 유지하는 비디오 도메인 영역."
    bounded_contexts:
      - id: "video-content"
        name: "비디오 콘텐츠"
        description: "Video 생애주기(UPLOADED→READY→ARCHIVED) 관리와 TranscodeJob 비동기 처리."
        stage_a_memory: "memory/stageA/video.yaml"
    stage_b_memory: "memory/stageB/video.yaml"
    plugins:
      - "video-plugin"
    domain_map_ref: "requirements/domain-map.yaml"
    status: "active"
    registered_at: "2026-03-20"
    activated_at: "2026-03-25"
    note: "B_review PASS → full(100%) rollout 완료. video.enabled: true. 8개 이벤트 중앙 레지스트리 등록 완료."

  - id: "billing"
    name: "정산관리"
    description: "인보이스 생성·상태전이, 결제 추적, 미매칭 예외처리를 담당하는 도메인 영역"
    bounded_contexts:
      - id: "billing.invoice"
        name: "인보이스"
        description: "인보이스 생성·조회·상태전이. 합계 불변조건(INV-B001) 항상 유지."
        stage_a_memory: "memory/stageA/billing.invoice.yaml"
      - id: "billing.payment"
        name: "결제상태"
        description: "결제 요청·응답 추적. 미매칭 감지 (INV-B006)."
        stage_a_memory: "memory/stageA/billing.payment.yaml"
      - id: "billing.exception"
        name: "정산 예외"
        description: "미매칭·오류 항목 관리자 승인 워크플로. DISPUTED→PAID는 admin 전용 (INV-B005)."
        stage_a_memory: "memory/stageA/billing.exception.yaml"
    stage_b_memory: "memory/stageB/billing.yaml"
    plugins:
      - "billing-plugin"
    domain_map_ref: "requirements/domain-map.yaml"
    status: "active"
    registered_at: "2026-03-18"
    activated_at: "2026-03-25"
    note: "B_review PASS → full(100%) rollout 완료. billing.enabled: true."
