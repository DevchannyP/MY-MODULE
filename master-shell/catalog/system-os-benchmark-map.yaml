version: "0.1.0"
last_reviewed: "2026-03-28"
review_policy: "official-docs-only"

benchmark_sources:
  - id: "github-projects"
    label: "GitHub Projects"
    region: "global"
    url: "https://docs.github.com/en/issues/planning-and-tracking-with-projects/learning-about-projects/about-projects"
    signal: "적응형 프로젝트 뷰, 커스텀 필드, 로드맵/차트 기반 상태 공유"
  - id: "jira-product-discovery"
    label: "Jira Product Discovery"
    region: "global"
    url: "https://support.atlassian.com/jira-product-discovery/docs/understand-the-matrix-view/"
    signal: "아이디어를 다차원 매트릭스로 우선순위화하고 공유하는 planning surface"
  - id: "github-project-fields"
    label: "GitHub Project Fields"
    region: "global"
    url: "https://docs.github.com/en/issues/planning-and-tracking-with-projects/understanding-fields"
    signal: "커스텀 필드, 날짜, iteration을 구조화해 planning truth와 roadmap를 같은 데이터면으로 유지"
  - id: "linear-timeline"
    label: "Linear Timeline"
    region: "global"
    url: "https://linear.app/docs/timeline"
    signal: "프로젝트 의존성과 타임라인을 분리해 상위 로드맵을 깔끔하게 유지"
  - id: "linear-cycles"
    label: "Linear Cycles"
    region: "global"
    url: "https://linear.app/docs/use-cycles"
    signal: "반복 cadence, rollover, 자동 cycle 생성으로 실행 packet과 시간축을 함께 운영"
  - id: "linear-cycle-graph"
    label: "Linear Cycle Graph"
    region: "global"
    url: "https://linear.app/docs/cycle-graph"
    signal: "scope, started, completed 흐름을 시간선 위에서 비교해 진행/드리프트를 시각화"
  - id: "opentelemetry-nodejs"
    label: "OpenTelemetry Node.js"
    region: "global"
    url: "https://opentelemetry.io/docs/languages/js/getting-started/nodejs/"
    signal: "트레이스와 메트릭을 같은 관측 표준으로 묶어 계층 간 실행 흐름을 추적"
  - id: "opentelemetry-context-propagation"
    label: "OpenTelemetry Context Propagation"
    region: "global"
    url: "https://opentelemetry.io/docs/concepts/context-propagation/"
    signal: "trace context를 서비스 경계 너머로 넘겨 실행, 로그, 검증 이벤트를 같은 causal line으로 유지"
  - id: "github-environments"
    label: "GitHub Environments"
    region: "global"
    url: "https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-environments-for-deployment"
    signal: "deployment gate, 보호 규칙, 승인 흐름을 승격 단계와 직접 연결"
  - id: "github-workflow-artifacts"
    label: "GitHub Workflow Artifacts"
    region: "global"
    url: "https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/storing-and-sharing-data-from-a-workflow"
    signal: "실행 증적과 handoff bundle을 artifact로 묶어 재현성과 인수인계를 유지"
  - id: "github-deployment-protection"
    label: "GitHub Deployment Protection Rules"
    region: "global"
    url: "https://docs.github.com/actions/managing-workflow-runs-and-deployments/managing-deployments/configuring-custom-deployment-protection-rules"
    signal: "승격 직전 커스텀 보호 규칙을 붙여 외부 검증과 gate를 자동으로 연결"
  - id: "openapi-oas"
    label: "OpenAPI"
    region: "global"
    url: "https://spec.openapis.org/oas/latest.html"
    signal: "인터페이스 계약을 기계 판독 가능한 단일 기준으로 유지"
  - id: "json-schema"
    label: "JSON Schema"
    region: "global"
    url: "https://json-schema.org/specification-links"
    signal: "구조 검증 규칙을 스키마로 고정해 계층 간 데이터 드리프트를 줄임"
  - id: "cloudevents"
    label: "CloudEvents"
    region: "global"
    url: "https://github.com/cloudevents/spec/blob/main/README.md"
    signal: "이벤트 envelope를 표준화해 시스템 계층 간 비동기 전달을 일관화"
  - id: "clova-studio"
    label: "NAVER CLOVA Studio"
    region: "korea"
    url: "https://api.ncloud-docs.com/docs/ai-naver-clovastudio-summary"
    signal: "라우터, 스킬, 생성 API를 분리해 AI 작업 흐름을 운영 가능한 컴포넌트로 조합"

layers:
  - id: "planning-truth"
    title: "Planning Truth Layer"
    summary: "홈 내부 planning hub가 current-wp, next-actions, wp-queue, roadmap draft를 한 기준면으로 보여준다."
    benchmark_refs:
      - "github-projects"
      - "github-project-fields"
      - "jira-product-discovery"
      - "linear-timeline"
      - "linear-cycles"
    communication_paths:
      - source: "memory/current-wp.yaml"
        target: "/api/planning-studio/snapshot"
        purpose: "현재 실행 packet을 런타임과 홈이 같은 값으로 읽는다."
      - source: "memory/next-actions.yaml"
        target: "artifacts/home-data.json"
        purpose: "다음 실행과 홈 summary를 같은 진실면으로 유지한다."
      - source: "memory/project/master-planner-draft.yaml"
        target: "홈 로드맵 메모 편집기"
        purpose: "보조 계획 메모를 별도 surface 없이 홈 안에서 편집한다."
  - id: "contract-mesh"
    title: "Contract Mesh Layer"
    summary: "requirements, nav, ui-contract, capability, adapter profile이 같은 메뉴 언어로 묶여야 한다."
    benchmark_refs:
      - "openapi-oas"
      - "json-schema"
      - "cloudevents"
    communication_paths:
      - source: "requirements/*.yaml"
        target: "scripts/project_status.js"
        purpose: "단계와 모듈 포트폴리오를 상태 surface에 반영한다."
      - source: "master-shell/navigation/nav.yaml"
        target: "scripts/generate-ui-home.js"
        purpose: "운영 홈 노출 메뉴를 계약 기준으로 고정한다."
      - source: "domains/**/ui-contract.yaml"
        target: "메뉴 해설 스튜디오"
        purpose: "메뉴 설명과 실제 화면/액션을 같은 자료에서 생성한다."
  - id: "runtime-bridge"
    title: "Runtime Bridge Layer"
    summary: "홈 입력창, PTY 세션, 스케줄러, CLI 런타임이 직접 연결되어야 한다."
    benchmark_refs:
      - "clova-studio"
      - "github-projects"
    communication_paths:
      - source: "홈 CLI 프롬프트 허브"
        target: "/api/pty/send"
        purpose: "사용자 입력이 선택한 Codex/Claude PTY로 즉시 전달된다."
      - source: "worker 자동화 설정"
        target: "/api/pty/scheduler/start"
        purpose: "홈에서 저장한 주기/worker 설정이 런타임 스케줄러로 반영된다."
      - source: "artifacts/vscode-cli-automation/automation.ini"
        target: "/api/vscode-auto/status"
        purpose: "브리지 설정과 실제 자동화 준비도를 같은 판에서 진단한다."
  - id: "observability-loop"
    title: "Observability Loop"
    summary: "파일 활동, git 상태, audit chain, 런타임 이벤트가 같은 운영 루프로 보여야 한다."
    benchmark_refs:
      - "opentelemetry-nodejs"
      - "opentelemetry-context-propagation"
      - "github-projects"
      - "linear-cycle-graph"
    communication_paths:
      - source: "worklog/audit-chain.jsonl"
        target: "/api/live-activity"
        purpose: "완료된 작업 흐름과 현재 편집 흐름을 한 피드로 합친다."
      - source: "파일 워처"
        target: "홈 로드맵 활동 피드"
        purpose: "현재 바뀌는 파일과 계획 흐름을 바로 연결한다."
      - source: "PTY 스케줄러 로그"
        target: "홈 실행 로그"
        purpose: "수동 전송과 자동 전송을 같은 로그로 복기한다."
  - id: "promotion-safety"
    title: "Promotion Safety Layer"
    summary: "promotion pipeline, context lock, drift 상태가 계획과 실행 전환을 막아줘야 한다."
    benchmark_refs:
      - "github-projects"
      - "json-schema"
      - "github-environments"
      - "github-workflow-artifacts"
      - "github-deployment-protection"
    communication_paths:
      - source: "artifacts/promotion-pipeline/latest"
        target: "scripts/project_status.js"
        purpose: "승격 준비도와 drift 상태를 홈 요약에 노출한다."
      - source: "current packet validation"
        target: "권장 명령 세트"
        purpose: "실행 전후 검증 루틴을 운영 홈에서 바로 꺼내 쓴다."
