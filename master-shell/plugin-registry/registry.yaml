# Master Shell - Plugin Registry
# 마스터 UI에 탑재된 플러그인 목록
# Stage C에서만 수정한다.
# 마스터 UI는 이 파일 → ui_contract → capability_contract 순서로 읽는다. 모듈 코드는 읽지 않는다.
version: "0.3.0"
last_updated: "2026-03-25"

plugins:
  - id: "task-management-plugin"
    name: "작업 관리"                 # 도메인 언어. 기술 용어 금지.
    module_id: "task-management"
    entry_point: "/tasks"
    navigation:
      group: "productivity"
      label: "작업 관리"              # 마스터 UI 메뉴에 표시되는 레이블
      icon: "checklist"
      order: 1
    ui_contract: "domains/productivity/task-tracking/contract/ui-contract.yaml"
    capability_contract: "domains/productivity/task-tracking/contract/capability.yaml"
    feature_flag: "enable_task_management"
    rollout:
      strategy: "canary"
      current_phase: "full"
      percentage: 100                 # B_review PASS → full(100%) rollout 완료 (2026-03-25)
      full_rollout_condition: "Stage D 품질 게이트 전체 PASS 후"
    rollback:
      strategy: "disable_flag"
      flag: "enable_task_management"
      trigger_conditions:
        - "error_rate > 1%"
        - "authz 오류 발생"
        - "상태 전이 실패 급증"
    observability:
      dashboard: "master-shell/observability/config.yaml#task-management-dashboard"
      alert_group: "task-management-alerts"
    status: "active"                 # B_review PASS → active (2026-03-25)
    registered_at: "2026-03-17"
    owner: "productivity-team"
    architecture_profile: "stateful-domain-module"
    adapter_refs:
      - "master-ui-plugin-shell"
      - "http-problem-details"
      - "feature-flag-provider"
      - "observability-otel"
      - "repository-inmemory"
      - "repository-sqlite"
    stage_b_memory_ref: "memory/stageB/task-management-composition.yaml"
    notes: |
      - enable_task_management: false → 마스터 UI 미노출 상태.
      - enable_bulk_assign: false → 일괄 담당자 변경 기능 비활성.
      - Stage D PASS 후: status: active, rollout.percentage: 10 (canary) → 100 (전체)

  - id: "billing-plugin"
    name: "정산관리"
    module_id: "billing"
    entry_point: "/billing"
    navigation:
      group: "billing"
      label: "정산"
      icon: "receipt"
      order: 2
    ui_contract: "domains/billing/contracts/ui-contract.yaml"
    capability_contract: "domains/billing/contracts/capability.yaml"
    feature_flag: "billing.enabled"
    rollout:
      strategy: "canary"
      current_phase: "full"
      percentage: 100                 # B_review PASS → full(100%) rollout 완료 (2026-03-25)
      phases:
        - phase: internal
          percentage: 5
          condition: "Stage D 품질 게이트 PASS 후"
        - phase: beta
          percentage: 20
          condition: "internal 7일 이상 error_rate 기준 충족"
        - phase: full
          percentage: 100
          condition: "beta 7일 이상 error_rate 기준 충족"
    rollback:
      strategy: "disable_flag"
      flag: "billing.enabled"
      trigger_conditions:
        - "error_rate > 1%"
        - "authz 오류 발생"
        - "합계 불변조건(INV-B001) 위반 감지"
    observability:
      dashboard: "master-shell/observability/config.yaml#billing-dashboard"
      alert_group: "billing-alerts"
    status: "active"                 # B_review PASS → active (2026-03-25)
    registered_at: "2026-03-18"
    owner: "platform-team"
    architecture_profile: "workflow-domain-module"
    adapter_refs:
      - "master-ui-plugin-shell"
      - "http-problem-details"
      - "feature-flag-provider"
      - "observability-otel"
      - "repository-inmemory"
    stage_b_memory_ref: "memory/stageB/billing.yaml"
    notes: |
      - billing.enabled: false → 마스터 UI 미노출 상태.
      - billing.exception.enabled: false → 예외처리 화면 별도 제어 가능.
      - DISPUTED→PAID 전이는 billing.admin 권한 필요 (INV-B005).
      - Stage D PASS 후: status: active, internal 5% rollout 시작.

  - id: "video-plugin"
    name: "비디오 관리"
    module_id: "video"
    entry_point: "/videos"
    navigation:
      group: "content"
      label: "비디오"
      icon: "play_circle"
      order: 3
    ui_contract: "domains/video/contract/ui-contract.yaml"
    capability_contract: "domains/video/contract/capability.yaml"
    feature_flag: "video.enabled"
    rollout:
      strategy: "canary"
      current_phase: "full"
      percentage: 100                 # B_review PASS → full(100%) rollout 완료 (2026-03-25)
      phases:
        - phase: internal
          percentage: 5
          condition: "Stage D 품질 게이트 PASS 후"
        - phase: beta
          percentage: 20
          condition: "internal 7일 이상 error_rate 기준 충족"
        - phase: full
          percentage: 100
          condition: "beta 7일 이상 error_rate 기준 충족"
    rollback:
      strategy: "disable_flag"
      flag: "video.enabled"
      trigger_conditions:
        - "error_rate > 1%"
        - "authz 오류 발생"
        - "INV-V002 상태 전이 위반 감지"
    observability:
      dashboard: "master-shell/observability/config.yaml#video-dashboard"
      alert_group: "video-alerts"
    status: "active"                 # B_review PASS → active (2026-03-25)
    registered_at: "2026-03-20"
    owner: "video-team"
    architecture_profile: "workflow-domain-module"
    adapter_refs:
      - "master-ui-plugin-shell"
      - "http-problem-details"
      - "feature-flag-provider"
      - "observability-otel"
      - "repository-inmemory"
    stage_b_memory_ref: "memory/stageB/video.yaml"
    notes: |
      - video.enabled: false → Stage D PASS 후 internal 5% 시작.
      - INV-V004: 동시 RUNNING TranscodeJob 1개 제한.
      - RISK-V002: 트랜스코딩은 비동기 — UseCase는 Job ID만 반환.
