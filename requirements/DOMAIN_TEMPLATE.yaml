
# ═══════════════════════════════════════════════════════════════════════════════
# WORKFLOW OS — 도메인 요구사항 템플릿 v3.0
# ═══════════════════════════════════════════════════════════════════════════════
#
# 사용법:
#   1. 이 파일을 복사한다: cp DOMAIN_TEMPLATE.yaml my-domain.yaml
#   2. [필수] 표시된 항목을 채운다
#   3. Claude에게: "A [도메인명]" 입력
#   4. 이후 "계속"만 반복
#
# 작성 원칙:
#   - "무엇을 해야 하는가"만 적는다. "어떻게"는 Claude가 결정한다.
#   - 불확실하면 [확인 필요] 로 표시하고 비워둔다.
#   - 더 자세할수록 더 좋은 코드가 나온다.
#
# 참조 표준 (v3.0 기준):
#   ┌─ 도메인 설계 ──────────────────────────────────────────────────────────────┐
#   │ DDD          : Evans "Domain-Driven Design" (2003)                        │
#   │              + Vernon "Implementing DDD" (2013)                           │
#   │              + Wlaschin "Domain Modeling Made Functional" (2018)          │
#   │ 아키텍처     : Cockburn Hexagonal Architecture (2005)                     │
#   │              + Martin "Clean Architecture" (2017)                         │
#   │              + Brown C4 Model (c4model.com)                               │
#   │ 이벤트       : Brandolini "Introducing Event Storming" (2021)             │
#   │              + Young CQRS (2010) + Garcia-Molina Saga (1987)              │
#   │ 팀           : Skelton/Pais "Team Topologies" (2019)                      │
#   ├─ 보안 ─────────────────────────────────────────────────────────────────────┤
#   │ OWASP ASVS   : Application Security Verification Standard 4.0             │
#   │ NIST SP 800-53 Rev 5  : Security & Privacy Controls                       │
#   │ NIST SP 800-207       : Zero Trust Architecture                           │
#   │ NIST SP 800-218       : SSDF (Software Supply Chain Security)             │
#   │ ISO 27001:2022        : ISMS                                              │
#   │ MITRE ATT&CK : Enterprise Framework v14                                   │
#   │ CWE Top 25   : 2023 Edition                                               │
#   │ PCI-DSS v4.0 : 금융 카드 보안                                             │
#   ├─ 프라이버시 ───────────────────────────────────────────────────────────────┤
#   │ GDPR         : Article 5/17/25/32/35 (Privacy by Design & Default)        │
#   │ 개인정보보호법: 2023년 개정 + 개인정보 영향평가 고시                       │
#   │ ISO 29101    : Privacy Architecture Framework                              │
#   │ NIST PF 1.0  : Privacy Framework                                          │
#   ├─ 품질 & 테스트 ────────────────────────────────────────────────────────────┤
#   │ ISO/IEC 25010:2023    : SQuaRE 품질 특성                                  │
#   │ Meszaros "xUnit Test Patterns" (2007)                                     │
#   │ Fewster "Software Test Automation" + Mutation Testing (Jia/Harman 2011)   │
#   │ Pact.io    : Consumer-Driven Contract Testing                              │
#   │ Hypothesis : Property-Based Testing                                       │
#   ├─ 운영 & 신뢰성 ────────────────────────────────────────────────────────────┤
#   │ Google SRE Book (2016) + SRE Workbook (2018) — 4 Golden Signals          │
#   │ Burn Rate Alerts: SRE Workbook Ch.5 (Multi-Window, Multi-Burn-Rate)      │
#   │ DORA "Accelerate" (2018) + State of DevOps Report 2023                   │
#   │ Rosenthal "Chaos Engineering" (2020)                                      │
#   │ Nygard "Release It!" 2nd ed. (2018)                                      │
#   ├─ 공급망 ───────────────────────────────────────────────────────────────────┤
#   │ SLSA Framework v1.0  : Supply-chain Levels for Software Artifacts         │
#   │ SPDX 2.3 + CycloneDX 1.5 : SBOM 표준                                     │
#   │ NIST SSDF SP 800-218  : Secure Software Development Framework             │
#   └─ 금융 & 규제 ──────────────────────────────────────────────────────────────┘
#     Basel III/IV · PCI-DSS v4.0 · SOX · IFRS 9 · 전자금융거래법 · 근로기준법
# ═══════════════════════════════════════════════════════════════════════════════


# ── 1. 도메인 정체성 [필수] ────────────────────────────────────────────────────
# DDD 원칙: Bounded Context는 모델의 유효 경계다. 경계 밖에서 같은 단어는
# 다른 의미를 가진다. (Evans 2003, Ch.14)
identity:
  id: ""                          # [필수] 영문 소문자·하이픈 (예: billing, hr, inventory)
  name: ""                        # [필수] 한글 도메인 이름 (예: 정산관리)
  domain: ""                      # [필수] 최상위 도메인 (예: finance, productivity, ops)
  bounded_context: ""             # DDD 경계 컨텍스트 (생략 시 id와 동일)
  owner: ""                       # 책임 팀 (예: finance-team)
  description: |                  # [필수] 이 도메인이 해결하는 비즈니스 문제 (2~5줄)
    [이 도메인이 담당하는 핵심 업무를 설명한다]
    [주요 데이터 흐름과 책임 경계를 명시한다]
    [다른 도메인과의 경계선 — 무엇을 하지 않는지도 명시한다]

  # ── 리스크 수준 ──────────────────────────────────────────────────────────────
  # LOW    : 보조 기능, 공개 정보 (공지, FAQ, 대시보드 조회)
  # MEDIUM : 운영 영향, 일반 개인정보 (재고관리, CRM, 일정관리)
  # HIGH   : 금전 간접·핵심 개인정보 (정산, HR급여, 의료기록)
  # CRITICAL: 금전 직접 처리·규제 직적용 (결제원장, 증권, 개인신용)
  # → risk_level이 높을수록 불변조건·감사·보안이 자동 강화된다 (CLAUDE.md 참조)
  risk_level: MEDIUM              # LOW / MEDIUM / HIGH / CRITICAL

  # ── 제품 계층 (선택 — 배포 우선순위 결정에 사용) ─────────────────────────────
  # core     : 서비스 핵심 경쟁력 — 장애 시 서비스 불가
  # growth   : 사용자 경험 향상 — 장애 시 일부 기능 저하
  # support  : 운영 효율화 — 장애 시 내부 불편만 발생
  product_tier: "growth"          # core / growth / support


# ── 2. 유비쿼터스 언어 [필수] ─────────────────────────────────────────────────
# DDD 원칙: 개발자·도메인 전문가가 동일한 언어로 대화해야 한다.
# 이 목록이 클래스명·변수명·API 경로·이벤트명·DB 컬럼명의 유일한 근거다.
# 팁: 기획서·화면 설계서·법령에 등장하는 모든 핵심 명사를 추가한다.
# 팁: 동음이의어가 있는 경우 이 경계 컨텍스트에서의 의미를 명확히 적는다.
ubiquitous_language:
  - term: ""                      # [필수] 영문 클래스명 PascalCase (예: Invoice, Employee)
    korean: ""                    # [필수] 한글 (예: 인보이스, 직원)
    definition: ""                # [필수] 이 도메인에서의 정확한 의미 (10자 이상)
    aggregate_root: false         # 이 엔티티가 집계 루트(Aggregate Root)인가?
    # aggregate_root: true → 이 엔티티를 통해서만 내부 상태를 변경한다 (Evans Ch.6)

  # ── 컨텍스트 맵 관계 유형 (DDD — 경계 컨텍스트 간 관계) ─────────────────────
  # 이 도메인이 다른 도메인과 어떤 관계인지 메모로 남긴다:
  # - Shared Kernel  : 공유 모델 (양팀 협업 필수) — 최소화 권장
  # - Customer/Supplier: 하류 도메인이 상류 요구사항을 협상할 수 있음
  # - Conformist     : 상류 모델을 그대로 수용 (협상력 없음)
  # - ACL            : Anti-Corruption Layer — 번역 레이어로 격리
  # - Open Host      : 공개 API 프로토콜을 다수 소비자에게 제공
  # - Published Language: 표준 프로토콜(OpenAPI/AsyncAPI)로 통신

  # 예시:
  # - term: "Invoice"
  #   korean: "인보이스"
  #   definition: "청구 문서. 라인 항목 합산이 총액과 반드시 일치해야 한다.
  #                주문(Order) 도메인의 '주문서'와 다르다 — 이미 확정된 금액이다."
  #   aggregate_root: true
  #
  # - term: "LineItem"
  #   korean: "라인 항목"
  #   definition: "인보이스의 개별 청구 행. 수량 × 단가 = 소계. 독립 생존 불가."
  #   aggregate_root: false


# ── 3. 경계 컨텍스트 상세 ──────────────────────────────────────────────────────
# 도메인이 여러 하위 컨텍스트(서브도메인)로 구성되는 경우 명시한다.
# C4 Model 기준: Container 레벨 분해 (Brown, c4model.com)
bounded_contexts:
  - id: ""                        # 예: billing.invoice / billing.payment
    description: ""               # 이 컨텍스트의 책임 범위
    ui_path: ""                   # 예: /billing/invoices
    # relationship_type: "ACL"   # Shared Kernel / Customer-Supplier / Conformist / ACL / Open Host


# ── 4. 불변조건 [필수 — 가장 중요!] ──────────────────────────────────────────
# ════════════════════════════════════════════════════════════════════════
# 불변조건(Invariant)은 어떤 상황에서도 위반할 수 없는 비즈니스 진실이다.
# 이것이 시스템의 신뢰성 근거이며, 모든 테스트의 중심이다.
# ════════════════════════════════════════════════════════════════════════
#
# 유형별 작성 가이드:
#   [비즈니스]  "~해야 한다" / "~할 수 없다" — 도메인 규칙
#   [보안]      "~권한 없이 ~에 접근할 수 없다" — 접근제어
#   [동시성]    "동일 ~는 동시에 1회만 ~될 수 있다" — 경쟁 조건
#   [시간]      "~일 이후에는 ~할 수 없다" — 시간 기반 제약
#   [참조]      "~이 존재해야만 ~할 수 있다" — 참조 무결성
#
# 심각도 기준 (Stage E 갭 처리 매트릭스와 동일):
#   P0 — 위반 시 데이터 손상·금전 손실 → 즉시 수정 필수
#   P1 — 위반 시 계약·보안 오류 → 수정 + ADR
#   P2 — 비즈니스 규칙 미준수 → 문서화 + 수정
#   P3 — 구조적 개선 → ADR 결정 후 처리
#
# 적용 레이어:
#   domain-entity : 집계 루트 내부 — 가장 강력한 보호선
#   use-case      : 유스케이스 — 권한·사전조건 검사
#   repository    : 저장소 레이어 — 영속성 제약
#   ui            : 화면 레이어 — UX 수준 검증 (보안 방어선 아님)
invariants:
  - id: ""                        # [필수] 유니크 ID — 도메인 접두사 권장
                                  # 형식: INV-[도메인약어][숫자] (예: INV-B001, INV-HR001)
    description: ""               # [필수] 한 문장 — "~해야 한다" / "~할 수 없다" 형식
    severity: P1                  # P0 / P1 / P2 / P3
    enforcement: "domain-entity"  # domain-entity / use-case / repository / ui
    test_required: true           # Stage D 단위 테스트 필수 여부 (P0/P1은 항상 true)
    audit_required: false         # 위반 시도 시 감사 로그 기록 (HIGH/CRITICAL 권장)

  # ══════════════════════════════════════════════════════════════════════
  # 도메인별 불변조건 예시 라이브러리
  # ══════════════════════════════════════════════════════════════════════
  #
  # ── [금융/결제] ──────────────────────────────────────────────────────
  # - id: "INV-FIN001"
  #   description: "결제 금액은 반드시 0보다 커야 한다"
  #   severity: P0
  #   enforcement: "domain-entity"
  #   test_required: true
  #   audit_required: false
  #
  # - id: "INV-FIN002"
  #   description: "동일 idempotency_key의 결제 요청은 1회만 처리된다"
  #   severity: P0
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: true
  #
  # - id: "INV-FIN003"
  #   description: "인보이스 라인 항목 합산은 총액과 정확히 일치해야 한다"
  #   severity: P0
  #   enforcement: "domain-entity"
  #   test_required: true
  #   audit_required: false
  #
  # - id: "INV-FIN004"
  #   description: "PAID 또는 CANCELLED 상태의 인보이스는 수정할 수 없다"
  #   severity: P0
  #   enforcement: "domain-entity"
  #   test_required: true
  #   audit_required: true
  #
  # - id: "INV-FIN005"
  #   description: "단일 거래 한도(amount_limit_per_tx)를 초과하는 결제는 처리할 수 없다"
  #   severity: P1
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: true
  #
  # ── [HR/인사] ────────────────────────────────────────────────────────
  # - id: "INV-HR001"
  #   description: "재직 중인 직원만 성과 평가 대상이 된다"
  #   severity: P0
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: false
  #
  # - id: "INV-HR002"
  #   description: "급여 정보는 hr.admin 권한 보유자만 조회할 수 있다"
  #   severity: P1
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: true
  #
  # - id: "INV-HR003"
  #   description: "퇴직 처리된 직원은 재직 상태로 복원할 수 없다"
  #   severity: P0
  #   enforcement: "domain-entity"
  #   test_required: true
  #   audit_required: true
  #
  # ── [재고/물류] ──────────────────────────────────────────────────────
  # - id: "INV-INV001"
  #   description: "재고 수량은 음수가 될 수 없다"
  #   severity: P0
  #   enforcement: "domain-entity"
  #   test_required: true
  #   audit_required: false
  #
  # - id: "INV-INV002"
  #   description: "출고 수량은 현재 가용 재고를 초과할 수 없다"
  #   severity: P0
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: true
  #
  # ── [동시성 제어] ────────────────────────────────────────────────────
  # - id: "INV-CON001"
  #   description: "동일 집계 루트에 대한 동시 수정은 낙관적 잠금(version 필드)으로 거부된다"
  #   severity: P1
  #   enforcement: "repository"
  #   test_required: true
  #   audit_required: false
  #
  # ── [시간 기반] ──────────────────────────────────────────────────────
  # - id: "INV-TIME001"
  #   description: "결제 기한(due_date) 이후에는 DRAFT 상태 변경을 할 수 없다"
  #   severity: P1
  #   enforcement: "use-case"
  #   test_required: true
  #   audit_required: false


# ── 5. 상태 전이 ────────────────────────────────────────────────────────────
# 핵심 집계 루트의 생명주기(Lifecycle)를 정의한다.
# 원칙: terminal_states는 Object.freeze — 코드로 탈출 불가능
# 원칙: 모든 전이는 명시적 — 미정의 전이는 자동 거부
# Event Storming: 상태 전이 = 커맨드(Command) → 이벤트(Event) 쌍
state_machines:
  - entity: ""                    # 집계 루트명 (예: Invoice, Order, Employee)
    states: []                    # 모든 상태 (예: [DRAFT, PENDING, PAID, CANCELLED])
    initial_state: ""             # 생성 시 초기 상태 (예: DRAFT)
    terminal_states: []           # 되돌릴 수 없는 최종 상태 (예: [PAID, CANCELLED])
    transitions:
      - from: ""                  # 출발 상태
        to: []                    # 도달 가능 상태 목록
        requires_permission: ""   # 이 전이에 필요한 권한 (없으면 생략)
        requires_approval: false  # 관리자 2인 승인 필요 (4-eyes principle)
        audit: false              # 이 전이를 감사 로그에 기록

  # ── 예시: 인보이스 생명주기 ──
  # - entity: "Invoice"
  #   states: [DRAFT, PENDING, APPROVED, PAID, CANCELLED, DISPUTED]
  #   initial_state: DRAFT
  #   terminal_states: [PAID, CANCELLED]
  #   transitions:
  #     - from: DRAFT        # 작성 완료 → 승인 요청
  #       to: [PENDING]
  #       requires_permission: "billing.write"
  #
  #     - from: PENDING      # 승인 → APPROVED (관리자 단독)
  #       to: [APPROVED, CANCELLED]
  #       requires_permission: "billing.admin"
  #       audit: true
  #
  #     - from: APPROVED     # 결제 확인 → PAID
  #       to: [PAID, CANCELLED]
  #       requires_permission: "billing.write"
  #       audit: true
  #
  #     - from: APPROVED     # 고액 결제: 4-eyes 원칙
  #       to: [PAID]
  #       requires_permission: "billing.admin"
  #       requires_approval: true   # CRITICAL 도메인 자동 적용
  #       audit: true
  #
  #     - from: DISPUTED     # 분쟁 해결 (관리자만)
  #       to: [PAID, CANCELLED]
  #       requires_permission: "billing.admin"
  #       requires_approval: true
  #       audit: true

  # ── 예시: 주문 생명주기 ──
  # - entity: "Order"
  #   states: [PENDING, CONFIRMED, SHIPPED, DELIVERED, RETURNED, CANCELLED]
  #   initial_state: PENDING
  #   terminal_states: [DELIVERED, CANCELLED]
  #   transitions:
  #     - from: PENDING
  #       to: [CONFIRMED, CANCELLED]
  #     - from: CONFIRMED
  #       to: [SHIPPED, CANCELLED]
  #       requires_permission: "fulfillment.write"
  #     - from: SHIPPED
  #       to: [DELIVERED, RETURNED]
  #     - from: DELIVERED
  #       to: [RETURNED]
  #       requires_permission: "fulfillment.admin"
  #       audit: true


# ── 6. 권한 모델 [필수] ───────────────────────────────────────────────────────
# 최소 권한 원칙 (NIST SP 800-53 Rev.5 AC-6, OWASP ASVS 4.0.1 V4)
# 설계 기준:
#   - read / write / admin 3단계가 표준 (단순하게 시작한다)
#   - 금전·PII·감사 접근은 별도 권한으로 분리한다
#   - 관리자 권한은 항상 audit_all_actions: true
#   - 권한 ID는 반드시 도메인 접두사를 포함한다 (예: billing.admin)
#
# 모델 선택 가이드:
#   RBAC  : 역할 기반 — 대부분의 비즈니스 도메인 (기본값)
#   ABAC  : 속성 기반 — 조건부 접근 (예: 본인 데이터만, 부서 내부만)
#   ReBAC : 관계 기반 — 소셜/협업 (예: Google Docs "편집자만")
permissions:
  roles:
    - id: ""                      # [필수] 도메인 접두사 포함 (예: billing.read)
      description: ""             # 이 권한으로 할 수 있는 것 (한 문장)
      actions: []                 # 허용 행동 목록 (동사-명사 형식 권장)
      audit_all_actions: false    # true: 이 역할의 모든 행동을 감사 로그에 기록

