# ── 7. 화면 / UI 요구사항 [필수] ──────────────────────────────────────────────
# MoSCoW 우선순위 기법 (Clegg/Barker 1994):
#   must     : 반드시 구현 — 없으면 제품 출시 불가
#   should   : 구현 권장 — 없어도 출시 가능하나 품질 저하
#   must_not : 절대 금지 — 보안·법률·비즈니스 규칙 위반
#
# 접근성 기준: WCAG 2.1 Level AA (EU Web Accessibility Directive)
# 성능 기준: Core Web Vitals (LCP < 2.5s, FID < 100ms, CLS < 0.1)
screens:
  - id: ""                        # [필수] 화면 ID kebab-case (예: invoice-list)
    path: ""                      # [필수] URL 절대 경로 (예: /billing/invoices)
    title: ""                     # [필수] 화면 제목 한글
    required_permission: ""       # [필수] 이 화면 진입에 필요한 권한 ID
    must: []                      # 반드시 구현 항목 (MoSCoW: Must)
    should: []                    # 구현 권장 항목 (MoSCoW: Should)
    must_not: []                  # 절대 금지 항목 (보안·비즈니스 규칙)
    conditional_fields: []        # 권한·상태에 따라 조건부 노출되는 필드

