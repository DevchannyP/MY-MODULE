# ── 10. 위험 분류 ─────────────────────────────────────────────────────────────
# risk_level에 따라 Claude가 자동으로 보안·감사·암호화를 강화한다. (CLAUDE.md)
risk:
  # ── 데이터 분류 (정보보호 정책 · ISO 27001:2022 A.5.12) ──────────────────────
  # public       : 누구나 접근 가능 (공지사항, 가격표)
  # internal     : 임직원 접근 (내부 문서, 운영 데이터)
  # confidential : 제한된 부서만 접근 (급여, 재무제표)
  # restricted   : 최고 기밀 (법적 증거, 암호화 키, 개인신용)
  classification: "internal"      # public / internal / confidential / restricted

  # ── 관련 규정 (법률·규제 준수) ───────────────────────────────────────────────
  # 대한민국: 개인정보보호법 · 전자금융거래법 · 근로기준법 · 의료법 · 자본시장법
  # 국제: GDPR(EU) · CCPA(미국 캘리포니아) · PDPA(태국/싱가포르) · LGPD(브라질)
  # 금융: PCI-DSS v4.0 · Basel III/IV · SOX · IFRS 9
  # 보안: ISO 27001 · SOC 2 Type II · FedRAMP
  regulatory_scope: []
  # 예시: ["개인정보보호법", "전자금융거래법", "PCI-DSS v4.0", "GDPR"]

  # ── 개인정보 처리 (개인정보보호법 §4 · GDPR Art.5) ──────────────────────────
  data_sensitivity:
    pii_fields: []                # 개인식별정보 필드 목록 (로그 마스킹 자동 적용)
    # 예: ["user_id", "name", "email", "phone", "ssn", "account_number"]
    encryption_required: false    # 저장 시 암호화 필수 (AES-256-GCM 권장)
    retention_years: 3            # 데이터 보존 기간 (법정 기간 확인 필요)
                                  # 전자금융거래법: 5년 / 근로기준법: 3년 / GDPR: 최소화 원칙
    masking_in_logs: false        # 로그에서 PII 마스킹 (pii_fields 존재 시 true 권장)

    # ── GDPR 법적 근거 (Art.6 처리 근거, pii_fields 존재 시 필수) ─────────────
    # lawful_basis: "contract"    # consent / contract / legal_obligation /
    #                             # vital_interests / public_task / legitimate_interest
    # data_subject_rights:        # GDPR Art.15~22 — 정보주체 권리 지원 목록
    #   - "access"                # 열람권 (Art.15)
    #   - "rectification"         # 정정권 (Art.16)
    #   - "erasure"               # 삭제권 (Art.17) — "잊혀질 권리"
    #   - "portability"           # 이동권 (Art.20)

  # ── 감사 추적 (Basel III · SOX · 개인정보보호법 §29 · GDPR Art.5.2) ─────────
  # HIGH/CRITICAL 도메인: enabled: true, immutable: true 필수
  audit_trail:
    enabled: false                # HIGH/CRITICAL은 true 필수 (스키마 강제)
    immutable: false              # 감사 로그 수정·삭제 불가 (Append-Only 스토리지)
    fields:                       # 기본 감사 필드 (아래 전체 세트 권장)
      - "actor_id"                # 행위자 ID
      - "action"                  # 수행한 행동
      - "timestamp"               # 발생 시각 (UTC, ISO 8601)
    # 완전한 감사 로그 (HIGH 이상 권장):
    # fields:
    #   - "actor_id"              # 행위자 ID
    #   - "actor_role"            # 행위자 역할
    #   - "action"                # 수행 행동
    #   - "resource_type"         # 대상 리소스 타입
    #   - "resource_id"           # 대상 리소스 ID
    #   - "before_state"          # 변경 전 상태
    #   - "after_state"           # 변경 후 상태
    #   - "timestamp"             # 발생 시각 (UTC)
    #   - "ip_address"            # 접속 IP
    #   - "user_agent"            # 클라이언트 정보
    #   - "correlation_id"        # 요청 추적 ID
    #   - "session_id"            # 세션 ID

  # ── 금융 리스크 (Basel III/IV · PCI-DSS v4.0 · 전자금융거래법) ──────────────
  # 금전을 직접 처리하는 도메인만 작성한다
  financial_risk:
    double_entry: false           # 복식부기 패턴 적용 (차변 = 대변 항등식)
    amount_limit_per_tx: null     # 단일 거래 한도 (null = 무제한, CRITICAL 시 필수)
    reconciliation_required: false # 일별/월별 정산 대조 필요
    four_eyes_principle: false    # 고액 거래 시 2인 승인 필요 (CRITICAL 자동 활성화)
    idempotency_required: false   # 결제 멱등성 (CRITICAL 자동 활성화)
    # currency_precision: 2       # 통화 소수점 자리수 (KRW: 0, USD: 2, BTC: 8)
    # supported_currencies: ["KRW", "USD"]


# ── 11. SLO (서비스 수준 목표) ────────────────────────────────────────────────
# Google SRE Book (2016) Ch.4 + SRE Workbook (2018) Ch.2
# 원칙: SLO는 "사용자가 느끼는 신뢰성"을 숫자로 표현한다.
# 원칙: Error Budget = 100% - SLO target → 혁신과 안정성의 균형점
#
# SLI (Service Level Indicator) → SLO (Service Level Objective) 계층:
#   SLI: 측정 가능한 지표 (p99 응답시간, 오류율 등)
#   SLO: SLI의 목표값 (p99 < 300ms, 오류율 < 0.1%)
#   SLA: 위반 시 페널티가 있는 계약 (외부 고객 대상)
slo:
  availability:
    target_percent: 99.9          # 99.9% = 월 43분 / 99.99% = 월 4분 다운타임 허용
    measurement_window: "30d"     # 측정 기간 (Google: 28일 또는 4주 권장)
    # error_budget_policy:
    #   freeze_depleted: true     # Error Budget 소진 시 릴리스 동결
    #   alert_at_percent: 50      # 50% 소진 시 알림

  latency:
    p50_ms: 100                   # 중간값 — 대다수 사용자 경험
    p99_ms: 300                   # 99번째 백분위 — 롱테일 사용자 경험
    p999_ms: 1000                 # 최악의 경우 (Elite: p999 < 1s)
    # 참고: Google의 사용자 이탈 기준 — 200ms 초과 시 이탈 증가 (AWS re:Invent 2021)

  error_rate:
    target_percent: 0.1           # 요청의 0.1% 이하만 오류 (5xx 기준)

  throughput:
    peak_rps: 100                 # 피크 초당 요청 수 (부하 테스트 근거로 사용)

  # DORA 지표 (개발팀 생산성 측정 — DORA "Accelerate" 2018 / State of DevOps 2023)
  # Elite 수준 기준 (2023 DORA Report):
  #   deployment_frequency: "hourly" (Elite) — 일 1회 이상
  #   lead_time_for_changes: "hours" (Elite) — 1시간 미만
  #   change_failure_rate_percent: 5 (Elite) — 5% 이하
  #   mttr_hours: 1 (Elite) — 1시간 이내
  dora:
    deployment_frequency: "weekly"   # hourly / daily / weekly / monthly
    lead_time_for_changes: "days"    # hours / days / weeks / months
    change_failure_rate_percent: 5   # Elite < 5%, High 5-10%, Medium 10-15%
    mttr_hours: 1                    # 평균 복구 시간 (Mean Time To Restore)

  # 도메인 특화 비즈니스 SLI/SLO (선택)
  custom: []
  # - name: "payment_success_rate"
  #   description: "결제 성공률 — 결제 시도 대비 최종 성공 비율"
  #   target_percent: 99.5
  #   measurement_window: "24h"
  #
  # - name: "invoice_processing_time"
  #   description: "인보이스 생성부터 PAID 전이까지 평균 소요 시간"
  #   target_hours: 72
  #   measurement_window: "30d"


# ── 12. 보안 요구사항 ──────────────────────────────────────────────────────────
# OWASP ASVS 4.0 · NIST SP 800-53 Rev.5 · NIST SP 800-207 (Zero Trust)
# ISO 27001:2022 · MITRE ATT&CK Enterprise v14 · CWE Top 25 (2023)
security:
  # OWASP ASVS 수준 — risk_level에 따라 자동 조정됨 (CLAUDE.md)
  # Level 1: 기본 (모든 앱) — 자동화 점검 가능, CWE Top 25 방어
  # Level 2: 표준 (금전·개인정보) — 수동 검토 포함, OWASP Top 10 완전 방어
  # Level 3: 고급 (고위험 금융·의료·방산) — 완전한 형식 검증 + 침투 테스트
  asvs_level: 1                   # LOW→1, MEDIUM→1, HIGH→2, CRITICAL→3 (자동 강화)

  authentication:
    required: true                # 모든 엔드포인트 인증 필수 (ASVS V2)
    mfa_required: false           # HIGH: 권장, CRITICAL: 필수 (ASVS V2.6)
    session_timeout_minutes: 30   # 비활동 세션 자동 만료 (ASVS V3.3)
    # token_type: "JWT"           # JWT / session-cookie / opaque-token
    # token_expiry_minutes: 60    # Access Token 만료 시간

  authorization:
    model: "RBAC"                 # RBAC / ABAC / ReBAC
    principle: "least-privilege"  # 최소 권한 원칙 (NIST 800-53 AC-6)
    # resource_level: false       # 리소스 수준 권한 (예: 본인 데이터만) → ABAC 권장

  input_validation:               # OWASP Top 10 A03:2021 Injection 방어
    sanitize_all_inputs: true     # 모든 외부 입력 검증 필수
    max_field_length: 2000        # 필드 최대 길이 (DoS 방어)
    sql_injection_prevention: true  # Parameterized Query 강제
    xss_prevention: true          # 출력 인코딩 + CSP 헤더
    # path_traversal_prevention: true  # ../../../etc/passwd 방어
    # prototype_pollution_prevention: true  # JS 객체 오염 방어

  data_protection:
    encryption_at_rest: false     # CRITICAL: AES-256-GCM 필수
    encryption_in_transit: true   # TLS 1.2+ 필수 (TLS 1.3 권장)
    masking_in_logs: false        # PII 필드 존재 시 true 필수
    # key_rotation_days: 90       # 암호화 키 순환 주기 (PCI-DSS: 연 1회 이상)
    # crypto_algorithm: "AES-256-GCM"  # 승인된 암호화 알고리즘 목록

  rate_limiting:
    enabled: true
    requests_per_minute: 1000     # 도메인 특성에 맞게 조정 (인증 API: 10, 일반: 1000)
    # burst_limit: 200            # 순간 최대 허용량 (Token Bucket 알고리즘)
    # per_user: true              # 사용자별 독립 제한 (IP 공유 환경 대응)

  # Zero Trust 원칙 (NIST SP 800-207 · Google BeyondCorp)
  # "신뢰하지 말고 항상 검증하라 (Never Trust, Always Verify)"
  zero_trust:
    verify_every_request: true    # 세션 기반 신뢰 없음 — 매 요청마다 검증
    assume_breach: true           # 내부 네트워크도 신뢰하지 않음


# ── 13. 품질 요구사항 (ISO/IEC 25010:2023) ────────────────────────────────────
# SQuaRE (Software Quality Requirements and Evaluation) 표준
# 8가지 품질 특성: 기능적 적합성 · 성능 효율성 · 호환성 · 사용성 ·
#                 신뢰성 · 보안성 · 유지보수성 · 이식성
quality:
  # 기능적 적합성 (Functional Correctness)
  functional_correctness:
    invariant_coverage: 100       # 모든 불변조건에 테스트 필수 (%)
    boundary_test_required: true  # 경계값 분석 (BVA) 테스트 필수
    # equivalence_partitioning: true  # 동치 분할 테스트 권장

  # 신뢰성 (Reliability · Fault Tolerance)
  reliability:
    fault_tolerance: true         # 부분 실패 시 서비스 계속
    graceful_degradation: true    # 외부 의존 실패 시 최소 기능 유지

  # 유지보수성 (Maintainability — ISO 25010 §4.2.7)
  maintainability:
    max_file_lines: 300           # 파일당 최대 줄 수 (300을 넘으면 분리 검토)
    max_function_lines: 50        # 함수당 최대 줄 수
    cyclomatic_complexity: 10     # 순환 복잡도 최대값 (McCabe 기준: 10 이하 권장)
    test_coverage_percent: 80     # 라인 커버리지 목표 (P0/P1 불변조건: 100%)

  # 이식성 (Portability · Framework Agnostic)
  portability:
    zero_external_dependencies: true  # 도메인 코어: 외부 라이브러리 의존 없음
    framework_agnostic: true          # Express/NestJS 무관하게 동작


# ── 14. 관찰가능성 요구사항 ────────────────────────────────────────────────────
# Google SRE 4대 황금 신호: Latency · Traffic · Errors · Saturation
# RED 지표 (Tom Wilkie): Rate · Error · Duration
# USE 지표 (Brendan Gregg): Utilization · Saturation · Errors
observability:
  # RED 지표 (Rate, Error, Duration) — 모든 서비스 필수
  metrics:
    rate: true                    # 초당 요청 수 (Traffic)
    error_rate: true              # 오류율 (Errors — 5xx/4xx 구분)
    duration: true                # 응답 시간 (p50/p95/p99/p999)
    business_metrics: []          # 도메인 특화 비즈니스 지표
    # 예: ["invoice_created_per_hour", "payment_success_rate",
    #      "dispute_open_count", "avg_invoice_amount"]

  # 분산 추적 (OpenTelemetry 표준 — W3C TraceContext)
  tracing:
    enabled: true
    correlation_id: true          # 모든 요청에 trace-id 전파 (서비스 간 추적)

  # 구조화 로그 (JSON — 기계 파싱 가능)
  logging:
    format: "json"                # 구조화 JSON (ELK/Grafana Loki 연동 전제)
    level: "info"                 # debug / info / warn / error
    include_correlation_id: true  # 모든 로그에 correlation_id 포함
    mask_pii: false               # PII 필드 존재 시 true 필수

  # 알림 규칙 — SRE Workbook Ch.5 다중 번 레이트 기반 권장
  alerting:
    slo_breach: true              # SLO 위반 시 자동 알림 (Error Budget 소진율 기반)
    error_spike: true             # 에러율 급증 (1분 내 임계값 초과)
    latency_spike: true           # p99 응답시간 급증
    # burn_rate_alerts:           # SRE Workbook 다중 번 레이트 알림 (권장)
    #   - window: "1h"            # 1시간 창 — 빠른 소진 감지
    #     burn_rate: 14.4         # 2% Error Budget을 1시간에 소진
    #     severity: "page"        # 즉시 대응 필요
    #   - window: "6h"            # 6시간 창 — 중속 소진 감지
    #     burn_rate: 6            # 5% Error Budget을 6시간에 소진
    #     severity: "ticket"
    #   - window: "3d"            # 3일 창 — 느린 소진 감지
    #     burn_rate: 1
    #     severity: "review"


# ═══════════════════════════════════════════════════════════════════════════════
# ── 이하: v3.0 신규 섹션 ── (스키마 additionalProperties: true로 허용됨)
# ═══════════════════════════════════════════════════════════════════════════════


# ── 15. 커맨드 카탈로그 (CQRS Command Side) ───────────────────────────────────
# CQRS (Command Query Responsibility Segregation — Greg Young 2010)
# 원칙: 커맨드는 상태를 변경하고 이벤트를 발행한다. 데이터를 반환하지 않는다.
# 원칙: 쿼리는 상태를 변경하지 않는다. 순수한 읽기 작업이다.
# → 이 섹션은 "쓰기 측(Command Side)"의 의도를 명확히 한다.
commands:
  - name: ""                      # 커맨드명 PascalCase (예: CreateInvoice, PayInvoice)
    description: ""               # 이 커맨드의 비즈니스 의도
    required_permission: ""       # 실행에 필요한 권한 ID
    input_fields: []              # 커맨드 입력 필드 목록
    emits_events: []              # 성공 시 발행되는 이벤트 목록
    idempotent: false             # 동일 커맨드 재실행 시 부작용 없음 (멱등성)
    # saga_step: false            # 이 커맨드가 Saga의 일부인가?

  # ── 예시 ──
  # - name: "CreateInvoice"
  #   description: "새 인보이스 초안 생성"
  #   required_permission: "billing.write"
  #   input_fields: ["customer_id", "line_items", "due_date", "currency"]
  #   emits_events: ["InvoiceCreated"]
  #   idempotent: false
  #
  # - name: "PayInvoice"
  #   description: "인보이스 결제 처리 — APPROVED → PAID 전이"
  #   required_permission: "billing.write"
  #   input_fields: ["invoice_id", "payment_method", "idempotency_key"]
  #   emits_events: ["InvoicePaid"]
  #   idempotent: true            # idempotency_key로 중복 처리 방지


# ── 16. 읽기 모델 / 프로젝션 (CQRS Query Side) ────────────────────────────────
# 읽기 모델: 도메인 이벤트를 소비해 쿼리에 최적화된 뷰를 생성한다.
# 원칙: 읽기 모델은 쓰기 모델과 다른 데이터 구조를 가질 수 있다 (역정규화 허용).
# 원칙: 이벤트 소싱 없이도 CQRS 적용 가능 — Phase 1은 단순 조회 API로 시작.
read_models:
  - name: ""                      # 읽기 모델명 (예: InvoiceListView, EmployeeSummary)
    description: ""               # 이 뷰가 최적화하는 쿼리 패턴
    source_events: []             # 이 뷰를 갱신하는 이벤트 목록
    fields: []                    # 뷰에 포함되는 필드 (역정규화 포함)
    required_permission: ""       # 조회에 필요한 권한

  # ── 예시 ──
  # - name: "InvoiceListView"
  #   description: "목록 화면 최적화 — 페이지네이션·필터·정렬을 빠르게"
  #   source_events: ["InvoiceCreated", "InvoicePaid", "InvoiceCancelled"]
  #   fields: ["id", "invoice_number", "customer_name", "total_amount",
  #            "currency", "status", "due_date", "created_at"]
  #   required_permission: "billing.read"
  #
  # - name: "BillingSummaryView"
  #   description: "월별 정산 요약 대시보드 — 집계 조회"
  #   source_events: ["InvoicePaid", "InvoiceCancelled"]
  #   fields: ["period", "total_invoiced", "total_paid", "total_outstanding",
  #            "overdue_count", "dispute_count"]
  #   required_permission: "billing.admin"


# ── 17. 사가 (Saga — 분산 트랜잭션) ──────────────────────────────────────────
# Garcia-Molina & Salem "Sagas" (SIGMOD 1987)
# 원칙: 마이크로서비스 환경에서 2PC 대신 Saga로 분산 일관성을 달성한다.
# 유형:
#   choreography  : 이벤트 기반 — 중앙 오케스트레이터 없음 (느슨한 결합)
#   orchestration : 중앙 오케스트레이터가 단계별 커맨드를 발행 (흐름 명확)
# 원칙: 각 단계는 실패 시 보상 트랜잭션(Compensating Transaction)을 가진다.
sagas:
  - name: ""                      # Saga명 (예: OrderFulfillmentSaga)
    description: ""               # 이 Saga가 조율하는 비즈니스 프로세스
    type: "choreography"          # choreography / orchestration
    steps:
      - step: 1
        domain: ""                # 담당 도메인
        command: ""               # 실행 커맨드
        on_success_event: ""      # 성공 시 발행되는 이벤트
        compensation: ""          # 실패 시 보상 커맨드 (롤백)

  # ── 예시: 주문-재고-결제 사가 ──
  # - name: "OrderPaymentSaga"
  #   description: "주문 확정 → 재고 예약 → 결제 처리 → 배송 시작"
  #   type: "choreography"
  #   steps:
  #     - step: 1
  #       domain: "inventory"
  #       command: "ReserveStock"
  #       on_success_event: "StockReserved"
  #       compensation: "ReleaseStock"
  #
  #     - step: 2
  #       domain: "billing"
  #       command: "ChargePayment"
  #       on_success_event: "PaymentCharged"
  #       compensation: "RefundPayment"
  #
  #     - step: 3
  #       domain: "fulfillment"
  #       command: "CreateShipment"
  #       on_success_event: "ShipmentCreated"
  #       compensation: "CancelShipment"


# ── 18. 복원력 패턴 (Resilience — Fault Tolerance) ────────────────────────────
# Nygard "Release It!" 2nd ed. (2018) — 안정화 패턴
# Newman "Building Microservices" 2nd ed. (2021) — 탄력성 설계
# 원칙: 의존 서비스의 실패를 격리하고, 시스템을 자기 치유 가능하게 설계한다.
resilience:
  # 서킷 브레이커 (Circuit Breaker — Nygard 2007)
  # CLOSED → OPEN → HALF-OPEN 상태 전이로 연쇄 장애 방지
  circuit_breaker:
    enabled: true
    failure_threshold_percent: 50    # 50% 실패율 초과 시 OPEN
    wait_duration_seconds: 30        # OPEN → HALF-OPEN 대기 시간
    # half_open_max_calls: 5         # HALF-OPEN 상태에서 허용할 탐침 요청 수

  # 격벽 (Bulkhead — 선박 격벽 패턴)
  # 하나의 의존성 장애가 전체 스레드 풀을 소진하지 않도록 격리
  bulkhead:
    enabled: false                   # 외부 의존이 많은 경우 true 권장
    # max_concurrent_calls: 20       # 최대 동시 호출 수
    # max_wait_ms: 100               # 대기 최대 시간

  # 타임아웃 (Timeout)
  timeouts:
    external_call_ms: 3000           # 외부 서비스 호출 타임아웃
    db_query_ms: 500                 # DB 쿼리 타임아웃
    total_request_ms: 5000           # 전체 요청 처리 타임아웃

  # 재시도 (Retry — Exponential Backoff + Jitter)
  retry:
    max_attempts: 3
    initial_delay_ms: 100
    backoff_multiplier: 2            # 100ms → 200ms → 400ms
    max_delay_ms: 5000
    jitter: true                     # 천둥 군집(thundering herd) 방지

  # 폴백 (Fallback)
  fallback:
    enabled: false
    # strategy: "cached"             # cached / default / degraded
    # cache_ttl_seconds: 300         # 캐시 TTL


# ── 19. API 진화 전략 ──────────────────────────────────────────────────────────
# 하위 호환성 보장 없이는 계약(Contract)이 신뢰를 잃는다.
# semver 원칙: MAJOR.MINOR.PATCH
#   MAJOR: 호환성 파괴 변경 (필드 제거, 타입 변경, 의미 변경)
#   MINOR: 하위 호환 추가 (새 필드 추가, 새 엔드포인트)
#   PATCH: 버그 수정 (동작 변경 없음)
api_evolution:
  current_version: "1.0.0"           # 현재 API 버전 (semver)
  versioning_strategy: "url-path"    # url-path (/v1/...) / header / query-param

  breaking_change_policy:
    notice_period_days: 90           # 파괴적 변경 사전 고지 기간 (Enterprise: 180일)
    deprecation_header: true         # Deprecation/Sunset HTTP 헤더 제공 (RFC 8594)
    migration_guide_required: true   # 마이그레이션 가이드 필수 작성

  backward_compat_rules:
    - "기존 필드 제거 금지 (MAJOR 없이)"
    - "필드 타입 변경 금지 (MAJOR 없이)"
    - "필수 필드를 선택 필드로 변경 가능 (MINOR)"
    - "새 선택 필드 추가 가능 (MINOR)"
    - "새 enum 값 추가 가능 (MINOR) — 소비자의 unknown 처리 확인 필요"
    - "새 enum 값 제거 금지 (MAJOR 없이)"

  # Consumer-Driven Contract Testing (Pact.io)
  # 소비자가 기대하는 계약을 공급자가 검증한다 — 파괴적 변경 조기 발견
  contract_testing:
    enabled: false                   # 다수 소비자 도메인이 있는 경우 true 권장
    # tool: "pact"                   # pact / spring-cloud-contract


# ── 20. 프라이버시 (Privacy by Design) ────────────────────────────────────────
# GDPR Article 25: 설계 단계부터 데이터 보호 (Privacy by Design & Default)
# Cavoukian "Privacy by Design — 7 Foundational Principles" (2010)
# ISO 29101: Privacy Architecture Framework
# 개인정보보호법 제33조: 개인정보 영향평가 (DPIA)
privacy:
  # 프라이버시 기본값 (GDPR Art.25.2 — Privacy by Default)
  by_default:
    collect_minimum_required: true    # 목적에 필요한 최소 데이터만 수집
    retain_minimum_period: true       # 법정 최소 기간만 보존
    share_minimum_required: true      # 꼭 필요한 제3자에게만 공유

  # DPIA 트리거 (개인정보 영향평가 필요 조건 — GDPR Art.35 · 개인정보보호법 §33)
  # 아래 중 하나라도 해당하면 DPIA 수행 필요 [확인 필요]
  dpia_required: false              # DPIA 수행 필요 여부
  dpia_triggers:                    # 해당하는 항목 체크
    - automated_decision_making: false    # 프로파일링·자동 의사결정 (GDPR Art.22)
    - large_scale_processing: false       # 대규모 개인정보 처리
    - sensitive_data_categories: false    # 민감정보 (건강·종교·정치·생체 등)
    - systematic_monitoring: false        # 공공장소 체계적 모니터링
    - cross_border_transfer: false        # GDPR 역외 이전 (EU EEA → 제3국)

  # 개인정보 수명주기 관리
  data_lifecycle:
    anonymization_strategy: ""      # 보존 기간 만료 후 처리 방법
    # anonymization_strategy 예시:
    #   "pseudonymization" : 가명처리 — 재식별 가능성 있음, 연구·통계 목적
    #   "anonymization"    : 익명처리 — 재식별 불가, GDPR 적용 제외
    #   "deletion"         : 완전 삭제 — 복구 불가

  # 동의 관리 (consent_required: true인 경우만)
  consent:
    required: false                 # 법적 근거가 '동의'인 경우 true
    # granular: true                # 항목별 세분화 동의
    # withdraw_mechanism: true      # 동의 철회 메커니즘 필수


# ── 21. 공급망 보안 ─────────────────────────────────────────────────────────
# NIST SSDF (SP 800-218) · SLSA Framework v1.0 · SPDX 2.3 · CycloneDX 1.5
# Executive Order 14028 (미국 대통령령): 소프트웨어 공급망 보안 강화
supply_chain:
  # SBOM (Software Bill of Materials — SPDX 2.3 또는 CycloneDX 1.5)
  # 이 도메인이 사용하는 모든 오픈소스·상용 컴포넌트 목록
  sbom:
    required: true
    format: "cyclonedx"             # spdx / cyclonedx
    update_trigger: "on-dependency-change"  # on-release / on-dependency-change / weekly

  # SLSA (Supply-chain Levels for Software Artifacts — slsa.dev)
  # Level 1: 빌드 스크립트화 · Level 2: 빌드 서비스 · Level 3: 변조 방지
  slsa_level: 1                     # 1 / 2 / 3 (HIGH: 2, CRITICAL: 3 권장)

  # 의존성 보안 스캔
  dependency_scanning:
    block_known_cves: true          # High/Critical CVE 의존성 사용 금지 (nfr.yaml)
    auto_update_patch: true         # PATCH 버전 자동 업데이트 허용
    license_check: true             # GPL 등 카피레프트 라이선스 사용 금지 확인
    # scan_tool: "osv-scanner"      # osv-scanner / snyk / dependabot / trivy

  # 의존성 버전 고정 (Reproducible Builds)
  dependency_pinning:
    pin_exact_versions: true        # package-lock.json / yarn.lock 필수 커밋
    # integrity_check: true         # npm --require-integrity / subresource integrity


# ── 22. 용량 계획 (Capacity Planning) ────────────────────────────────────────
# Google SRE Book Ch.17 · AWS Well-Architected Framework — Reliability Pillar
# 목적: 예측 불가 트래픽 급증에도 SLO를 유지하기 위한 사전 준비
capacity_planning:
  # 트래픽 프로파일
  traffic_profile:
    avg_rps: 10                     # 평균 초당 요청 수
    peak_rps: 100                   # 피크 초당 요청 수 (SLO.throughput과 일치)
    peak_hours: "09:00-18:00 KST"   # 피크 시간대
    growth_rate_percent_yearly: 50  # 연간 예상 성장률

  # 스케일링 정책
  scaling:
    strategy: "horizontal"          # horizontal / vertical / both
    min_instances: 1
    max_instances: 10
    # scale_out_trigger:            # 스케일 아웃 임계값
    #   cpu_percent: 70
    #   memory_percent: 80
    #   rps_per_instance: 50

  # 부하 테스트 요구사항 (Stage D PASS 조건 포함 권장)
  load_testing:
    required: false                 # HIGH/CRITICAL: true 권장
    # tool: "k6"                    # k6 / gatling / locust / jmeter
    # target_rps: 200               # 2× peak_rps (안전 여유)
    # duration_minutes: 30


# ── 23. 테스트 전략 ────────────────────────────────────────────────────────────
# Meszaros "xUnit Test Patterns" (2007) — 테스트 대역 패턴
# Google Testing Blog — 테스트 피라미드 (Mike Cohn)
# Jia/Harman "An Analysis and Survey of the Development of Mutation Testing" (2011)
# 원칙: 테스트는 문서다 — 코드 변경 없이 요구사항을 검증한다.
testing_strategy:
  # 테스트 피라미드 (Google 권장 비율: 70% 단위 / 20% 통합 / 10% E2E)
  pyramid:
    unit:
      target_percent: 80            # 코드 라인 커버리지 목표
      focus: "invariants + value-objects + state-machines"
      framework: "node:test"        # jest / mocha / node:test (built-in)

    integration:
      enabled: true
      focus: "use-case + repository + controller"
      use_real_db: false            # InMemory(Phase1) / Real DB(Phase2)

    e2e:
      enabled: false                # Stage D 이후 별도 E2E 스위트 구성 권장
      # tool: "playwright"

  # 변이 테스트 (Mutation Testing — 테스트 품질 측정)
  # 코드를 의도적으로 변형(변이)하여 테스트가 감지하는지 확인
  # 변이 생존율이 높으면 테스트가 취약함을 의미
  mutation_testing:
    enabled: false                  # HIGH/CRITICAL P0 불변조건에 권장
    # tool: "stryker"               # stryker (JS) / pitest (Java) / mutmut (Python)
    # min_kill_rate_percent: 80     # 변이 제거율 목표 (80% 이상 권장)

  # 속성 기반 테스트 (Property-Based Testing)
  # 무작위 입력으로 수학적 속성(불변조건)을 검증 — 경계값 자동 탐색
  property_based:
    enabled: false                  # 금융 계산·상태 전이에 강력히 권장
    # tool: "fast-check"            # fast-check (JS) / hypothesis (Python)
    # focus: "Money value-object, amount invariants"

  # 혼돈 공학 (Chaos Engineering — Rosenthal 2020)
  # "Production에서 먼저 실패하지 않으려면 실험실에서 먼저 실패하라"
  chaos_engineering:
    enabled: false                  # CRITICAL + product_tier=core 권장
    # experiments:
    #   - "외부 의존 서비스 응답 지연 (500ms 주입)"
    #   - "의존 서비스 완전 중단"
    #   - "DB 연결 풀 소진"
    #   - "메모리 압박 (메모리 누수 시뮬레이션)"


# ── 24. 팀 토폴로지 ────────────────────────────────────────────────────────────
# Skelton/Pais "Team Topologies" (2019)
# 팀 유형 → 인지 부하·의사소통 경로·소유권을 명확히 한다.
team_topology:
  team_type: "stream-aligned"       # stream-aligned / enabling / complicated-subsystem / platform
  # stream-aligned    : 비즈니스 흐름에 정렬 — 가장 일반적
  # enabling          : 다른 팀 역량 향상 지원 (플랫폼 팀)
  # complicated-subsystem: 특수 전문성 필요 (ML, 암호화, 규제)
  # platform          : 내부 서비스 플랫폼 제공

  interaction_modes:               # 다른 팀과의 상호작용 방식
    - team: ""
      mode: "x-as-a-service"      # collaboration / x-as-a-service / facilitating

  cognitive_load_budget: "medium"  # low / medium / high
  # cognitive_load_budget: 팀이 감당 가능한 복잡도 수준
  # 과도한 인지 부하 → 실수·기술부채 증가 → 팀 분리 검토


# ── 25. ADR 참조 목록 (Architecture Decision Records) ──────────────────────────
# Nygard "Documenting Architecture Decisions" (2011)
# 원칙: 모든 중요한 설계 결정은 ADR로 기록한다 (C004 — CLAUDE.md)
# ADR 형식: 제목 / 상태(Proposed/Accepted/Deprecated/Superseded) /
#           맥락 / 결정 / 결과 / 대안
adr_refs: []
# - id: "ADR-001"
#   title: "InMemory → PostgreSQL 마이그레이션 전략"
#   status: "proposed"            # proposed / accepted / deprecated / superseded
#   path: "docs/adr/ADR-001-db-migration.md"
#   supersedes: null
#
# - id: "ADR-002"
#   title: "결제 도메인 CQRS 적용 결정"
#   status: "accepted"
#   path: "docs/adr/ADR-002-cqrs-billing.md"
#   supersedes: null


# ── 26. 스테이지 설정 ──────────────────────────────────────────────────────────
# Claude가 어느 Stage부터 시작할지 (보통 A)
stage: "A"
# A: 처음 생성 시 (계약·불변조건·도메인 설계)
# B: Stage A 완료 후 조합 검증
# C: Stage B 완료 후 마스터 쉘 편입
# D: 구현 완료 후 품질 게이트
# E: 구현 완료 후 적대적 검증


# ── 27. 계약 경로 ─────────────────────────────────────────────────────────────
# Stage A 완료 후 자동 생성됨 — 미리 작성하지 않아도 됨
contracts:
  # http:       "domains/[id]/contracts/openapi.yaml"      # 자동 생성 (OpenAPI 3.1)
  # events:     "domains/[id]/contracts/events.schema.json" # 자동 생성 (AsyncAPI/JSON Schema)
  # ui:         "domains/[id]/contracts/ui-contract.yaml"   # 자동 생성
  # capability: "domains/[id]/contracts/capability.yaml"    # 자동 생성


# ── 28. 기능 플래그 ───────────────────────────────────────────────────────────
# Stage D PASS 전까지 모두 false (안전한 기본값 — 프로덕션 격리)
# 플래그 유형:
#   release     : 미완성 기능 숨김 (Stage D PASS 후 활성화)
#   experiment  : A/B 테스트 (통계적 유의성 달성 후 결정)
#   operational : 운영 제어 (성능 문제 시 즉시 비활성화)
#   permission  : 특정 사용자 그룹에게만 노출
feature_flags: {}
# 예시 (자동 생성되므로 미리 작성 불필요):
# [id]_enabled: false


# ── 29. 라우팅 ────────────────────────────────────────────────────────────────
routing:
  entry_point: ""                  # 예: /billing / /hr / /inventory
  navigation_group: ""             # 예: finance / people / operations / product
  plugin_slot: "main-content"      # master-shell 슬롯 (기본: main-content)


# ── 30. 롤아웃 전략 (카나리 배포) ─────────────────────────────────────────────
# Netflix/Amazon 카나리 릴리스 패턴
# 원칙: 폭발 반경(Blast Radius) 최소화 — 문제 발생 시 영향 받는 사용자를 최소화
# 원칙: 관측 → 판단 → 진행/롤백 의사결정에 최소 24시간 안정 확인
rollout:
  strategy: "gradual"              # immediate(LOW) / gradual(MEDIUM) / canary(HIGH/CRITICAL)
  phases:
    - name: "internal"
      audience_percent: 5          # 팀 내부 (dogfooding)
      criteria: "기본 기능 동작 확인 + 오류 없음"

    - name: "beta"
      audience_percent: 20         # 얼리어답터·파트너
      criteria: "Stage D PASS + 48시간 내부 안정 + SLO 기준 충족"

    - name: "full"
      audience_percent: 100        # 전체 사용자
      criteria: "SLO 목표 충족 + 오류율 0.1% 이하 + 7일 beta 안정"

  # 롤백 트리거 (자동 롤백 조건)
  rollback_triggers:
    - "오류율 1% 초과 (5분 지속)"
    - "p99 응답시간 SLO 2× 초과 (5분 지속)"
    - "P0 불변조건 위반 발생"


# ── 31. 추가 메모 ──────────────────────────────────────────────────────────────
# 요구사항 작성자가 Claude에게 전달하고 싶은 특이사항
notes: |
  [특이사항이 있으면 여기에 적는다]
  [예: 레거시 시스템과의 호환성, 마이그레이션 계획, 예외 처리 방침]
  [예: 외부 규제 기관 보고 요구사항, 특수 감사 요건]
  [예: 현재 팀의 기술 스택 제약, 성능 병목 지점]


# ═══════════════════════════════════════════════════════════════════════════════
# 작성 완료 체크리스트 (Stage A 진입 전 확인)
# ─────────────────────────────────────────────────────────────────────────────
# [필수]
# [ ] identity.id, name, domain, description, risk_level 작성
# [ ] ubiquitous_language — 핵심 명사 5개 이상 (aggregate_root 지정)
# [ ] invariants — P0 불변조건 1개 이상 (test_required: true)
# [ ] permissions — read / write / admin 3단계 역할 정의
# [ ] screens — 핵심 화면 1개 이상 (path + required_permission + must 항목)
# [ ] risk.classification 설정
#
# [risk_level HIGH/CRITICAL 추가 필수]
# [ ] risk.audit_trail.enabled: true + immutable: true
# [ ] risk.data_sensitivity.pii_fields 작성 (PII가 있는 경우)
# [ ] security.mfa_required: true (CRITICAL)
# [ ] security.data_protection.encryption_at_rest: true (CRITICAL)
#
# [금전 처리 도메인 추가 필수]
# [ ] risk.financial_risk 섹션 작성
# [ ] risk.financial_risk.idempotency_required: true (CRITICAL)
# [ ] risk.financial_risk.four_eyes_principle: true (CRITICAL)
# [ ] risk.financial_risk.amount_limit_per_tx 설정 (CRITICAL)
#
# [권장 (품질 향상)]
# [ ] state_machines — 핵심 집계 루트 생명주기 정의
# [ ] domain_events — 다른 도메인에 영향을 주는 이벤트 정의
# [ ] commands — CQRS 커맨드 카탈로그 작성
# [ ] read_models — 쿼리 최적화 뷰 정의
# [ ] slo — 가용성·지연시간·오류율 목표 설정
# [ ] resilience — 외부 의존이 있는 경우 circuit_breaker: true
# [ ] supply_chain.sbom.required: true 확인
# [ ] api_evolution.current_version 설정
# [ ] privacy.dpia_required — DPIA 필요 여부 판단
# [ ] rollout.rollback_triggers 현실적으로 설정
# ═══════════════════════════════════════════════════════════════════════════════
