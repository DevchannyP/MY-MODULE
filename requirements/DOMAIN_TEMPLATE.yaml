# ── 9. 외부 통합 ────────────────────────────────────────────────────────────
# 원칙(C001): 계약(contract) 파일 참조만 허용 — 코드 직접 import 절대 금지
# 결합도 분류:
#   loose : 계약 파일 참조만 — 권장 (인터페이스 변경 시 독립적 적응 가능)
#   tight : 코드 직접 참조 — 금지 (C001 위반)
#
# 통합 패턴 선택:
#   sync         : 동기 HTTP — 즉시 응답 필요, 가용성 의존성 발생
#   async        : 비동기 메시지 — 높은 처리량, 결과적 일관성
#   event-driven : 이벤트 발행/구독 — 느슨한 결합, 도메인 이벤트 기반
integrations:
  depends_on: []
  # - domain: "identity"
  #   purpose: "JWT 토큰 검증 및 사용자 권한 확인"
  #   contract: "domains/identity/contracts/capability.yaml"
  #   coupling: "loose"
  #   integration_pattern: "sync"
  #
  # - domain: "notification"
  #   purpose: "인보이스 발행·결제 완료 알림 발송"
  #   contract: "domains/notification/contracts/events.schema.json"
  #   coupling: "loose"
  #   integration_pattern: "event-driven"

  provides_to: []
