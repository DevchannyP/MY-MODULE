# ── 8. 도메인 이벤트 ───────────────────────────────────────────────────────────
# Event Storming 기반 (Alberto Brandolini, 2021)
# 이벤트는 과거형이다 — "~됐다(ed)" 형식 필수 (예: InvoicePaid, EmployeeHired)
# 원칙: 이벤트는 불변이다 — 발행 후 수정 불가 (Append-Only)
# 원칙: idempotent: true인 이벤트는 중복 발행해도 부작용 없어야 한다
domain_events:
  - name: ""                      # [필수] PascalCase 과거형 (예: InvoicePaid)
    trigger: ""                   # 언제 이 이벤트가 발행되는가? (유스케이스 성공 후)
    payload: []                   # [필수] 이벤트에 포함될 필드 목록 (최소 1개)
    subscribers: []               # 이 이벤트를 소비하는 다른 도메인 목록
    severity: MEDIUM              # LOW/MEDIUM/HIGH — 실패 시 재시도 우선순위
    idempotent: true              # 중복 처리 시 부작용 없어야 하는가?
    # schema_version: "1.0"       # 이벤트 스키마 버전 (semver) — 하위 호환 변경만 허용

  # ── 예시 ──
  # - name: "InvoicePaid"
  #   trigger: "결제 확인 완료 (TransitionInvoiceStatusUseCase PAID 전이 성공)"
  #   payload: ["invoice_id", "amount", "currency", "paid_at",
  #             "payment_method", "correlation_id"]
  #   subscribers: ["accounting", "notification", "reporting"]
  #   severity: HIGH
  #   idempotent: true
  #
  # - name: "EmployeeTerminated"
  #   trigger: "퇴직 처리 완료 (TerminateEmployeeUseCase 성공)"
  #   payload: ["employee_id", "termination_date", "reason_code",
  #             "final_settlement_amount", "correlation_id"]
  #   subscribers: ["payroll", "access-management", "asset-management", "benefits"]
  #   severity: HIGH
  #   idempotent: true
  #
  # - name: "InventoryDepleted"
  #   trigger: "재고 수량이 안전 재고(safety_stock) 미만으로 하락"
  #   payload: ["sku_id", "current_qty", "safety_stock_qty", "location_id"]
  #   subscribers: ["procurement", "notification"]
  #   severity: MEDIUM
