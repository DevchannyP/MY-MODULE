version: "0.1.0"
last_updated: "2026-04-12"

defaults:
  description: "모든 packet에 공통 적용되는 최소 기준"
  commands:
    - "npm run validate:requirements"

aliases:
  fix: "domain"
  bugfix: "domain"
  regression: "domain"
  feature: "domain"
  refactor: "arch"
  ui: "shell"
  frontend: "shell"
  contract: "arch"
  schema: "arch"
  docs: "meta"
  documentation: "meta"
  ops: "executor"
  ci: "governance"
  release: "governance"
  deployment: "governance"
  runtime: "executor"
  orchestration: "executor"
  terminal: "executor"

profiles:
  planning:
    description: "계획 수립, packet 정합성, context/route 판단이 핵심인 작업"
    focus_tags: ["planning", "queue", "readiness"]
    success_criteria:
      - "현재 packet과 next packet이 충돌 없이 식별된다"
      - "queue, reconcile, planning fit 결과가 서로 모순되지 않는다"
    commands:
      - "npm run project:status"
      - "npm run wp:next"
      - "npm run wp:reconcile"
      - "npm run wp:check-fit"

  policy:
    description: "규칙, 제약, 거버넌스 기준면을 바꾸는 작업"
    focus_tags: ["policy", "governance", "consistency"]
    success_criteria:
      - "정책 문서와 validator 기준면이 일치한다"
      - "보호 규칙이 저장소 truth surface와 충돌하지 않는다"
    commands:
      - "npm run validate:composition"
      - "npm run check:advisory-policy"
      - "npm run check:branch-protection-policy"

  domain:
    description: "도메인 로직, 계약, 저장/조회/상태 전이 회귀가 핵심인 작업"
    focus_tags: ["unit", "regression", "integration", "smoke"]
    success_criteria:
      - "도메인 불변조건과 계약이 유지된다"
      - "저장/조회/상태 전이 경로가 회귀 없이 통과한다"
    commands:
      - "npm run test:contract"
      - "npm test"
      - "npm run test:integration"
      - "npm run test:e2e-smoke"

  shell:
    description: "master UI, plugin composition, frontend/server wiring이 핵심인 작업"
    focus_tags: ["ui", "composition", "smoke"]
    success_criteria:
      - "정적/동적 UI surface가 현재 상태와 일치한다"
      - "구성 경로와 홈/컨트롤 센터 smoke가 유지된다"
    commands:
      - "npm run ui:build"
      - "npm run validate:composition"
      - "npm run lint"
      - "npm run test:e2e-smoke"

  executor:
    description: "실행기, scheduler, promotion/apply 경로처럼 orchestration이 핵심인 작업"
    focus_tags: ["execution", "scheduler", "reconcile"]
    success_criteria:
      - "실행기와 스케줄러가 현재 queue를 모순 없이 해석한다"
      - "reconcile 결과와 실행 산출물이 일치한다"
    commands:
      - "npm run lint"
      - "npm run test:e2e-smoke"
      - "npm run wp:reconcile"

  terminal:
    description: "MPO 실행/검증처럼 명령 번들과 증거를 직접 다루는 작업"
    focus_tags: ["execution", "verification", "truthfulness"]
    success_criteria:
      - "명령 결과와 completion report가 일치한다"
      - "evidence path와 memory reconcile이 실제 파일로 남는다"
    commands:
      - "npm run lint"
      - "npm run project:status"
      - "npm run validate:contracts"

  governance:
    description: "CI, release, branch protection, deployment governance가 핵심인 작업"
    focus_tags: ["ci", "release", "protection", "deployment"]
    success_criteria:
      - "저장소 정책과 자동 검증이 일치한다"
      - "배포/보호 기준이 문서와 validator에서 동시에 유지된다"
    commands:
      - "npm run lint"
      - "npm run validate:composition"
      - "npm run check:branch-protection-policy"
      - "npm run check:deployment-environment-provisioning"

  arch:
    description: "코어 구조, 상태 surface, cross-cutting contract를 바꾸는 작업"
    focus_tags: ["architecture", "contracts", "boundaries"]
    success_criteria:
      - "경계와 상태 surface가 일관된다"
      - "계약 drift 없이 cross-cutting 변경이 통과한다"
    commands:
      - "npm run lint"
      - "npm run type-check"
      - "npm run validate:composition"
      - "npm run validate:contracts"
      - "npm run test:e2e-smoke"

  infra:
    description: "개발 환경, validator, 기반 스크립트, 저장소 기반선을 바꾸는 작업"
    focus_tags: ["tooling", "environment", "baseline"]
    success_criteria:
      - "기반 스크립트와 환경 점검이 다시 실행 가능하다"
      - "저장소 baseline drift가 없다"
    commands:
      - "npm run lint"
      - "npm run type-check"
      - "npm run scan:dependencies"

  meta:
    description: "문서, worklog, 운영 truthfulness, meta automation이 핵심인 작업"
    focus_tags: ["docs", "truthfulness", "status"]
    success_criteria:
      - "문서와 실제 현재 상태가 일치한다"
      - "운영 surface가 canonical state를 가리킨다"
    commands:
      - "npm run project:status"
      - "npm run wp:reconcile"

stage_overrides:
  D:
    add:
      - "npm run lint"
      - "npm run test:contract"
  E:
    add:
      - "npm run test:e2e-smoke"

notes:
  - "profile commands are the minimum recommended validation bundle, not a ban on additional targeted tests"
  - "packet.validation 필드에 더 구체적인 검증이 있으면 그것을 추가로 실행한다"
  - "같은 명령은 중복 없이 1회만 추천한다"
