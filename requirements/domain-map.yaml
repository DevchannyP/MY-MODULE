# Workflow OS - 도메인 맵
# Stage B 진입 전 반드시 확정해야 하는 도메인 구성도.
version: "0.1.0"
last_updated: "2026-03-17"

domains:
  - id: "productivity"
    name: "생산성 관리"
    description: "업무 효율화를 위한 작업·일정·협업 관련 도메인 영역"
    bounded_contexts:
      - id: "task-tracking"
        name: "작업 추적"
        modules: ["task-management"]
        contracts:
          - path: "domains/productivity/task-tracking/contract/capability.yaml"
            type: "capability"
          - path: "domains/productivity/task-tracking/contract/ui-contract.yaml"
            type: "ui"
          - path: "domains/productivity/task-tracking/contract/openapi.yaml"
            type: "http"
          - path: "domains/productivity/task-tracking/contract/events.schema.json"
            type: "events"
        invariants:
          - "INV001: 담당자 없는 작업은 생성할 수 없다"
          - "INV002: DONE 또는 CANCELLED 상태에서 IN_PROGRESS로 역전이 불가"
          - "INV003: 마감일은 생성 시점보다 과거일 수 없다"
        ubiquitous_language:
          - "glossary.yaml의 domain_terms 섹션 참조"

composition_policies:
  - rule: "동일 도메인 내 컨텍스트 간 통신은 이벤트 계약(events.schema.json)을 통해서만 허용"
  - rule: "다른 도메인과의 통신은 capability.yaml 계약을 통해서만 허용"
  - rule: "UI 계층은 ui-contract.yaml 외 모듈 내부를 알 수 없다"

shared_kernel: []
# 공유 커널이 필요한 경우에만 여기에 기재. 공유 커널은 ADR로 정당화해야 한다.

anti_corruption_layers: []
# 외부 시스템 통합 시 ACL을 여기에 기재.
