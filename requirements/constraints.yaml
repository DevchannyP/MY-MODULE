# Workflow OS - 아키텍처 제약 조건
# 이 파일의 제약은 모든 모듈과 Stage에 적용된다.
version: "0.1.0"
last_updated: "2026-03-17"

hard_constraints:
  - id: "C001"
    rule: "모듈 간 직접 코드 참조 금지"
    rationale: "결합도 제거. 계약 참조만 허용한다."
    violation_action: "Stage A 재실행 + ADR 갱신"

  - id: "C002"
    rule: "도메인 코어는 UI/DB/프레임워크/네트워크를 import하지 않는다"
    rationale: "도메인 순수성 유지. 의존성은 안쪽으로만 흐른다."
    violation_action: "Stage A 재실행"

  - id: "C003"
    rule: "각 모듈은 최소 1개 이상의 public contract를 가져야 한다"
    rationale: "계약 없는 모듈은 조합 불가. 고립된 사일로가 된다."
    violation_action: "Stage A 미완료 판정"

  - id: "C004"
    rule: "구조 판단은 ADR 없이 지나가지 않는다"
    rationale: "결정 근거를 추적 가능하게 유지한다."
    violation_action: "ADR 소급 작성 후 계속"

  - id: "C005"
    rule: "품질 게이트 FAIL이면 완료라고 선언하지 않는다"
    rationale: "기술 부채 누적 방지."
    violation_action: "Stage D 재판정"

  - id: "C006"
    rule: "확인 불가 내용은 [확인 필요]로 표시하고 검증 절차를 함께 적는다"
    rationale: "불확실성 가시화."
    violation_action: "문서 수정 후 계속"

soft_constraints:
  - id: "S001"
    rule: "조합기와 마스터 UI는 코드 내부를 읽기 전에 memory와 contract를 먼저 읽는다"
    rationale: "계약 우선 설계 원칙."

  - id: "S002"
    rule: "문서도 코드처럼 버전관리·리뷰·자동화 대상이다"
    rationale: "문서 부채 방지."

  - id: "S003"
    rule: "애매하면 안전한 쪽으로 더 많이 재실행하는 방향으로 설계한다"
    rationale: "과소 실행보다 과잉 실행이 낫다."
