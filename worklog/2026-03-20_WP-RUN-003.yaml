benchmark_sources:
  - source: "GitHub Docs - Workflow syntax"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"
    adopted: "Used workflow_dispatch choice inputs for environment selection and bound jobs.<job_id>.environment.name to the selected input"
  - source: "GitHub Docs - Deployments and environments"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"
    adopted: "Used GitHub environment vars as the primary source for deployed smoke target data because those vars are only available to jobs that reference the selected environment"

decisions:
  - id: "RUN-003-D1"
    decision: "Introduce a repo-local deployment environment registry instead of hardcoding free-form target URLs into the workflow"
    rationale: "The registry gives Git-backed evidence of expected environment names and required vars without pretending the remote environments are fully managed in-repo."
  - id: "RUN-003-D2"
    decision: "Keep base_url_override as a break-glass path"
    rationale: "The repository still cannot guarantee remote GitHub environment provisioning, so an explicit override is needed to avoid blocking smoke execution while the remote setup catches up."

risks:
  - id: "RUN-003-R1"
    risk: "Remote GitHub environments and their vars/protection rules may still be absent or drift outside git."
    mitigation: "Keep KI-RUN-001 open at low severity and treat remote provisioning verification as the next runtime hardening packet."
