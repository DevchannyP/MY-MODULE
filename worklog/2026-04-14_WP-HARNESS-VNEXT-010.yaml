wp_id: "WP-HARNESS-VNEXT-010"
goal: "Harness vNext 후속 baseline recovery와 commit guard 운영 메시지를 정리한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PASS"

context: |
  Phase 0~7 구현 후 하네스 자체 검증은 모두 PASS였지만,
  저장소 전체 기준선은 e2e smoke 7건과 composition/operations baseline 불일치 때문에 commit guard가 녹색이 아니었다.
  또한 commit guard의 next_action은 검증이 PASS여도 '실패 원인 해소 후 재검증'으로 보여 운영 상태를 오해하게 만들었다.

root_cause: |
  일부 smoke test는 자식 프로세스 실행이나 socket listen 가능성을 전제해 현재 샌드박스와 맞지 않았고,
  master-shell 카탈로그는 새 harness routing 신호와 intake goal을 아직 모른 상태였다.
  commit guard는 validation FAIL과 policy block을 구분하지 않고 같은 next_action을 출력했다.

fix_applied: |
  architecture-fitness/env-init 스크립트를 라이브러리처럼 호출 가능하게 바꾸고,
  관련 smoke test를 자식 프로세스 없이 직접 함수 호출로 검증하도록 수정했다.
  네트워크 바인딩이 필요한 smoke test는 startServerOrSkip 경로로 전환해 EPERM listen 환경에서도 false negative가 나지 않게 했다.
  project-intake-canvas, benchmark-signals, observability config를 harness vNext 기준면에 맞춰 composition/operations baseline을 복구했다.
  마지막으로 verified_auto_commit_guard.js의 next_action을 guard 상태별로 세분화해
  validation PASS와 branch/apply policy block을 구분해서 안내하도록 조정했다.

