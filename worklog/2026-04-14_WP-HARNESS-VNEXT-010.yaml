decisions:
  - id: "HARNESS-VNEXT-010-D1"
    decision: "샌드박스 제약 때문에 깨지는 smoke는 삭제하지 않고 environment-aware로 바꾼다"
    rationale: "네트워크/자식 프로세스 제약은 환경 문제이지 기능 회귀가 아니므로, 테스트 intent를 유지한 채 false negative만 제거하는 편이 맞다."
  - id: "HARNESS-VNEXT-010-D2"
    decision: "commit guard는 validation 결과와 apply policy block을 다른 next_action으로 안내한다"
    rationale: "운영자가 검증 실패와 브랜치 정책 차단을 혼동하면 후속 조치가 틀어지므로, guard 상태는 더 정밀하게 설명해야 한다."

risks:
  - id: "HARNESS-VNEXT-010-R1"
    risk: "일부 네트워크 기반 smoke는 EPERM 환경에서 skip될 수 있으므로 실제 소켓 경로의 end-to-end 보장은 로컬/CI 권한 환경에서 다시 확인해야 한다."
    mitigation: "listen 허용 환경의 CI lane 또는 개발 환경에서 periodic full-network smoke를 별도 유지한다."
