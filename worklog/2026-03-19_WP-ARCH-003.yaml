    decision: "Satisfied / Scheduled / Uncovered 3-tier 상태로 표현"
    rationale: "Kubernetes Ready/NotReady 2-tier보다 세분화. Scheduled는 '언젠가 될 것'을 명확히 하여 불필요한 WP 중복 생성을 방지."

