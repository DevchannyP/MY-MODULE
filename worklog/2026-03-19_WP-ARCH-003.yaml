decisions:
  - id: "ARCH-003-D1"
    decision: "keyword 매칭 대신 covers_capability 필드 우선 사용"
    rationale: "한국어 goal 문자열에서 영어 capability ID 키워드를 매칭하면 필연적으로 오탐/미탐 발생. 명시 선언이 Pact consumer-driven contract 원칙과도 일치 (계약은 명시적이어야 한다)."
