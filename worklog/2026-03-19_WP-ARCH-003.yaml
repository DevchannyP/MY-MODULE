    risk: "covers_capability 필드 없는 레거시 WP는 Uncovered로 잘못 보고될 수 있다"
    mitigation: "새 WP 정의 시 covers_capability를 필수 항목으로 CLAUDE.md에 추가 권장. 기존 WP는 이번 세션에서 모두 커버됨."

