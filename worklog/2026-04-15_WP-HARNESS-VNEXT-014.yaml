tier: "arch"
result: "PASS"

context: |
  KI-HARNESS-001의 남은 핵심은 계약만 있는 provider adapter를 실제 runtime invoke path에 연결하는 것이었다.
  기존 /api/automation/optimize-prompt는 planning snapshot을 읽은 뒤 local string prompt만 반환했고,
  HarnessRuntimeRouter가 계산한 route snapshot은 실제 provider selection에 사용되지 않았다.

root_cause: |
  control-center optimize-prompt 경로와 harness routing/telemetry/eval plane이 분리돼 있어
  운영자가 보는 route snapshot과 실제 prompt generation path가 어긋나고 있었다.
  또한 live provider 자격증명이 없는 환경에서 안전한 offline fallback 경로가 runtime surface에 연결돼 있지 않았다.

fix_applied: |
  HarnessProviderAdapter, NullHarnessProvider, OpenAIResponsesProvider skeleton을 통해
  /api/automation/optimize-prompt가 HarnessRuntimeRouter snapshot을 실제 provider input으로 사용하도록 바꿨다.
  응답은 기존 prompt 필드를 유지하면서 provider metadata와 harness_runtime snapshot을 확장 필드로 추가한다.
  provider invocation은 telemetry metric/log와 eval artifact에 기록되고,
  live secret이 없을 때는 null provider fallback으로 구조화 종료된다.

