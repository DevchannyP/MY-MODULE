wp_id: "WP-HARNESS-VNEXT-003"
goal: "Harness vNext Phase 1 mode router를 하네스 계약과 operator surface에 도입한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PASS"

context: |
  Phase 0에서 intake/output schema와 golden baseline은 추가됐지만,
  실제 runtime surface에는 아직 mode router 메타가 없었다.
  따라서 bootstrap과 operator cockpit은 packet_type만 보여주고,
  현재 작업이 Research/Build/Debug/Operate/Policy 중 어떤 실행 전략인지 드러나지 않았다.

root_cause: |
  requirements/harness-engineering.yaml에 mode_router 정의가 없고,
  scripts/session_bootstrap.js 및 scripts/operator_cockpit.js가 mode/risk/evidence/output contract를
  계산하거나 노출하지 않았다.

fix_applied: |
  harness contract에 mode_router와 deliverable metadata 필드를 추가하고,
  CONTINUOUS_PROMPT 문서에 mode 분기 규칙을 반영했다.
  또한 session bootstrap과 operator cockpit이 mode, risk_level, evidence_status,
  output_contract를 JSON과 human-readable surface 모두에 노출하도록 확장했다.

