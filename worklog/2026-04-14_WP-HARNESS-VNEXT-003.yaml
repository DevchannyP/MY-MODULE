decisions:
  - id: "HARNESS-VNEXT-003-D1"
    decision: "mode는 packet_type을 대체하지 않고 별도 축으로 유지한다"
    rationale: "packet_type은 저장소 작업 분류이고, mode는 LLM 실행 전략이므로 둘을 합치면 queue/validator/branch 규칙과 하네스 정책이 뒤섞인다."
  - id: "HARNESS-VNEXT-003-D2"
    decision: "mode 추론은 현재 goal과 packet_type 기반의 경량 휴리스틱으로 시작한다"
    rationale: "Phase 1의 목적은 surface 노출과 라우팅 계약 도입이므로, 복잡한 classifier를 먼저 넣기보다 deterministic heuristic이 더 안전하다."

risks:
  - id: "HARNESS-VNEXT-003-R1"
    risk: "일부 목표 문구에서는 휴리스틱 mode 추론이 기대와 다를 수 있다."
    mitigation: "후속 packet에서 current-wp 명시 mode override를 추가하고 eval golden set으로 오분류를 측정한다."
  - id: "HARNESS-VNEXT-003-R2"
    risk: "현재 HARNESS_PLAN 경로는 기존 upgrade plan을 계속 가리킨다."
    mitigation: "후속 packet에서 bootstrap recommended reads에 vNext plan 우선순위를 재조정한다."
