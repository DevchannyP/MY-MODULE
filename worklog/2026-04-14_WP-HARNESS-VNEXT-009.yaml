wp_id: "WP-HARNESS-VNEXT-009"
goal: "Harness vNext Phase 7 release evidence에 prompt_version 기반 rollout/rollback 메타를 추가한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PASS"

context: |
  Phase 6까지는 routing policy와 feature flags는 생겼지만,
  release evidence와 promotion decision은 아직 prompt_version과 rollback target을 직접 담지 않았다.

root_cause: |
  generate_release_evidence.py와 generate_promotion_decision.py는 저장소/큐/품질 상태는 기록하지만
  harness contract의 prompt_version과 rollout/rollback 메타는 읽지 않았다.

fix_applied: |
  harness-engineering에 release_policy를 추가하고 provenance-policy에 prompt_version/rollout_stage를 기록했다.
  또한 generate_release_evidence.py가 harness contract를 읽어 release-evidence.json에
  harness_release(prompt_version, output_schema_ref, rollout_stage, rollback_target, rollback_strategy)를
  남기도록 확장했고, generate_promotion_decision.py도 prompt_version을 승격 판단 출력에 포함하도록 수정했다.
  마지막으로 harnessReleaseEvidence.smoke.test.js를 추가해 release evidence에 롤백 메타가 항상 포함되는지 검증했다.

files_created:
  - "src/tests/smoke/harnessReleaseEvidence.smoke.test.js"
  - "worklog/2026-04-14_WP-HARNESS-VNEXT-009.yaml"

files_modified:
  - "requirements/harness-engineering.yaml"
  - "artifacts/provenance/provenance-policy.yaml"
  - "scripts/generate_release_evidence.py"
  - "scripts/generate_promotion_decision.py"

validation:
  generate_release_evidence: "PASS"
