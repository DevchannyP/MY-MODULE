  harness_release_smoke: "PASS"
  lint: "PASS"

decisions:
  - id: "HARNESS-VNEXT-009-D1"
    decision: "release evidence의 harness rollout stage는 release_policy의 첫 stage를 기본값으로 기록한다"
    rationale: "이 단계의 목표는 자동 승격이 아니라 prompt_version 기반 증적 확보이므로, rollout의 시작점인 dry-run을 명시하는 편이 안전하다."
  - id: "HARNESS-VNEXT-009-D2"
    decision: "promotion decision JSON에도 prompt_version을 직접 노출한다"
    rationale: "릴리즈/롤백 판단이 모델이나 브랜치뿐 아니라 프롬프트 버전 단위로도 추적돼야 회귀 분석과 운영 승격 근거가 일치한다."

risks:
  - id: "HARNESS-VNEXT-009-R1"
    risk: "release evidence는 prompt_version과 rollback 메타를 기록하지만 실제 rollout automation이나 flag 전환을 직접 실행하지는 않는다."
    mitigation: "다음 단계에서 promotion pipeline 또는 operator flow가 harness release metadata를 읽어 rollout stage와 rollback target을 실제 적용 경로에 연결하도록 확장한다."
