wp_id: "WP-HARNESS-VNEXT-004"
goal: "Harness vNext Phase 2 truthfulness contract를 출력 스키마와 validation bundle에 연결한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PARTIAL_PASS"

context: |
  Phase 1에서 mode router는 도입됐지만, output schema와 validation profile은 아직
  허위 PASS 금지 규칙을 강제하지 못했다.
  따라서 verification_status, evidence_status, tests_run/tests_planned, rollback_plan을
  실제 검증 계약으로 승격할 필요가 있다.

root_cause: |
  output.schema.json에는 truthfulness 필드가 optional 수준이었고,
  validation bundle은 하네스 계약 자체를 검증하지 않았다.

fix_applied: |
  output.schema.json에 verification_status, evidence_status, tests_run, tests_planned,
  rollback_plan을 required 필드로 승격했다.
  또한 validate-harness-contract.js를 추가해 intake/output schema, harness contract,
  golden set의 최소 truthfulness 조건을 검증하도록 했다.
  package.json과 validation-profiles.yaml에도 validate:harness-contract를 연결해
  이후 packet 검증 번들에 자동 포함되게 만들었다.

