  - id: "HARNESS-VNEXT-004-D2"
    decision: "validate:harness-contract를 모든 packet의 공통 defaults에 넣는다"
    rationale: "허위 PASS 금지와 evidence 상태 규칙은 특정 packet 유형만의 문제가 아니라 하네스 전체 불변조건이기 때문이다."

