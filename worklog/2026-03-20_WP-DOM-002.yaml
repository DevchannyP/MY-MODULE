decisions:
  - id: "DOM-002-D1"
    decision: "Keep the shared event contract static and file-based"
    rationale: "A repository-local registry and envelope can be validated in CI without requiring a broker, schema registry, or runtime infrastructure."
  - id: "DOM-002-D2"
    decision: "Use explicit billing event definitions instead of implicit oneOf-only variants"
    rationale: "Explicit definitions give the central registry stable schema refs and make drift detection deterministic."

risks:
  - id: "DOM-002-R1"
    risk: "The central registry still documents event contracts only; it does not yet verify broker delivery semantics or consumer idempotency"
    mitigation: "Keep runtime delivery guarantees separate from static contract integrity and schedule them only when broker infrastructure exists."
