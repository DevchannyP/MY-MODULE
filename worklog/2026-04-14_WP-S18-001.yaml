wp_id: "WP-S18-001"
goal: "PostgresTaskRepository 어댑터 스켈레톤 — 포트 계약 구현 + 연결 없는 구조 테스트"
completed: true
completed_at: "2026-04-14"
tier: "domain"
result: "PASS"

context: |
  Spiral 18의 첫 packet은 SQLite에서 PostgreSQL로 옮겨 갈 수 있는 교체 가능 어댑터 경계를 만드는 단계다.
  현재 task-tracking은 InMemory/SQLite 구현체만 존재했고, Postgres 전환 경로는 문서에만 있었다.

root_cause: |
  TaskRepository 포트는 이미 고정돼 있었지만, PostgreSQL 쪽 구현체와 no-DB 구조 테스트가 없어
  이후 DB_TYPE 라우팅이나 psql DDL 작업을 붙일 최소 스켈레톤이 비어 있었다.

fix_applied: |
  PostgresTaskRepository를 추가해 client.query(sql, params) 주입형 어댑터 스켈레톤을 만들었다.
  save/findById/findAll 전체 포트 메서드를 구현했고, optimistic lock 규칙도 SQLite와 동일한 의미로 유지했다.
  실 PostgreSQL 연결 없이 FakePgClient로 SQL 형태와 포트 동작을 검증하는 계약 테스트를 추가했다.

files_created:
  - "domains/productivity/task-tracking/src/infrastructure/PostgresTaskRepository.js"
  - "domains/productivity/task-tracking/tests/infrastructure/PostgresTaskRepository.contract.test.js"
  - "worklog/2026-04-14_WP-S18-001.yaml"

