validation:
  postgres_contract_test: "PASS"
  sqlite_repository_tests: "PASS"
  wp_validate: "PASS"
  lint: "PASS"

decisions:
  - id: "WP-S18-001-D1"
    decision: "pg 라이브러리 연결/Pool 생성은 하지 않고 client.query 주입 계약만 고정한다"
    rationale: "이 packet의 목표는 구조적 교체 가능성 확보이며, 실제 연결과 DI wiring은 WP-S18-002 범위다."
  - id: "WP-S18-001-D2"
    decision: "optimistic lock semantics를 SQLite 구현과 동일하게 유지한다"
    rationale: "어댑터 교체 시 도메인/유스케이스 동작이 달라지면 안 되므로 저장 충돌 의미를 맞춰 둔다."

risks:
  - id: "WP-S18-001-R1"
    risk: "현재 SQL은 구조 테스트용이며 실제 PostgreSQL DDL/인덱스/트랜잭션 경계는 아직 검증되지 않았다."
    mitigation: "WP-S18-002에서 DB_TYPE wiring, WP-S18-003에서 PostgreSQL DDL 및 schema validation을 이어서 수행한다."
