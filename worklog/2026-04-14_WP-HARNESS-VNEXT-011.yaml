wp_id: "WP-HARNESS-VNEXT-011"
goal: "harness routing flag와 release metadata를 실제 runtime/model adapter 소비 경로에 연결한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PASS"

context: |
  Phase 6~9까지는 routing policy, feature flag, release evidence가 저장소 기준면에만 존재했다.
  하지만 실제 런타임 surface에서는 어떤 routing 경로가 선택되는지, 어떤 prompt_version과 rollout_stage가 적용되는지 계산해 보여주는 소비 경로가 없었다.

root_cause: |
  harness routing 정보는 catalog와 artifact에는 있었지만 bootstrap, operator cockpit, health/readyz 같은 실제 운영 surface가 이를 읽지 않았다.
  그래서 운영자는 어떤 mode가 어떤 모델 tier와 release metadata를 쓰는지 런타임에서 확인할 수 없었다.

fix_applied: |
  HarnessRuntimeRouter를 추가해 mode, feature flag, release evidence를 조합한 runtime route snapshot을 계산하도록 했다.
  이 resolver는 prompt_version, rollout_stage, rollback_target, selected_model_tier, reasoning_effort,
  prompt_caching_enabled, batch_eval_enabled를 함께 반환한다.
  또한 session_bootstrap과 operator_cockpit이 이 runtime route를 직접 노출하도록 연결했고,
  서버의 /readyz와 /health 응답에도 harness_runtime 필드를 추가해 운영 surface에서 같은 snapshot을 볼 수 있게 했다.

