decisions:
  - id: "HARNESS-VNEXT-011-D1"
    decision: "실제 원격 모델 호출 어댑터가 없더라도 route selection snapshot부터 런타임 소비 경로로 연결한다"
    rationale: "이 저장소의 현재 단계에서는 model tier 자체보다 운영자가 어떤 routing 결정을 보고 검증할 수 있는지가 더 중요하다."
  - id: "HARNESS-VNEXT-011-D2"
    decision: "FeatureFlagProvider 자체를 확장하지 않고 별도 HarnessRuntimeRouter를 둔다"
    rationale: "플래그 로더는 플래그 truth surface만 책임지고, mode/release evidence 조합 로직은 별도 resolver에 두는 편이 결합도가 낮다."

risks:
  - id: "HARNESS-VNEXT-011-R1"
    risk: "현재 runtime route는 선택 snapshot을 노출할 뿐 실제 외부 LLM provider 호출을 직접 수행하지는 않는다."
    mitigation: "향후 model adapter가 추가되면 same resolver를 호출하도록 연결해 선택 정책과 호출 경로가 분리되지 않게 유지한다."
