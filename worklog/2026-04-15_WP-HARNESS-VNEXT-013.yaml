tier: "arch"
result: "PASS"

context: |
  HarnessRuntimeRouter는 이미 route snapshot을 계산하지만, 실제 외부 provider adapter가 없어
  KI-HARNESS-001이 남아 있었다. 다음 단계 구현 전에 provider selection, fallback, budget,
  observability, eval logging 규칙을 저장소 계약으로 먼저 고정할 필요가 있었다.

root_cause: |
  live provider wiring 경계가 문서/계약 없이 비어 있어 어떤 입력을 provider adapter가 받아야 하는지,
  어떤 오류 모델과 rollback 경로를 따라야 하는지, 어떤 telemetry/eval 필드를 남겨야 하는지가
  실행 surface마다 암묵적으로 흩어질 위험이 있었다.

fix_applied: |
  contracts/harness/provider-adapter.yaml에 provider adapter 계약을 추가해 routing/fallback/budget/failure/
  observability/eval logging 기준을 선언했다. 또한 Stage A/B memory와 ADR을 추가해
  KI-HARNESS-001 해소의 설계 baseline을 root memory에 고정했고,
  validate-harness-contract와 새 smoke test가 이 계약 파일의 존재와 핵심 섹션을 검증하도록 연결했다.

