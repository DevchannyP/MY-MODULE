    rationale: "output schema 위반을 성공처럼 처리하면 operator가 provider 품질 회귀를 탐지할 수 없기 때문이다."
  - id: "HARNESS-VNEXT-015-D2"
    decision: "auth/no-secret failure는 null fallback으로 허용하되 artifact와 failure surface에 secret은 절대 남기지 않는다"
    rationale: "local/sandbox continuity를 유지하면서도 credential leakage risk를 줄여야 하기 때문이다."

