decisions:
  - id: "HARNESS-VNEXT-012-D1"
    decision: "operator가 명시한 next-actions.next_wp를 project status의 1차 truth surface로 채택한다"
    rationale: "실행 순서는 DAG 추천보다 operator selection이 우선이며, queue 기반 계산은 explicit choice가 없을 때만 fallback이어야 한다."
  - id: "HARNESS-VNEXT-012-D2"
    decision: "기존 canonical queue fallback은 유지한다"
    rationale: "next-actions가 비어 있거나 신규 session bootstrap 상태에서는 자동 추천이 계속 필요하다."

risks:
  - id: "HARNESS-VNEXT-012-R1"
    risk: "next-actions.next_wp가 stale 값이면 canonical queue보다 뒤처진 선택이 유지될 수 있다."
    mitigation: "wp:next/wp:reconcile 운영 흐름을 유지하고, next-actions 갱신이 없는 경우에만 queue fallback이 작동하도록 설계했다."
