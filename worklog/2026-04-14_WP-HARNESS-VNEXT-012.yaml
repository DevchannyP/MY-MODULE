wp_id: "WP-HARNESS-VNEXT-012"
goal: "next_wp truth surface를 next-actions 우선 규칙으로 정렬한다."
completed: true
completed_at: "2026-04-14"
tier: "arch"
result: "PASS"

context: |
  Harness vNext 011까지 완료한 뒤 project:status는 next_wp를 canonical wp-queue의 ready pending packet으로 계산했다.
  하지만 운영자가 실제 다음 실행 대상으로 고른 값은 memory/next-actions.yaml의 next_wp였고,
  session_bootstrap과 operator surface도 결국 project:status를 따라가며 서로 다른 다음 packet을 보여주고 있었다.

root_cause: |
  scripts/project_status.js의 extractNextWp는 canonical queue가 존재하는 한 next-actions.next_wp를 무시하고,
  pending + dependency ready 규칙으로 계산한 첫 packet을 항상 우선했다.
  이 로직은 DAG fallback에는 유용하지만 operator가 명시적으로 고른 다음 packet을 truth surface에서 덮어쓰는 문제가 있었다.

fix_applied: |
  extractNextWp를 수정해 next-actions.next_wp가 존재하면 그 값을 최우선 source of truth로 사용하도록 바꿨다.
  명시적 next_wp가 없을 때만 canonical wp-queue의 ready pending packet으로 fallback하게 유지했다.
  project status smoke도 이 우선순위를 검증하도록 업데이트했고, session bootstrap JSON 출력이 같은 next_wp를 따르는지 다시 확인했다.

