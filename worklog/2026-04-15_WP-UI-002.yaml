decisions:
  - id: "UI-002-D1"
    decision: "system-api-plugin은 contracts/ui-shell/ui-contract.yaml과 contracts/system-api/capability.yaml만 참조하는 contract-driven plugin으로 등록한다"
    rationale: "Stage C에서 구현 세부가 아닌 계약/조합 경계를 고정해야 후속 runtime wiring이 최소 변경으로 이어진다."
  - id: "UI-002-D2"
    decision: "system_api.* 플래그는 모두 기본 false로 유지한다"
    rationale: "System OS 통합은 고위험 UI/운영 surface라서 Stage D/E 검증 전에는 저장소 기본값으로 노출하지 않는 편이 안전하다."

risks:
  - id: "UI-002-R1"
    risk: "등록면만 생겼고 runtime/static shell 구현은 아직 packet으로 남아 있다."
    mitigation: "WP-UI-003에서 runtime surface와 static shell 경로를 Stage D로 실제 연결한다."
