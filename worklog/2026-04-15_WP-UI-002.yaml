wp_id: "WP-UI-002"
goal: "system-api-plugin을 master shell registry/nav/flags/observability에 Stage C로 등록한다."
completed: true
completed_at: "2026-04-15"
tier: "arch"
result: "PASS"

context: |
  System API와 ui-shell 계약, Stage B 조합 메모리, ADR은 이미 있었지만
  master-shell registry/nav/flags/observability/catalog에는 아직 system-api-plugin이 존재하지 않았다.
  이 상태에서는 Phase 1 UI 통합 자산이 계약만 있고 조합 등록면은 비어 있는 상태였다.

root_cause: |
  System OS는 계약과 조합 전략은 갖췄지만 Stage C 등록면이 빠져 있어
  validate:composition 기준으로도 독립 플러그인으로 인식되지 않았고,
  후속 runtime/static 구현 packet이 어떤 소유권 경계를 따라야 하는지도 고정돼 있지 않았다.

fix_applied: |
  master-shell/plugin-registry, navigation, feature-flags, feature-flag metadata,
  observability config, observability slo-policy, catalog에 system-api-plugin registration을 추가했다.
  또한 memory/stageC/system-api-plugin.yaml을 만들어 Stage C registration evidence와 rollout/activation 경계를 고정했다.
  신규 system_api.* 플래그는 모두 기본 false로 선언했다.

files_created:
  - "memory/stageC/system-api-plugin.yaml"
  - "worklog/2026-04-15_WP-UI-002.yaml"

