decisions:
  - id: "WP-S18-002-D1"
    decision: "sqlite를 기본 DB_TYPE으로 채택하되 경로는 :memory: 기본값으로 둔다"
    rationale: "기존 로컬/테스트 흐름을 깨지 않으면서도 runtime adapter selection을 실제 SQLite 경로로 옮길 수 있다."
  - id: "WP-S18-002-D2"
    decision: "postgres는 skeleton adapter까지만 연결하고 실제 client/pool은 placeholder로 둔다"
    rationale: "이번 packet 범위는 분기와 DI wiring이며, live PostgreSQL 연결과 DDL은 후속 packet의 책임이다."

risks:
  - id: "WP-S18-002-R1"
    risk: "DB_TYPE=postgres 상태에서 실제 client를 주입하지 않으면 task API 호출은 runtime 오류가 난다."
    mitigation: "오류 코드를 POSTGRES_CLIENT_NOT_CONFIGURED로 명시했고, WP-S18-003에서 DDL/연결 검증을 이어간다."
