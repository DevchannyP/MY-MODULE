wp_id: "WP-S18-002"
goal: "ENV 기반 어댑터 선택 — DB_TYPE=sqlite|postgres 런타임 분기 (DI wiring)"
completed: true
completed_at: "2026-04-14"
tier: "infra"
result: "PASS"

context: |
  WP-S18-001에서 PostgresTaskRepository skeleton을 추가했지만, 서버 런타임은 여전히 InMemoryTaskRepository를 고정 사용하고 있었다.
  Spiral 18의 다음 단계는 DB_TYPE 환경 변수로 sqlite/postgres 어댑터를 분기할 최소 DI wiring을 넣는 것이다.

root_cause: |
  src/server/createServer.js는 task controller 기본 생성 시 InMemoryTaskRepository를 직접 new 하고 있어
  adapter 교체가 런타임 설정으로 제어되지 않았다. .env.example과 plugin registry note에도 이 전략이 드러나지 않았다.

fix_applied: |
  createServer에 resolveTaskRepository helper를 추가해 DB_TYPE=sqlite|postgres|inmemory 분기를 도입했다.
  기본값은 sqlite 이며 TASK_SQLITE_DB_PATH=:memory: 로 현재 로컬/테스트 동작을 유지한다.
  postgres 선택 시 PostgresTaskRepository skeleton으로 분기하고, 실제 client가 없으면 명시적 POSTGRES_CLIENT_NOT_CONFIGURED 오류를 던지는 placeholder client를 사용한다.
  .env.example과 task-management plugin registry note도 이 adapter 선택 전략에 맞게 갱신했다.

