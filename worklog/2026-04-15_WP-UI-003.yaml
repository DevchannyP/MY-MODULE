decisions:
  - id: "UI-003-D1"
    decision: "System OS HTTP surface는 root gate off 상태에서 404 비노출을 유지한다"
    rationale: "Stage C의 기본 false rollout과 운영 안전 기본값을 구현면에서도 그대로 유지해야 한다."
  - id: "UI-003-D2"
    decision: "SystemApiController의 list/toggle/rollback gating은 runtime flag provider truth를 우선 사용한다"
    rationale: "env override와 runtime evaluation이 raw YAML보다 상위 truth surface이기 때문이다."
  - id: "UI-003-D3"
    decision: "system domain catalog는 /api/v1/system/* 내부 route 목록이 아니라 plugin/UI ownership route를 노출한다"
    rationale: "master-shell catalog는 operator가 plugin surface를 이해하는 조합면이라 runtime controller path보다 shell ownership 경로가 더 중요하다."

risks:
  - id: "UI-003-R1"
    risk: "SSE reconnect, authz regression, rollback UI gating은 아직 Stage E adversarial evidence가 없다."
    mitigation: "WP-UI-004에서 SSE/authz/rollback failure mode를 적대 검증과 rollback 기준으로 닫는다."
