wp_id: "WP-UI-003"
goal: "System OS runtime surface와 static shell 경로를 Stage D로 연결한다."
completed: true
completed_at: "2026-04-15"
tier: "arch"
result: "PASS"

context: |
  WP-UI-002로 system-api-plugin registration은 끝났지만,
  실제 HTTP runtime에는 /api/v1/system/* wiring이 없었고 static shell source도
  system_api.*를 true 쪽으로 해석하는 기본값이 남아 있었다.
  이 상태에서는 등록면과 구현면이 분리돼 Phase 1 UI 통합을 Stage D로 볼 수 없었다.

root_cause: |
  SystemApiController는 존재했지만 createServer가 이를 mount하지 않아 plugin ownership이 실제 runtime에 반영되지 않았다.
  또한 controller 내부 flag list/toggle/rollback는 raw flags.yaml에 의존했고,
  static shell source는 Stage C default-false rollout 정책과 어긋나는 fallback 값을 사용하고 있었다.

fix_applied: |
  createServer에 /api/v1/system/* routing을 추가해 system_api.enabled root gate와
  system_api.sse_stream.enabled sub-feature gate를 실제 HTTP surface에 연결했다.
  SystemApiController는 runtime flag provider를 우선 사용하도록 확장했고,
  catalog 응답은 system-api-plugin의 routes/contracts/adapter profile을 Stage C 기준면과 일치시키도록 정리했다.
  generate-mindmap.js의 system_api.* 기본값도 false로 고정해 static shell source를 safe default에 맞췄다.

