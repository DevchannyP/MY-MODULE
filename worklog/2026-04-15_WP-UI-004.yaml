context: |
  WP-UI-003까지는 System OS runtime wiring이 완료됐지만,
  system.admin 권한 회귀와 SSE disconnect 후 재연결 failure mode를
  Stage E evidence로 고정한 상태는 아니었다.
  따라서 Phase 1 UI 통합을 실제 운영 면에서 닫으려면 실패면을 테스트와 rollback 기준으로 남겨야 했다.

root_cause: |
  등록면과 구현면은 정렬됐지만, 운영자가 가장 먼저 맞닥뜨리는 실패 경로인
  unauthorized admin action / feature-disabled / SSE reconnect behavior가
  별도의 adversarial smoke와 Stage E memory로 기록돼 있지 않았다.

fix_applied: |
  SystemApiController unit regression을 추가해 system.admin 없는 toggle/rollback 호출이 403으로 차단됨을 고정했다.
  HTTP smoke를 추가해 unauthorized admin actions의 structured 403,
  SSE disconnect 후 reconnect 성공, request/correlation header continuity를 검증했다.
  또한 memory/stageE/system-api-plugin.yaml에 rollback trigger와 release readiness 기준을 기록했다.

