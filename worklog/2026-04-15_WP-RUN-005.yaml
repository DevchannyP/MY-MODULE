wp_id: "WP-RUN-005"
goal: "배포 environment 실 URL health/ingress verification 자동화 baseline을 추가한다."
completed: true
completed_at: "2026-04-15"
tier: "governance"
result: "PASS"

context: |
  기존 deployment smoke는 실제 배포 URL을 대상으로 health/task/billing/video 경로를 검증했지만,
  그 target이 registry가 기대한 ingress host/TLS 조건을 만족하는지와
  ingress가 correlation header를 보존하는지는 수동 운영 확인 영역으로 남아 있었다.

root_cause: |
  resolver는 DEPLOYMENT_BASE_URL만 해석했고 runner는 path-level health smoke에 집중해
  "실제로 올바른 public target을 치고 있는가"를 artifact로 판정하지 못했다.
  이 때문에 KI-RUN-001의 검증 자동화 축이 구조적으로 덜 닫혀 있었다.

fix_applied: |
  deployment environment registry와 provisioning policy에 ingress host/TLS 계약 변수를 추가했다.
  resolve_deployment_target.py는 expected ingress host와 require_https를 함께 해석하고,
  deployment-smoke workflow는 이를 runner 인자로 전달한다.
  run_deployment_smoke.js는 target-url/ingress-health 단계를 추가해 hostname/TLS/correlation-header continuity를 artifact로 기록한다.

