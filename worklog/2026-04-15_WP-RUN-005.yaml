    decision: "real target verification은 registry contract와 runner artifact 양쪽에 동시에 기록한다"
    rationale: "GitHub environment var 해석과 실제 smoke 결과가 같은 truth surface를 공유해야 drift를 줄일 수 있기 때문이다."
  - id: "RUN-005-D2"
    decision: "ingress verification은 별도 네트워크 도구가 아니라 health 요청의 host/origin/header continuity 검사로 시작한다"
    rationale: "현재 저장소의 executable smoke 경로를 재사용하면서도 reverse proxy/ingress misroute를 조기에 잡을 수 있기 때문이다."

