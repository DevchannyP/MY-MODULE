decisions:
  - id: "RUN-004-D1"
    decision: "Model remote environment provisioning as operator-collected audit evidence instead of pretending the repository can prove live GitHub state"
    rationale: "The repo can declare the contract and validate drift locally, but without authenticated remote access it cannot truthfully assert that the live environments are provisioned."
  - id: "RUN-004-D2"
    decision: "Generate an audit template from registry + policy rather than hand-maintaining a free-form checklist"
    rationale: "A generated template keeps the evidence contract synchronized with the environment registry and reduces drift between documentation and operations."

risks:
  - id: "RUN-004-R1"
    risk: "Operators may still fail to collect or attach live audit evidence after the template is generated."
    mitigation: "Keep KI-RUN-001 open at low severity and make live audit evidence collection the next runtime packet."
