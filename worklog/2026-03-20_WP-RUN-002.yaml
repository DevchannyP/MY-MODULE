benchmark_sources:
  - source: "GitHub Docs - Contexts reference"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/contexts"
    adopted: "workflow_dispatch inputs are consumed through the inputs context, so the deployment-smoke workflow uses explicit inputs instead of hidden constants"
  - source: "GitHub Docs - Deployments and environments"
    url: "https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"
    adopted: "kept deployment smoke operator-triggered because environment secrets and variables only apply to jobs that explicitly reference an environment, and this repo still lacks a concrete deployment environment registry"

decisions:
  - id: "RUN-002-D1"
    decision: "Make the deployed smoke runner executable but keep disabled-route verification optional per target environment"
    rationale: "Some deployments will have all relevant features enabled, so forcing a flag-off assertion would create false negatives. The runner records SKIPPED truthfully when no disabled route is supplied."
  - id: "RUN-002-D2"
    decision: "Use a standalone workflow_dispatch workflow instead of adding deployment smoke to quality-gates.yml"
    rationale: "The repository has no canonical deployed target in git, so always-on CI would either fail spuriously or require hidden environment coupling."

risks:
  - id: "RUN-002-R1"
    risk: "Deployment smoke is still not bound to an actual deployment event or environment registry."
    mitigation: "Keep KI-RUN-001 open at low severity and treat deployment binding as the next runtime hardening candidate."
  - id: "RUN-002-R2"
    risk: "Log trace_id presence is still an operator check outside the HTTP runner."
    mitigation: "The runner records this as a pending manual check in its JSON artifact and Stage E docs."
