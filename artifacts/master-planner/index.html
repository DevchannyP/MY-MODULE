<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow OS — 마스터 기획서 에디터</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #238636;
    --accent2: #1f6feb;
    --accent3: #bb8009;
    --text: #c9d1d9;
    --text-dim: #8b949e;
    --text-bright: #f0f6fc;
    --red: #da3633;
    --purple: #8957e5;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── 상단 헤더 ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,17,23,.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-bright);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-logo span { color: var(--accent2); }
  .topbar-meta {
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
  }
  .topbar-actions {
    display: flex;
    gap: 8px;
  }

  /* ── 버튼 시스템 ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: #2ea043; }
  .btn-secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--border); color: var(--text-bright); }
  .btn-idea { background: linear-gradient(135deg,#1f6feb22,#8957e522); color: var(--accent2); border-color: var(--accent2)44; }
  .btn-idea:hover:not(:disabled) { background: var(--accent2)22; border-color: var(--accent2); }
  .btn-copy-all {
    background: linear-gradient(135deg, #238636, #1f6feb);
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 20px #23863633;
  }
  .btn-copy-all:hover { transform: translateY(-1px); box-shadow: 0 6px 28px #23863655; }
  .btn-apply { background: transparent; color: var(--accent); border-color: var(--accent)66; font-size: 12px; padding: 4px 10px; }
  .btn-apply:hover { background: var(--accent)11; border-color: var(--accent); }

  /* ── 레이아웃 ── */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 57px);
  }

  /* ── 사이드바 ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    position: sticky;
    top: 57px;
    height: calc(100vh - 57px);
    overflow-y: auto;
    background: var(--surface);
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    transition: all .12s;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent2)18; color: var(--accent2); border-color: var(--accent2)33; }
  .nav-item .badge {
    margin-left: auto;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 99px;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .nav-item.done .badge { background: var(--accent)22; color: var(--accent); }
  .stage-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--text-dim);
    min-width: 28px;
    text-align: center;
  }

  /* ── 메인 콘텐츠 ── */
  .main {
    padding: 32px 40px;
    max-width: 960px;
  }

  /* ── 기획서 섹션 ── */
  .section {
    margin-bottom: 48px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .section:target, .section.active-section {
    border-color: var(--accent2)66;
    box-shadow: 0 0 0 3px var(--accent2)11;
  }

  .section-header {
    background: var(--surface);
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .section-icon {
    font-size: 28px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .section-meta { flex: 1; }
  .section-number {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 6px;
  }
  .section-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .section-stage {
    background: var(--accent2)18;
    color: var(--accent2);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid var(--accent2)33;
    white-space: nowrap;
  }

  .section-body { padding: 24px; }

  /* ── 편집 영역 ── */
  .edit-area {
    width: 100%;
    min-height: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.7;
    padding: 14px 16px;
    resize: vertical;
    transition: border-color .15s;
    outline: none;
  }
  .edit-area:focus { border-color: var(--accent2)88; }
  .edit-area::placeholder { color: var(--text-dim); }

  /* ── 아이디어 트리거 ── */
  .idea-trigger {
    margin-top: 16px;
    padding: 16px;
    background: linear-gradient(135deg, var(--surface) 0%, #1f6feb08 100%);
    border: 1px dashed var(--accent2)44;
    border-radius: var(--radius);
  }
  .idea-trigger-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .idea-trigger-label {
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
  }
  .prompt-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 12px;
    position: relative;
    display: none;
  }
  .prompt-box.visible { display: block; }
  .prompt-copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .prompt-copy-btn:hover { color: var(--text-bright); }

  /* ── 아이디어 카드 그리드 ── */
  .ideas-grid {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 12px;
  }
  .ideas-grid.visible { display: grid; }

  .idea-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    transition: border-color .15s, transform .15s;
    position: relative;
  }
  .idea-card:hover { border-color: var(--accent2)88; transform: translateY(-2px); }
  .idea-card.selected { border-color: var(--accent); background: var(--accent)08; }
  .idea-card-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
  }
  .idea-card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-bright);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .idea-card-body {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .idea-card-source {
    font-size: 11px;
    color: var(--purple);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .idea-card-footer { display: flex; gap: 6px; flex-wrap: wrap; }
  .idea-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 99px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  /* ── 로딩 스피너 ── */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 진행 게이지 ── */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width .4s ease;
  }

  /* ── 푸터 (전체 복사 영역) ── */
  .copy-footer {
    position: sticky;
    bottom: 0;
    background: rgba(13,17,23,.96);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .copy-footer-meta { flex: 1; }
  .copy-footer-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 2px;
  }
  .copy-footer-sub { font-size: 12px; color: var(--text-dim); }
  .copy-status {
    font-size: 12px;
    color: var(--accent);
    opacity: 0;
    transition: opacity .3s;
  }
  .copy-status.show { opacity: 1; }

  /* ── 완료 배지 ── */
  .done-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    background: var(--accent)11;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--accent)33;
    display: none;
  }
  .done-badge.show { display: inline-flex; }

  /* ── 구분선 ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  /* ── 반응형 ── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
    .ideas-grid { grid-template-columns: 1fr; }
    .main { padding: 20px 16px; }
  }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    bottom: 80px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text-bright);
    opacity: 0;
    transform: translateY(8px);
    transition: all .25s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>

<!-- ── 상단 헤더 ── -->
<header class="topbar">
  <div class="topbar-logo">
    <span>⬡</span> Workflow OS
    <span style="color:var(--border)">|</span>
    <span style="font-weight:400;font-size:14px;color:var(--text-dim)">마스터 기획서 에디터</span>
  </div>

  <div class="topbar-actions">
    <button class="btn btn-secondary" onclick="toggleAllIdeas()">💡 전체 아이디어 펼치기</button>
    <button class="btn btn-secondary" onclick="exportMarkdown()">📄 Markdown 내보내기</button>
  </div>
</header>

<div class="layout">

  <!-- ── 좌측 네비게이션 ── -->
  <nav class="sidebar">
    <div class="sidebar-title">기획서 목차</div>
    <div id="nav-list"></div>

    <hr class="divider" style="margin:20px 0">
    <div class="sidebar-title">진행률</div>

    <hr class="divider" style="margin:20px 0">

    <div style="font-size:12px;color:var(--text-dim);line-height:2;">
      <div>Stage A · 요구사항 분석</div>
      <div>Stage B · 계약 설계</div>
      <div>Stage C · 마스터 쉘</div>
      <div>Stage D · 구현</div>
      <div>Stage E · 적대적 검증</div>
    </div>
  </nav>

  <!-- ── 메인 기획서 영역 ── -->
  <main class="main" id="main-content">
    <div id="sections-container"></div>
  </main>

</div>

<!-- ── 하단 전체 복사 푸터 ── -->
<footer class="copy-footer">
  <div class="copy-footer-meta">
    <div class="copy-footer-title">최종 기획서 내보내기</div>
    <div class="copy-footer-sub">모든 섹션의 내용을 하나의 문서로 복사합니다</div>
  </div>
  <span class="copy-status" id="copy-status">✓ 클립보드에 복사되었습니다!</span>
  <button class="btn-copy-all" onclick="copyAll()">
    📋 전체 기획서 한 번에 복사
  </button>
</footer>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

const state = {

// ────────────────────────────────────────────────

function buildNav() {
  const nav = document.getElementById('nav-list');
  SECTIONS.forEach(sec => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.id = `nav-${sec.id}`;
    item.innerHTML = `
      <span class="stage-tag">${sec.stage}</span>
      <span style="flex:1">${sec.title}</span>
      <span class="badge" id="badge-${sec.id}">—</span>
    `;
    item.onclick = () => {
      document.getElementById(`section-${sec.id}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    };
    nav.appendChild(item);
  });
}

// ────────────────────────────────────────────────
// 섹션 카드 생성
// ────────────────────────────────────────────────
function buildSections() {
  const container = document.getElementById('sections-container');

  SECTIONS.forEach(sec => {
    const ideasHtml = sec.ideas.map((idea, i) => `
      <div class="idea-card" id="card-${sec.id}-${i}">
        <div class="idea-card-num">${idea.num}</div>
        <div class="idea-card-title">${idea.title}</div>
        <div class="idea-card-body">${idea.body}</div>
        <div class="idea-card-source">${idea.source}</div>
        <div class="idea-card-footer">
          ${idea.tags.map(t => `<span class="idea-tag">${t}</span>`).join('')}
          <button class="btn btn-apply" onclick="applyIdea('${sec.id}',${i})" style="margin-left:auto">
            ✓ 이 안 적용
          </button>
        </div>
      </div>
    `).join('');

    const promptText = `이 "${sec.title}" 구간에 대해 Claude Skills, GitHub 라이브러리 (⭐ 높은 순), 국내외(카카오·네이버·토스·Google·Spotify·Netflix 등) 최고의 업무 아이디어와 최신 지식을 벤치마킹하여, 실제 적용 가능한 최적 안을 3가지 제시해주세요. 각 안에는 ① 방법론명 ② 핵심 설명 ③ 적용 출처/레퍼런스 ④ 장단점을 포함하세요.`;

    const div = document.createElement('div');
    div.className = 'section';
    div.id = `section-${sec.id}`;
    div.innerHTML = `
      <div class="section-header">
        <div class="section-icon">${sec.icon}</div>
        <div class="section-meta">
          <div class="section-number">${sec.number}</div>
          <div class="section-title">${sec.title}</div>
          <div class="section-desc">${sec.desc}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <span class="section-stage">${sec.stage}</span>
          <span class="done-badge" id="done-${sec.id}">✓ 작성완료</span>
        </div>
      </div>

      <div class="section-body">
        <textarea
          class="edit-area"
          id="area-${sec.id}"
          placeholder="${sec.placeholder}"
          oninput="onInput('${sec.id}', this.value)"
        ></textarea>

        <div class="idea-trigger">
          <div class="idea-trigger-header">
            <div class="idea-trigger-label">💡 아이디어 벤치마킹 — 국내외 최고 사례 3가지 제안</div>
            <button class="btn btn-idea" onclick="toggleIdeas('${sec.id}')">
              아이디어 제안 보기
            </button>
          </div>

          <div class="prompt-box" id="prompt-${sec.id}">
            <button class="prompt-copy-btn" onclick="copyPrompt('${sec.id}')">복사</button>
            ${promptText}
          </div>

          <div class="ideas-grid" id="ideas-${sec.id}">
            ${ideasHtml}
          </div>
        </div>
      </div>
    `;

    // 프롬프트 텍스트 저장
    div.dataset.prompt = promptText;
    container.appendChild(div);
  });
}

// ────────────────────────────────────────────────
// 이벤트 핸들러
// ────────────────────────────────────────────────
function onInput(id, value) {
  state.contents[id] = value;
  updateProgress();
  if (value.trim().length > 20) {
    document.getElementById(`done-${id}`).classList.add('show');
    document.getElementById(`badge-${id}`).textContent = '✓';
    document.getElementById(`badge-${id}`).style.color = 'var(--accent)';
    document.getElementById(`nav-${id}`).classList.add('done');
    state.doneMap[id] = true;
  } else {
    document.getElementById(`done-${id}`).classList.remove('show');
    document.getElementById(`badge-${id}`).textContent = '—';
    document.getElementById(`badge-${id}`).style.color = '';
    document.getElementById(`nav-${id}`).classList.remove('done');
    state.doneMap[id] = false;
  }
}

function toggleIdeas(id) {
  const grid = document.getElementById(`ideas-${id}`);
  const prompt = document.getElementById(`prompt-${id}`);
  const isVisible = grid.classList.contains('visible');
  if (isVisible) {
    grid.classList.remove('visible');
    prompt.classList.remove('visible');
  } else {
    grid.classList.add('visible');
    prompt.classList.add('visible');
  }
}

function toggleAllIdeas() {
  const allGrids = document.querySelectorAll('.ideas-grid');
  const allPrompts = document.querySelectorAll('.prompt-box');
  const anyVisible = [...allGrids].some(g => g.classList.contains('visible'));
  allGrids.forEach(g => anyVisible ? g.classList.remove('visible') : g.classList.add('visible'));
  allPrompts.forEach(p => anyVisible ? p.classList.remove('visible') : p.classList.add('visible'));
}

function applyIdea(secId, ideaIndex) {
  const sec = SECTIONS.find(s => s.id === secId);
  const idea = sec.ideas[ideaIndex];
  const area = document.getElementById(`area-${secId}`);

  const appended = `\n\n[채택 안 ${idea.num}] ${idea.title}\n${idea.body}\n참조: ${idea.source}`;
  area.value += appended;
  onInput(secId, area.value);

  // 선택 표시
  document.querySelectorAll(`[id^="card-${secId}-"]`).forEach(c => c.classList.remove('selected'));
  document.getElementById(`card-${secId}-${ideaIndex}`).classList.add('selected');

  showToast(`"${idea.title}" 아이디어가 적용되었습니다`);
}

function copyPrompt(id) {
  const sec = SECTIONS.find(s => s.id === id);
  const promptText = `이 "${sec.title}" 구간에 대해 Claude Skills, GitHub 라이브러리 (⭐ 높은 순), 국내외(카카오·네이버·토스·Google·Spotify·Netflix 등) 최고의 업무 아이디어와 최신 지식을 벤치마킹하여, 실제 적용 가능한 최적 안을 3가지 제시해주세요. 각 안에는 ① 방법론명 ② 핵심 설명 ③ 적용 출처/레퍼런스 ④ 장단점을 포함하세요.`;
  navigator.clipboard.writeText(promptText).then(() => showToast('프롬프트가 클립보드에 복사되었습니다'));
}

// ────────────────────────────────────────────────
// 전체 기획서 복사
// ────────────────────────────────────────────────
function copyAll() {
  let doc = `# Workflow OS 마스터 기획서\n생성일: ${new Date().toLocaleDateString('ko-KR')}\n\n`;
  doc += `---\n\n`;

  SECTIONS.forEach(sec => {
    const content = (document.getElementById(`area-${sec.id}`) || {}).value || '';
    doc += `## ${sec.number} — ${sec.title} [${sec.stage}]\n\n`;
    doc += content.trim() ? content.trim() : '(미작성)';
    doc += `\n\n---\n\n`;
  });

  doc += `\n> 생성: Workflow OS 마스터 기획서 에디터 v1.0`;

  navigator.clipboard.writeText(doc).then(() => {
    const status = document.getElementById('copy-status');
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 3000);
    showToast('전체 기획서가 클립보드에 복사되었습니다!');
  });
}

// ────────────────────────────────────────────────
// Markdown 내보내기
// ────────────────────────────────────────────────
function exportMarkdown() {
  let md = `# Workflow OS 마스터 기획서\n\n> 생성: ${new Date().toLocaleString('ko-KR')}  \n> 버전: v1.0\n\n`;
  md += `## 목차\n\n`;
  SECTIONS.forEach((sec, i) => md += `${i+1}. [${sec.title}](#${sec.id})\n`);
  md += `\n---\n\n`;

  SECTIONS.forEach(sec => {
    const content = (document.getElementById(`area-${sec.id}`) || {}).value || '';
    md += `## ${sec.title} {#${sec.id}}\n\n`;
    md += `> **Stage**: ${sec.stage}  \n`;
    md += `> ${sec.desc}\n\n`;
    md += content.trim() || '*(미작성)*';
    md += `\n\n---\n\n`;
  });

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `workflow-os-plan-${Date.now()}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Markdown 파일이 다운로드되었습니다');
}

// ────────────────────────────────────────────────
// 진행률 업데이트
// ────────────────────────────────────────────────
function updateProgress() {
  const done = Object.values(state.doneMap).filter(Boolean).length;
  const total = SECTIONS.length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progress-label').textContent = `${done} / ${total} 섹션 작성`;
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ────────────────────────────────────────────────
// 토스트 메시지
// ────────────────────────────────────────────────
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// ────────────────────────────────────────────────
// 스크롤 → 네비 하이라이트
// ────────────────────────────────────────────────
function setupScrollSpy() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('section-', '');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const navEl = document.getElementById(`nav-${id}`);
        if (navEl) navEl.classList.add('active');
      }
    });
  }, { threshold: 0.3 });

  SECTIONS.forEach(sec => {
    const el = document.getElementById(`section-${sec.id}`);
    if (el) observer.observe(el);
  });
}

// ────────────────────────────────────────────────
// 로컬 스토리지 자동 저장
// ────────────────────────────────────────────────
function autoSave() {
  const data = {};
  SECTIONS.forEach(sec => {
    const el = document.getElementById(`area-${sec.id}`);
    if (el) data[sec.id] = el.value;
  });
  localStorage.setItem('workflow-os-plan', JSON.stringify(data));
}

function autoLoad() {
  try {
    const saved = JSON.parse(localStorage.getItem('workflow-os-plan') || '{}');
    SECTIONS.forEach(sec => {
      if (saved[sec.id]) {
        const el = document.getElementById(`area-${sec.id}`);
        if (el) {
          el.value = saved[sec.id];
          onInput(sec.id, saved[sec.id]);
        }
      }
    });
  } catch(e) {}
}

// ────────────────────────────────────────────────
// 초기화
// ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildNav();
  buildSections();
  autoLoad();
  setupScrollSpy();
  setInterval(autoSave, 5000);

  // 첫 번째 nav 활성
  const firstNav = document.querySelector('.nav-item');
  if (firstNav) firstNav.classList.add('active');
});
</script>

</body>
